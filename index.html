function renderResults(){
  const n = Q.total;
  const pct = Math.round(Q.score / n * 100);
  const esLeccion = !!LESSON[Q.id];
  const pasa = pct >= PASS;
  let nextL = null, yaEstaba = false, destrabo = false;
  if (esLeccion){
    const prev = S.lessons[Q.id] || {};
    yaEstaba = !!prev.done;
    const i = ALL_LESSONS.indexOf(LESSON[Q.id]);
    nextL = ALL_LESSONS[i + 1] || null;
    const antes = nextL ? isUnlocked(nextL.id) : true;
    S.lessons[Q.id] = {done: yaEstaba || pasa, best: Math.max(prev.best || 0, pct), at: Date.now()};
    save();
    destrabo = !!nextL && !antes && isUnlocked(nextL.id);
  }
  const faltan = Math.ceil(PASS / 100 * n);
  const nFr = esLeccion ? phrasesOf(Q.id).length : 0;
  const hitoNuevo = nFr && pasa && !yaEstaba && !hitoSeen(Q.id);
  let msg;
  if (!esLeccion) msg = pct >= 90 ? 'Excelente. El dibujo es un hanamaru, la flor que los maestros japoneses dibujan sobre los trabajos muy buenos.'
    : pct >= 70 ? 'Bien. Repasá los errores de abajo: son lo que todavía no está firme.'
    : 'Todavía no está firme. Repetí la ronda; con dos o tres vueltas se asienta.';
  else if (pasa) msg = (pct >= 90 ? 'Excelente: lección aprobada. El dibujo es un hanamaru, la flor que los maestros japoneses dibujan sobre los trabajos muy buenos.'
    : 'Lección aprobada. Repasá los errores de abajo antes de seguir: son lo que todavía no está firme.') + (destrabo ? ' Destrabaste «' + nextL.title + '».' : '') + (hitoNuevo ? ' Y ya podés leer ' + nFr + ' frases nuevas.' : '');
  else if (yaEstaba) msg = 'Esta vez no llegaste al ' + PASS + ' %, pero la lección ya estaba aprobada. Repasá los errores de abajo.';
  else msg = 'Para aprobar hace falta el ' + PASS + ' %: ' + faltan + ' de ' + n + '. Repasá los errores de abajo y repetí la práctica' + (nextL ? '; al aprobar se destraba' + (nFr ? 'n «' + nextL.title + '» y ' + nFr + ' frases.' : ' «' + nextL.title + '».') : '.');
  const mark = pct >= 90 ? '<svg class="hanamaru" data-k="hanamaru" viewBox="0 0 160 160" aria-hidden="true"><path d="' + hanamaruPath(80, 80) + '"/></svg>'
    : pct >= (esLeccion ? PASS : 70) ? '<svg class="hanamaru" data-k="maru" viewBox="0 0 160 160" aria-hidden="true"><path d="' + maruPath(80, 80) + '"/></svg>' : '';
  const rep = Q.repeats ? '<p class="results-extra">Puntaje sobre el primer intento de cada pregunta. Repetiste ' + Q.repeats + (Q.repeats === 1 ? ' vez.' : ' veces.') + '</p>' : '';
  // en los repasos, cada error dice de qué lección viene
  const wrong = Q.wrong.length ? '<h2>Para repasar</h2><ul class="wrong">' + Q.wrong.map(q => '<li>' + jpify(esc(q.sum)) + (q.src ? '<span class="w-src"> · ' + jpify(esc(q.src)) + '</span>' : '') + '</li>').join('') + '</ul>' : '';
  const sigue = nextL && isUnlocked(nextL.id);
  const acciones = !esLeccion
    ? '<button class="btn primary wide center" data-act="restart">Otra ronda</button>'
    : hitoNuevo
    ? hitoBtn(Q.id, nFr) + '<button class="btn wide" data-act="restart">Repetir práctica</button>'
    : (sigue && (pasa || yaEstaba)
        ? '<a class="btn primary wide has-kicker" href="#/l/' + nextL.id + '"><span class="btn-kicker">Siguiente lección</span>' + '<span>' + jpify(esc(nextL.title)) + '</span>' + '</a><button class="btn wide" data-act="restart">Repetir práctica</button>'
        : '<button class="btn primary wide center" data-act="restart">Repetir práctica</button>' + (sigue ? '<a class="btn wide has-kicker" href="#/l/' + nextL.id + '"><span class="btn-kicker">Siguiente lección</span>' + '<span>' + jpify(esc(nextL.title)) + '</span>' + '</a>' : ''));
  return topNav(Q.back, 'Volver') +
    '<div class="results">' + mark +
      '<p class="score"><span class="big">' + Q.score + '</span> de ' + n + (esLeccion ? ' (' + pct + ' %)' : '') + '</p>' +
      '<p class="lede">' + jpify(esc(msg)) + '</p>' +
      rep +
      (Q.id === 'palabras' ? '<p class="results-extra">' + wordStatsText() + '</p>' : '') +
      '<div class="actions stack">' + acciones +
        '<a class="btn wide" href="' + Q.back + '">' + (Q.id === 'repaso' ? 'Volver al inicio' : Q.id === 'palabras' ? 'Volver a Mis palabras' : 'Volver a la lección') + '</a>' +
      '</div>' + wrong +
      (esLeccion && LESSON[Q.id].cycle ? '<h2>Las palabras de la lección</h2>' + wordListHTML(LESSON[Q.id]) : '') +
    '</div>';
}
function hanamaruPath(cx, cy){
  let d = '';
  const turns = 2, steps = 110, r0 = 2, r1 = 30;
  for (let i = 0; i <= steps; i++){
    const t = i / steps, ang = t * turns * 2 * Math.PI - Math.PI / 2, r = r0 + (r1 - r0) * t;
    d += (i ? 'L' : 'M') + (cx + r * Math.cos(ang)).toFixed(1) + ' ' + (cy + r * Math.sin(ang)).toFixed(1);
  }
  const R = 54, rr = 16, k = 11, n = 440;
  for (let i = 0; i <= n; i++){
    const t = i / n * 2 * Math.PI - Math.PI / 2;
    d += 'L' + (cx + R * Math.cos(t) + rr * Math.cos(k * t)).toFixed(1) + ' ' + (cy + R * Math.sin(t) + rr * Math.sin(k * t)).toFixed(1);
  }
  return d;
}
function maruPath(cx, cy){
  let d = '';
  for (let i = 0; i <= 90; i++){
    const t = i / 90 * 2.15 * Math.PI - Math.PI * 0.6, r = 50 + 4 * Math.sin(i / 90 * Math.PI);
    d += (i ? 'L' : 'M') + (cx + r * Math.cos(t)).toFixed(1) + ' ' + (cy + r * Math.sin(t)).toFixed(1);
  }
  return d;
}
// Sonido del resultado: con maru o hanamaru, trazo y frase de koto; sin marca, una nota. El cierre del hito no suena.
function resultSfx(){
  if (Q && Q.hito) return;
  const m = document.querySelector('svg.hanamaru');
  const quieto = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (m) SFX.aprobada(m.dataset.k, !quieto); else SFX.noAprobada();
}
function animateHanamaru(){
  const p = document.querySelector('.hanamaru path');
  if (!p) return;
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  try {
    const len = p.getTotalLength();
    p.style.strokeDasharray = len; p.style.strokeDashoffset = len;
    p.getBoundingClientRect();
    p.style.transition = 'stroke-dashoffset 1.6s cubic-bezier(.5,.1,.3,1)';
    requestAnimationFrame(() => { p.style.strokeDashoffset = '0'; });
  } catch(e){}
}

function touchWords(){ S.words.updated = Date.now(); }
function dayKey(t){ const d = new Date(t || Date.now()); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function wordPool(){
  const own = S.words.own.map(w => ({key:'u:' + w.id, id:w.id, k:w.k, es:w.es, kj:w.kj, src:'u'}));
  const seen = new Set(own.map(w => w.k));
  const course = [];
  // solo entran palabras de lecciones de palabras aprobadas (los ejemplos de las fichas de kana no se suman)
  const addC = (k, es, kj) => { if (!seen.has(k)){ seen.add(k); course.push({key:'c:' + k, k, es, kj, src:'c'}); } };
  ALL_LESSONS.forEach(l => {
    if (!isDone(l.id)) return;
    if (l.words) l.words.forEach(w => addC(w.k, w.es, KANJI_EN_LISTAS ? w.kj : undefined));
  });
  return own.concat(course);
}

/* ---------- Salir de una práctica: confirmación ---------- */
// Se pregunta solo si hay algo que perder: una práctica en curso, pasada la primera pantalla (o con la primera
// ya respondida). Vale para «Salir», la casita y el gesto de volver del teléfono. En el resultado ya no.
function practicaEnCurso(){ return !!(Q && Q.items && Q.items.length && Q.i < Q.items.length && (Q.i > 0 || Q.answered)); }
function askLeave(href){
  closeSheet();
  const el = document.createElement('div');
  el.className = 'sheet-back conf-back';
  el.innerHTML = '<div class="sheet conf" role="dialog" aria-modal="true" aria-labelledby="confT"><h2 id="confT">¿Salir de la práctica?</h2>' +
    '<p>Si salís ahora, se pierde lo que llevás de esta práctica. La lección queda como estaba antes de empezar.</p>' +
    '<div class="actions stack"><button class="btn primary wide center" data-act="stay">Seguir practicando</button><button class="btn wide center" data-act="leave" data-href="' + esc(href) + '">Salir</button></div></div>';
  document.body.appendChild(el);
  document.body.classList.add('sheet-open');
  el.querySelector('[data-act="stay"]').focus({preventScroll:true});
}
// Gesto de volver: al empezar una práctica se suma una entrada al historial con la misma dirección (la «guardia»).
// Volver desde ahí aterriza en la práctica misma: si hay algo que perder se pregunta y la guardia se repone; si no,
// el gesto sigue de largo hasta la pantalla anterior. Si el navegador no deja sumar la entrada, todo sigue como antes.
function armGuard(){
  try {
    if (history.state && history.state.kasa === 'guardia') return;
    history.pushState({kasa:'guardia', ki:HIST.i + 1}, '');
    HIST.i++; HIST.pila.length = HIST.i; HIST.pila[HIST.i] = histDir(location.hash); histGuardar();
  } catch(e){}
}
window.addEventListener('popstate', e => {
  histMarcar();
  if (e.state && e.state.kasa === 'guardia') return;
  const parts = (location.hash || '#/').slice(1).split('/').filter(Boolean);
  if (parts[0] !== 'p' || !Q || Q.id !== parts[1]) return;              // otra pantalla: la navegación normal se ocupa
  if (document.querySelector('.conf-back:not(.closing)')){ closeSheet(true); armGuard(); return; }   // con la pregunta abierta, volver la cierra
  if (practicaEnCurso()){ armGuard(); askLeave(Q.back); return; }
  // práctica terminada: se sigue de largo hasta la pantalla anterior, sin volver a dibujar la práctica en el medio
  closeSheet(); VT.ignorar = location.hash; history.back();
});

/* ---------- Transiciones entre pantallas ---------- */
// Cada pantalla está en el camino (principal 0, temario 1, unidad 2) o en una capa que se abre encima
// (lección, herramientas y ajustes 1; práctica 2 sobre su lección; lo que se abre desde la capa 1, 2).
const VT = {cur:null, uaAt:0, ignorar:null, pend:false};
const VT_DUR = 200;   // en ms; la misma que --vt-dur en el CSS
function vtQuieto(){ return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); }
function pantallaDe(h){
  const parts = String(h || '').replace(/^#/, '').split('/').filter(Boolean);
  switch (parts[0]){
    case 'temario': return {key:'temario', camino:1};
    case 'u': return {key:'u/' + parts[1], camino:2};
    case 'l': return {key:'l/' + parts[1], capa:1, lec:lessonIndex(parts[1])};
    case 'tabla': case 'ajustes': return {key:parts[0], capa:1};
    case 'palabras': return parts[1] ? {key:parts.slice(0, 3).join('/'), capa:2} : {key:'palabras', capa:1};
    default: return {key:'', camino:0};
  }
}
function pantallaActual(parts){
  if (document.body.classList.contains('is-home')) return {key:'', camino:0};
  if (parts[0] === 'p' && Q && Q.id === parts[1]){
    const b = pantallaDe(Q.back), lid = Q.hito || (LESSON[Q.id] ? Q.id : null);
    return {key:'p/' + Q.id, capa:(b.capa || 0) + 1, lec:lid ? lessonIndex(lid) : null, prac:true};
  }
  return pantallaDe(parts.join('/'));
}
function direccion(a, b){
  if (!a || !b || a.key === b.key) return 'none';
  if (a.camino != null && b.camino != null) return b.camino > a.camino ? 'fwd' : b.camino < a.camino ? 'back' : 'fade';
  if (a.camino != null) return 'up';
  if (b.camino != null) return 'down';
  if (b.capa > a.capa) return 'up';
  // a otra lección («Siguiente lección», el pie de la lección, «Ir a»): se avanza o se retrocede por el camino
  if (a.lec != null && b.lec != null && a.lec !== b.lec) return b.lec > a.lec ? 'fwd' : 'back';
  if (b.capa < a.capa) return 'down';
  if (a.prac && b.prac) return 'fwd';   // del resultado al hito de la misma lección
  return 'fade';
}
// Cambia la pantalla con «update», que devuelve la dirección. Sin soporte, con «reducir movimiento», con la
// pestaña oculta o si el gesto de volver ya dibujó su propio deslizamiento, el cambio es instantáneo, como antes.
function vtCambio(update, animar){
  const r = document.documentElement;
  if (!animar || typeof document.startViewTransition !== 'function' || vtQuieto() || document.hidden || Date.now() - VT.uaAt < 1000){ update(); return; }
  // la barra de volver, si está tapada por una hoja o por la corrección, se va con su pantalla
  r.classList.toggle('vt-sinnavb', !!document.querySelector('.sheet-back:not(.closing), .qfeed:not([hidden])'));
  let dir = 'none';
  let t;
  VT.pend = true;   // entre la foto de salida y el dibujo nuevo, un segundo toque no debe volver a avanzar
  try {
    t = document.startViewTransition(() => {
      VT.pend = false;
      dir = update() || 'none';
      r.classList.remove('vt-sinnavb');
      r.style.setProperty('--vt-h', window.innerHeight + 'px');
      r.dataset.vt = dir;
    });
  } catch(e){ VT.pend = false; r.classList.remove('vt-sinnavb'); update(); return; }
  t.ready.then(() => { if (dir === 'none') t.skipTransition(); }).catch(() => {});
  t.finished.catch(() => {}).then(() => { VT.pend = false; if (r.dataset.vt === dir) delete r.dataset.vt; r.classList.remove('vt-sinnavb'); });
}
window.addEventListener('popstate', e => { if (e.hasUAVisualTransition) VT.uaAt = Date.now(); });

/* ---------- Historial: el gesto de volver sigue el camino de la app ----------
   Cada entrada del historial lleva su posición (ki) y la app recuerda qué pantalla hay en cada una (también si la
   página se recarga, por ejemplo al actualizar). Ir a una pantalla que ya está atrás en el historial («Volver», la
   casita, «Salir», volver a la lección, otra lección ya abierta) retrocede hasta ella en lugar de sumar una entrada;
   subir a una pantalla que no está atrás reemplaza la entrada actual. Así el gesto de volver del teléfono nunca
   rehace el camino hacia adelante, y desde la principal sale de la app. Abrir una práctica siempre suma. */
const HIST = {i:0, pila:[], listo:false, yendo:false};
try { const g = JSON.parse(sessionStorage.getItem('kasa-historial') || 'null'); if (g && Array.isArray(g.pila)) HIST.pila = g.pila; } catch(e){}
function histDir(h){ h = String(h || ''); return h === '' || h === '#' ? '#/' : h; }
function histGuardar(){ try { sessionStorage.setItem('kasa-historial', JSON.stringify({pila:HIST.pila})); } catch(e){} }
// Anota dónde estamos: en una entrada conocida (volver, adelantar, recargar) o en una nueva (un enlace, la primera carga)
function histMarcar(){
  const st = history.state;
  if (st && typeof st.ki === 'number') HIST.i = st.ki;
  else {
    HIST.i = HIST.listo ? HIST.i + 1 : 0;
    HIST.pila.length = HIST.i;
    try { history.replaceState(Object.assign({}, st || {}, {ki:HIST.i}), ''); } catch(e){}
  }
  HIST.pila[HIST.i] = histDir(location.hash);
  HIST.listo = true; HIST.yendo = false;
  histGuardar();
}
// Subir: cerrar una capa o retroceder por el camino (lección → unidad → temario → principal)
function esSubida(destino){
  const d = direccion(VT.cur, pantallaDe(destino));
  return d === 'down' || (d === 'back' && !!VT.cur && VT.cur.camino != null);
}
function ir(destino, subir){
  const d = histDir(destino);
  if (HIST.yendo || d === histDir(location.hash)) return;
  if (d.indexOf('#/p/') !== 0){
    for (let j = HIST.i - 1; j >= 0; j--){
      if (HIST.pila[j] === d){ HIST.yendo = true; setTimeout(() => { HIST.yendo = false; }, 1500); history.go(j - HIST.i); return; }
    }
    if (subir){
      try { history.replaceState({ki:HIST.i}, '', d); } catch(e){ location.hash = d; return; }
      route(); return;
    }
  }
  location.hash = d;
}
// Los enlaces de la app pasan por ir(), salvo que otro manejador ya los haya tomado (como la confirmación de salir
// de una práctica): por eso se registra al final, después del manejador general de toques.
function histClic(e){
  if (e.defaultPrevented || e.button || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
  const a = e.target.closest && e.target.closest('a[href^="#/"]');
  if (!a) return;
  e.preventDefault();
  const d = a.getAttribute('href');
  ir(d, esSubida(d));
}

/* ---------- Navegación ---------- */
function route(){
  histMarcar();
  if (VT.ignorar && location.hash === VT.ignorar){ VT.ignorar = null; return; }
  VT.ignorar = null;
  const antes = VT.cur;
  vtCambio(() => dibujarRuta(antes), !!antes);
}
function dibujarRuta(antes){
  const h = (location.hash || '#/').slice(1);
  const parts = h.split('/').filter(Boolean);
  closeSheet();
  cancelSay();
  if (TTS.ok){ TTS.token++; try { if (window.speechSynthesis.speaking || window.speechSynthesis.pending) window.speechSynthesis.cancel(); } catch(e){} }
  let html = '';
  let quizStarted = false;
  if (parts[0] === 'u') { Q = null; html = renderUnit(parts[1]); }
  else if (parts[0] === 'temario') { Q = null; html = renderTemario(); }
  else if (parts[0] === 'ajustes') { Q = null; html = renderSettings(); }
  else if (parts[0] === 'l') { Q = null; html = renderLesson(parts[1]); }
  else if (parts[0] === 'tabla') { Q = null; html = renderTable(); }
  else if (parts[0] === 'palabras') { Q = null; html = parts[1] === 'nueva' ? renderWordForm(null) : parts[1] === 'e' ? renderWordForm(parts[2]) : renderWords(); }
  else if (parts[0] === 'p') {
    if (LESSON[parts[1]] && !isUnlocked(parts[1])){ Q = null; html = renderLesson(parts[1]); }
    else if (startQuiz(parts[1])){ html = renderQuizScreen(); quizStarted = true; }
    else { Q = null; html = renderHome(); }
  }
  else { Q = null; html = renderHome(); }
  document.body.classList.toggle('is-home', html.indexOf('<div class="home">') === 0);
  app.innerHTML = html;
  document.body.classList.toggle('has-navb', !!app.querySelector('.navb'));
  moreOn = false;
  window.scrollTo(0, 0);
  if (parts[0] === 'temario'){
    // el temario se abre posicionado en la unidad actual
    const cu = currentUnit(), el = cu && cu.id > 1 ? document.getElementById('u-' + cu.id) : null;
    if (el) window.scrollTo(0, Math.max(0, el.getBoundingClientRect().top + window.scrollY - 24));
  }
  const h1 = app.querySelector('h1');
  if (h1){ h1.setAttribute('tabindex', '-1'); }
  if (parts[0] === 'palabras' && parts[1] === 'nueva'){ const f = document.getElementById('f-es'); if (f) f.focus(); }
  if (quizStarted && Q.items.length) onShow(Q.items[0]);
  if (quizStarted) armGuard();
  VT.cur = pantallaActual(parts);
  document.body.classList.toggle('capa', VT.cur.capa != null);
  return direccion(antes, VT.cur);
}

let devTaps = 0, devTimer = null;
function devTap(){
  devTaps++; clearTimeout(devTimer); devTimer = setTimeout(() => { devTaps = 0; }, 2500);
  if (devTaps < 5) return;
  devTaps = 0; DEV = !DEV;
  try { if (DEV) localStorage.setItem('jp-curso-dev', '1'); else localStorage.removeItem('jp-curso-dev'); } catch(e){}
  toast(DEV ? 'Modo prueba: todas las lecciones destrabadas.' : 'Modo prueba desactivado.');
  route();
}
document.addEventListener('click', e => {
  // el paraguas suena en todas las pantallas; la llave de prueba, solo en la principal (en otras reiniciaría la pantalla)
  if (e.target.closest && e.target.closest('.home-logo')){ SFX.cigarras(); if (document.body.classList.contains('is-home')) devTap(); return; }
  // salir de una práctica empezada (con «Salir» o la casita) pide confirmación
  const lk = e.target.closest && e.target.closest('.navb a, .kbar a');
  if (lk && practicaEnCurso()){ e.preventDefault(); askLeave(lk.getAttribute('href')); return; }
  if (e.target.closest && e.target.closest('#splash')){ SFX.cigarras(); hideSplash(); return; }
  const t = e.target.closest('[data-act]');
  if (!t){
    if (e.target.classList && e.target.classList.contains('sheet-back')) closeSheet(true);
    return;
  }
  const act = t.dataset.act;
  switch (act){
    case 'say': speak(t.dataset.jp); break;
    case 'sayslow': speak(t.dataset.jp, {rate:0.7}); break;
    case 'sayline': speak(t.dataset.jp, {pitch: t.dataset.v === 'f' ? 1.3 : 0.8}); break;
    case 'playall': { const L = LESSON[(location.hash.split('/')[2] || '')]; if (L && L.lines) speakSequence(L.lines); break; }
    case 'kana': openKana(t.dataset.k); break;
    case 'close': closeSheet(true); break;
    case 'stay': closeSheet(true); break;
    // la hoja no se cierra antes: se va con la pantalla que sale
    case 'leave': { const h = t.dataset.href || '#/'; if (histDir(location.hash) === histDir(h)) closeSheet(true); else ir(h, true); break; }
    case 'clear': { const r = t.closest('.sheet-back'); if (r && r._clear) r._clear(); break; }
    case 'guide': { const sqEl = t.closest('.sheet').querySelector('.trace-sq'); const hidden = sqEl.classList.toggle('hide-model'); t.setAttribute('aria-pressed', String(hidden)); t.textContent = hidden ? 'Mostrar modelo' : 'Ocultar modelo'; break; }
    case 'hitoread': { const q = Q && Q.items[Q.i]; if (q && q.type === 'hito'){ q.open = true; app.innerHTML = renderQuizScreen(); speak(q.ph.k); const b = app.querySelector('.hito-go'); if (b) b.focus({preventScroll:true}); } break; }
    case 'presrom': { const r = document.getElementById('presRom'); if (r){ r.hidden = !r.hidden; t.textContent = r.hidden ? 'Mostrar romaji' : 'Ocultar romaji'; } break; }
    case 'togglerom': {
      const bar = t.closest('.reveal-bar'), sig = bar && bar.nextElementSibling;
      const w = (sig && sig.classList.contains('rom-wrap')) ? sig : (t.closest('.rom-wrap') || document.querySelector('.rom-wrap'));
      if (w){ const on = w.classList.toggle('show-rom'); t.textContent = on ? 'Ocultar romaji' : 'Mostrar romaji'; }
      break; }
    case 'toggletext': { const w = t.closest('.reveal-wrap'); const hid = w.classList.toggle('hide-text'); t.textContent = hid ? 'Mostrar texto' : 'Ocultar texto'; break; }
    case 'opt': answer(Number(t.dataset.i)); break;
    case 'pair': pairTap(t); break;
    case 'place': if (!Q.answered && Q.placed.length < (Q.items[Q.i].need || Q.items[Q.i].tiles.length)){ Q.placed.push(Number(t.dataset.i)); SFX.ficha(); document.getElementById('orderArea').innerHTML = orderHTML(Q.items[Q.i]); } break;
    case 'unplace': if (!Q.answered){ const i = Number(t.dataset.i); Q.placed = Q.placed.filter(x => x !== i); SFX.ficha(true); document.getElementById('orderArea').innerHTML = orderHTML(Q.items[Q.i]); } break;
    case 'check': checkOrder(); break;
    case 'showopts': { Q.shown = true; const a = document.getElementById('optsArea'); a.innerHTML = optsHTML(Q.items[Q.i]); const b = a.querySelector('.opt'); if (b) b.focus({preventScroll:true}); break; }
    case 'wprev': { const k = document.getElementById('f-kana').textContent; if (k) speak(k); break; }
    case 'wsave': saveWord(); break;
    case 'nbrow': {
      const key = t.dataset.key, row = t.closest('.nb-row');
      if (NB.cover !== 'none' && !NB.open.has(key)){
        NB.open.add(key); if (row) row.classList.add('open');
        if (NB.cover === 'jp') speak(t.dataset.jp);
        const b = document.getElementById('nbAll'); if (b) b.textContent = nbAllOpen() ? 'Tapar de nuevo' : 'Destapar todo';
      } else speak(t.dataset.jp);
      break; }
    case 'nbcover': NB.cover = t.dataset.v; NB.open.clear(); rerenderWords(); break;
    case 'nbmix': NB.order = {}; wordPool().forEach(w => { NB.order[w.key] = Math.random(); }); NB.open.clear(); rerenderWords(); break;
    case 'nborig': NB.order = null; NB.open.clear(); rerenderWords(); break;
    case 'nball': {
      if (nbAllOpen()) NB.open.clear(); else wordPool().forEach(w => NB.open.add(w.key));
      document.querySelectorAll('.nb-row').forEach(r => r.classList.toggle('open', NB.open.has(r.dataset.key)));
      t.textContent = nbAllOpen() ? 'Tapar de nuevo' : 'Destapar todo';
      break; }
    case 'wdel':
      if (t.dataset.armed === '1'){ deleteWord(document.querySelector('.form').dataset.id); }
      else { t.dataset.armed = '1'; t.textContent = '¿Seguro? Tocá de nuevo'; setTimeout(() => { if (t.isConnected){ t.dataset.armed = ''; t.textContent = 'Borrar palabra'; } }, 4000); }
      break;
    case 'next': nextQuestion(); break;
    case 'restart': { if (VT.pend) break; const id = Q ? Q.id : 'repaso'; vtCambio(() => { startQuiz(id); app.innerHTML = renderQuizScreen(); window.scrollTo(0, 0); onShow(Q.items[0]); return 'fwd'; }, true); break; }
    case 'rate': S.settings.slow = t.dataset.v === '1'; save(); t.parentElement.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b === t))); speak('かさ'); break;
    case 'volmute': volSet(S.settings.sfxVol ? 0 : (S.settings.sfxPrev || 80), true); break;
    case 'devoff': DEV = false; try { localStorage.removeItem('jp-curso-dev'); } catch(e){} toast('Modo prueba desactivado.'); route(); break;
    case 'reset':
      if (t.dataset.armed === '1'){ const keep = {words:S.words, settings:S.settings}; S = Object.assign(freshState(), keep, {resetAt: Date.now()}); normalize(); save(); clearTimeout(remoteTimer); flushRemote(); applySettings(); toast('Progreso borrado.'); route(); }
      else { t.dataset.armed = '1'; t.textContent = '¿Seguro? Tocá de nuevo'; setTimeout(() => { if (t.isConnected){ t.dataset.armed = ''; t.textContent = 'Borrar'; } }, 4000); }
      break;
    case 'verbuscar': buscarVersion(); break;
    case 'verup': actualizarApp(); break;
    case 'instalar': instalar(); break;
    case 'abrirchrome': abrirChrome(); break;
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'volRng'){ S.settings.sfxVol = Number(t.value); SFX.volumen(); volShow(S.settings.sfxVol); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'volRng'){ volSet(Number(t.value), true); return; }
  if (t.dataset && t.dataset.set === 'romaji'){ S.settings.romaji = t.checked; save(); applySettings(); }
  if (t.dataset && t.dataset.set === 'think'){ S.settings.think = t.checked; save(); }
  if (t.id === 'f-kata') updatePreview();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeSheet(true);
  if (e.key === 'Enter' && e.target && e.target.id === 'f-es'){ e.preventDefault(); const r = document.getElementById('f-ro'); if (r) r.focus(); return; }
  if (e.key === 'Enter' && e.target && (e.target.id === 'f-ro' || e.target.id === 'f-kj')){ e.preventDefault(); saveWord(); return; }
  if (Q && !Q.answered && document.querySelector('.qopts') && /^[1-4]$/.test(e.key) && !document.querySelector('.sheet-back:not(.closing)')){
    const i = Number(e.key) - 1; if (Q.items[Q.i].opts && i < Q.items[Q.i].opts.length) answer(i);
  }
});
document.addEventListener('input', e => { if (e.target && e.target.id === 'f-ro') updatePreview(); });
window.addEventListener('hashchange', route);
document.addEventListener('click', histClic);   // después del manejador general de toques (ver histClic)
// Indicador de «hay más abajo»: degradé + flecha que salta tres veces al aparecer; se va al llegar al final
const moreFade = document.createElement('div'); moreFade.id = 'more-fade';
const moreBtn = document.createElement('button'); moreBtn.id = 'more-btn'; moreBtn.type = 'button'; moreBtn.setAttribute('aria-label', 'Ver más abajo');
document.body.append(moreFade, moreBtn);
moreBtn.addEventListener('click', () => window.scrollBy({top: Math.round(window.innerHeight * 0.6), behavior: 'smooth'}));
var moreRaf = 0, moreOn = false, finDoc = 0;
// Dónde termina el contenido real de la pantalla (sin contar el margen vacío que deja lugar a la barra de abajo)
function medirContenido(){
  let fin = 0;
  app.querySelectorAll('*').forEach(el => {
    if (el.matches('.quiz, .home') || el.closest('.navb, .qfeed')) return;
    const r = el.getBoundingClientRect();
    if (r.height && r.bottom > fin) fin = r.bottom;
  });
  finDoc = fin + window.scrollY;
}
// Tarjetas «¡Palabra nueva!» y «¡Ya podés leer!»: si a su botón le falta poco para verse entero sobre la barra de
// abajo, se aprietan los espacios (nunca las letras), solo lo necesario, hasta dejar su canto a 8 px de la barra.
// Si falta más de lo que se puede recuperar así, la tarjeta queda como está y aparece la flecha.
const APRIETE = [   // [elemento, propiedad, máximo que se le puede quitar, en px]
  ['.kbar', 'marginBottom', 4], ['.present', 'marginTop', 6],
  ['.present-card', 'marginTop', 4], ['.present-card', 'paddingTop', 6], ['.present-card', 'paddingBottom', 4],
  ['.present-es', 'marginTop', 2], ['.present-es', 'marginBottom', 2], ['.present-actions', 'marginBottom', 4],
  ['.enr', 'paddingTop', 2], ['.enr', 'paddingBottom', 2], ['.present > .btn', 'marginTop', 6]
];
const APRIETE_MAX = APRIETE.reduce((t, a) => t + a[2], 0);
function ajustarTarjeta(){
  if (!app.querySelector('.present')) return;
  const els = APRIETE.map(([sel, prop, max]) => [app.querySelector(sel), prop, max]).filter(a => a[0]);
  els.forEach(([el, prop]) => { el.style[prop] = ''; });
  const btn = app.querySelector('.present > .btn'), bar = app.querySelector('.navb');
  if (!btn || !bar) return;
  const falta = btn.getBoundingClientRect().bottom + window.scrollY + 4 + 8 - (window.innerHeight - bar.offsetHeight);   // 4: el canto; 8: aire
  if (falta <= 0 || falta > APRIETE_MAX) return;
  const k = falta / APRIETE_MAX;
  const vals = els.map(([el, prop]) => parseFloat(getComputedStyle(el)[prop]) || 0);
  els.forEach(([el, prop, max], i) => { el.style[prop] = (vals[i] - max * k).toFixed(2) + 'px'; });
}
function trasPintar(){ ajustarTarjeta(); medirContenido(); checkMore(); }
function checkMore(){
  cancelAnimationFrame(moreRaf);
  moreRaf = requestAnimationFrame(() => {
    const bar = app.querySelector('.navb');
    const visible = window.innerHeight - (bar ? bar.offsetHeight : 0);
    const on = finDoc - (window.scrollY + visible) > 16;   // la flecha, solo si queda contenido real debajo de la barra
    if (on && !moreOn){ moreBtn.classList.remove('hop'); void moreBtn.offsetWidth; if (window.scrollY < 20) moreBtn.classList.add('hop'); }
    moreOn = on; document.body.classList.toggle('more', on);
  });
}
window.addEventListener('scroll', checkMore, {passive: true});
window.addEventListener('resize', trasPintar);
if (document.fonts){ document.fonts.ready.then(trasPintar).catch(() => {}); try { document.fonts.addEventListener('loadingdone', trasPintar); } catch(e){} }
new MutationObserver(trasPintar).observe(app, {childList: true, subtree: true});

applySettings();
route();
initSync();
iniciarApp();
// Al irse la apertura, la barra del sistema pasa del crudo de la apertura al verde del panel de la barra superior
function hideSplash(){
  const sp = document.getElementById('splash'); if (!sp || sp.classList.contains('out')) return;
  sp.classList.add('out'); setTimeout(() => sp.remove(), 400);
  const tc = document.querySelector('meta[name="theme-color"]'); if (tc) tc.setAttribute('content', '#D9E8DF');
  setTimeout(avisoActualizada, 450);
}
setTimeout(hideSplash, 2000);
// Detrás de la apertura, dos cosas para que la primera vez que se abre cada pantalla no haya destello:
// se cargan de una vez las tipografías con todos los kana del curso (así ninguna pantalla nueva las pide justo
// al moverse) y se hace una transición de práctica, invisible
// bajo la apertura, para que el teléfono prepare el mecanismo antes del primer toque.
function precargarFuentes(){
  if (!document.fonts || typeof document.fonts.load !== 'function') return;
  const kana = [...new Set(TEXTO_DEL_CURSO.match(/[\u3000-\u30ff\uff01-\uff5e]/g) || [])].join('');
  const latin = 'AaBbÁáÉéÍíÓóÚúÑñÜü¿?¡!«»…—0123456789 %';
  const pedidos = [['400', '"Klee One"', kana], ['600', '"Klee One"', kana],
    ['400', '"Zen Kaku Gothic New"', latin], ['500', '"Zen Kaku Gothic New"', latin], ['700', '"Zen Kaku Gothic New"', latin]];
  pedidos.forEach(([w, f, t]) => { if (t) document.fonts.load(w + ' 16px ' + f, t).catch(() => {}); });
}
function precalentar(){
  precargarFuentes();
  const sp = document.getElementById('splash'), r = document.documentElement;
  if (!sp || typeof document.startViewTransition !== 'function' || vtQuieto() || document.hidden) return;
  sp.style.viewTransitionName = 'apertura';   // la apertura queda encima y quieta: la práctica no se ve
  const vuelta = (dir, luego) => {
    if (!sp.isConnected || sp.classList.contains('out')){ sp.style.viewTransitionName = ''; return; }
    let t;
    try { t = document.startViewTransition(() => { r.dataset.vt = dir; }); } catch(e){ sp.style.viewTransitionName = ''; return; }
    t.finished.catch(() => {}).then(() => { if (r.dataset.vt === dir) delete r.dataset.vt; if (luego) luego(); else sp.style.viewTransitionName = ''; });
  };
  vuelta('up', () => vuelta('fwd'));
}
setTimeout(precalentar, 250);
requestAnimationFrame(() => setTimeout(() => SFX.apertura(), 0));   // después de pintar la apertura
})();
