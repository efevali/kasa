<style>

/* ================= GUÍA DE ESTILO (dirección 2: "interfaz ilustrada") =================
   Interfaz
   - Todo elemento con forma lleva contorno índigo (--edge, grosor --bw). No hay líneas finas sueltas
     salvo separadores internos de listas (--line).
   - Lo que sobresale (botones, opciones, tarjetas, cartel) tiene "canto": una sombra plana, sin
     desenfoque, del color del contorno (--lift). Al tocar, el elemento baja ese canto (efecto de hundirse).
   - Esquinas redondeadas: 12-14px en botones y opciones, 16-20px en tarjetas, 22px en la barra superior y
     24px en el panel de herramientas de la principal y en las hojas que suben desde abajo.
   - Colores: ai (índigo) para la acción principal, midori para lo correcto y lo nuevo, shu (bermellón)
     para errores y el sello de lección hecha. Fondo verde agua (--paper). Sin degradés.
   - Tipografía: Klee One para japonés (forma manuscrita de libro escolar), Zen Kaku Gothic New para el resto.
     El logotipo かさ (apertura y barra superior) va en Shippori Mincho 700.
   - Excepción deliberada: los cuadros genkō (papel de práctica con guías punteadas) conservan su aspecto.
   Barra superior (todas las pantallas salvo la apertura; altura B, elegida sobre bocetos el 27/9/2026)
   - Panel con las esquinas abajo, de 64 px. A la izquierda el paraguas con かさ en vertical (44 px de alto;
     al tocarlo suenan las cigarras; cinco toques en la principal = modo prueba). Al centro, solo en las
     prácticas, «X de Y». A la derecha, el engranaje de Ajustes en la principal y la casita (いえ, techo de tejas
     y shōji) en todas las demás, que lleva al inicio. Se desplaza con el contenido: no queda fija.
   - «Volver» sigue abajo a la derecha (sube un nivel); la casita va directo al inicio.
   - El gesto de volver del teléfono sigue el camino de la app (corregido el 28/9/2026): «Volver», la casita y «Salir»
     retroceden en el historial en vez de sumarle pasos, así el gesto nunca rehace el camino hacia adelante y desde
     la principal sale de la app.
   - Salir de una práctica ya empezada (pasada la primera pantalla), con «Salir», con la casita o con el gesto
     de volver del teléfono, pide confirmar: se pierde lo hecho en esa práctica y la lección queda como estaba.
     En el resultado ya no se pregunta, porque ya está guardado.
   Transiciones entre pantallas (aprobadas el 28/9/2026, tras probarlas en el celular)
   - Horizontal = avanzar o retroceder por un camino: principal ↔ temario ↔ unidad, los pasos dentro de una
     práctica (pantalla a pantalla hasta el resultado) y pasar a otra lección. Adelante, la nueva entra por la
     derecha empujando a la anterior; atrás, al revés.
   - Vertical = abrir y cerrar: lección, práctica (una capa más sobre la lección), herramientas, ajustes y hojas
     (ficha de kana, confirmación de salir, corrección). Abrir: la capa sube desde abajo y tapa a la de abajo, que
     se apaga apenas; cerrar: baja y la descubre.
   - La barra superior no se anima nunca: es la constante del curso. Solo se funde lo que cambia en ella
     (engranaje o casita, «X de Y»). Si la pantalla que sale estaba desplazada, la barra aparece arriba, en su
     lugar, sin deslizarse.
   - La barra de «Volver» también queda quieta (solo se funde el rótulo); si una hoja la tapa, se va con su
     pantalla. En las pantallas que se cierran bajando (capas), su flecha apunta hacia abajo (⌄); en el camino, ‹.
   - Una sola duración (0,2 s, «rápida») y una sola curva para todo, que frena al llegar y sin rebote. Con «reducir movimiento»
     del teléfono no hay animación. Si el gesto de volver ya dibuja su propio deslizamiento, la app no suma el suyo.
   App instalable (desde el 28/9/2026; repositorio kasalearn/kasa en GitHub, publicado con GitHub Pages)
   - Ícono: el wagasa del logo solo, sin grillo ni letras, con sus colores, sobre crudo, dentro de la zona que
     ninguna forma de recorte de Android corta (herramientas/iconos.py). La pantalla de carga de Android usa el
     mismo crudo que la apertura, así que se ve el paraguas solo y después la apertura.
   - Barra del sistema: crudo durante la apertura; después, el verde del panel de la barra superior.
   - Funciona sin conexión: todo queda guardado en el teléfono (sw.js), también las tipografías, recortadas a lo
     que usa el curso (herramientas/fuentes.py). La voz depende del paquete de japonés del teléfono.
   - Versión: última fila de Ajustes, «Versión 0.2.0» con su fecha. Versionado semántico MAYOR.MENOR.PARCHE (parche:
     arreglos; menor: algo nuevo que no rompe lo anterior; mayor: el salto grande; la 1.0.0 es la versión estable y
     revisada). Al día: «Buscar» (busca en el momento). Con una
     nueva: línea verde «Hay una versión nueva» y «Actualizar» (primario), que reabre la app ya actualizada y avisa
     «Listo». Mientras haya una nueva, un punto verde (midori, el color de lo nuevo) en el engranaje de la principal.
     Si no se toca, la nueva entra sola al cerrar la app del todo y volver a abrirla.
   - Instalación guiada (aprobada el 28/9/2026), solo cuando Kasa se abre en el navegador: tarjeta arriba de la
     unidad actual, con el ícono, «Instalá Kasa en tu teléfono» y «Instalar» (primario). El botón abre el cuadro de
     instalación de Chrome si ya lo permite (Chrome lo habilita tras un toque y unos 30 s en la página); si no, una
     hoja «Instalar Kasa» con dos pasos numerados del menú ⋮ y la nota «Abrir en Chrome» para quien viene de otra app,
     o los dos pasos de Safari en iPhone. Instalada, la tarjeta pasa a «Listo» en verde. Con la app abierta desde su
     ícono no aparece nunca.
   - En Samsung Internet (0.2.1): Android bloquea el paquete que arma Samsung, así que «Instalar» no usa esa
     instalación: la hoja explica que desde ese navegador Android la bloquea y ofrece «Abrir en Chrome» (primario,
     lleva el mismo enlace a Chrome) y «Ahora no». Sin logos de marcas ajenas en el botón.
   - Vista previa: el artefacto «Kasa» de claude.ai muestra la fila de versión sin botón: ahí no se instala ni
     se actualiza.
   Dibujos (enriquecimientos)
   - Lienzo 300x300 con fondo #D8EBE0 y esquinas de 24. Contorno #1F2A44 de 4 unidades (2.5 en pétalos
     y detalles chicos), uniones redondeadas. Colores planos, sin sombras ni degradés.
   - Paleta: índigo #3D5A80, bermellón #D9483B, crudo #F7F3EA, piel #F5D0B0, madera #7A4A2E/#8B5A36,
     verde #6AA55A/#5F8F4E, sakura #F7C9D4, gris teja #566173. Mejillas #F2A7A0.
   - Lo que la palabra enseña va al centro y es lo más grande; el fondo va recortado por el borde.
   - Detalles japoneses verificados (kimono con izquierda sobre derecha, carteles, etc.).
   - Revisar cada dibujo renderizado, grande y a 140px, antes de publicarlo.
   Preguntas con dibujo: zona marcada
   - Nunca se pregunta por el dibujo entero. Cada dibujo define zonas (ZONAS, junto a ILL) y la pregunta
     marca una: velo #EEF5F0 al 72 % sobre el resto y contorno punteado #1F2A44 (3.5 de grosor, trazo 9/8).
     El dibujo de abajo no cambia, así que una misma escena sirve para varias palabras con zonas distintas.
   - La zona encierra solo lo que la palabra nombra, con aire alrededor. Enunciado único:
     «¿Qué palabra muestra la parte marcada?». Al responder, el velo se levanta y se ve la escena entera.
   - Los colores se preguntan solo con dibujos en los que el color es lo único que queda dentro de la zona,
     y nunca salen como opciones en las preguntas con dibujo. Lo mismo vale para toda palabra que nombra una
     cualidad o un momento (colores, adjetivos, momentos del día, estaciones): llevan atr:true.
   - En la presentación, si la escena tiene más de una zona, también se marca la de la palabra.
   - Cada escena declara además lo que muestra sin zona propia (ESCENA_TAMBIEN, junto a ZONAS): la cara del
     rostro, el estanque del jardín, el mar del puerto… Esas palabras nunca salen como opción en sus preguntas.
   Textos de enriquecimiento: máximo 170 caracteres, para que la presentación entre sin desplazarse.
   Palabra nueva de 6 kana o más: va en un solo renglón, un poco más chica (nunca se parte).
   Sin kanji en los enriquecimientos ni en las asociaciones mientras el curso no enseñe kanji: el formato
   «kanji desglosado» (t:'kanji') queda guardado para cuando empiecen.
   Sonidos (efectos; la voz va aparte)
   - Todos se sintetizan en el momento (Web Audio, motor SFX): nada grabado ni de terceros. Timbres acústicos
     japoneses, cortos y suaves, sin graves que el parlante del celular no reproduce. Nunca un sonido que castigue.
   - Acierto: koto, dos cuerdas que suben (la, re). Error: madera grave y apagada (拍子木, hyōshigi).
   - Emparejar: cada par correcto, una campanita que sube por la escala yo (陽音階: re, mi, sol, la, si);
     el par equivocado, la madera más suave.
   - Armar la palabra: cada ficha colocada, una pieza de shōgi sobre el tablero; al sacarla, la misma más suave.
   - Resultado con maru o hanamaru: el trazo del marcador sigue la animación del dibujo y, cuando cierra, una frase
     de koto en escala yo. Sin marca: una sola cuerda grave. El cierre del hito no suena.
   - Hito de frases: fūrin de hierro (南部風鈴, Nanbu fūrin) al aparecer cada tarjeta «¡Ya podés leer!».
   - Al responder, el efecto va primero y la palabra entra cuando el efecto ya se apagó: 0,55 s después del acierto
     y 0,4 s después del error (VOZ_TRAS), contados desde que el efecto empieza a sonar. El motor se despierta al
     mostrar cada pantalla y se suspende tras 60 s sin sonidos. Sin sonido en los toques de botones, la navegación
     ni la apertura.
   - Verano de Evangelion: minminzemi sintetizada y ajustada a grabaciones reales (una cerca haciendo un ciclo entero
     y dos lejos que ya venían cantando, unos 5 s). Suena al abrir si el navegador deja sonar sin toque previo (con la
     app instalada; si no, al tocar la apertura) y al tocar el paraguas de la barra. Sigue sobre la principal y se
     apaga sola con el «miiiiii» largo; tocar mientras suena no la reinicia.
   - Volumen: deslizador en Ajustes, fila «Efectos de sonido» (solo efectos; la voz y el volumen general quedan
     en los botones del teléfono). En cero no hay efectos; el parlante silencia y vuelve al nivel anterior; al
     soltar suena un acierto de muestra. Curva cuadrática: 80 % es el nivel aprobado.
   - Alternativas probadas y descartadas (y los insectos de Japón): muestrario «Sonidos de Kasa»,
     https://claude.ai/artifact/FupLejW7Y4gQkUpSJopp9G
   ==================================================================================== */
:root{
  --paper:#E4EFE8; --card:#FBFDFC; --panel:#D9E8DF; --ink:#1F2A44; --ink-2:#4F5F6A;
  --ai:#2B4C7E; --on-ai:#FFFFFF; --ai-soft:#DCE5F1; --shu:#B8392B; --midori:#2F6A52;
  --guide:#9BBBAE; --line:#C7D2CE; --scrim:rgba(12,20,26,.46);
  --rule:rgba(43,76,126,.2); --margin:rgba(184,57,43,.5); --on-midori:#FFFFFF; --strip:#DCE3E0; --strip-edge:rgba(23,34,45,.14);
  --f-jp:"Klee One","Hiragino Maru Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;
  --f-ui:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,-apple-system,"Segoe UI",sans-serif;
  --edge:#1F2A44; --bw:2.5px; --lift:4px; --tint:#EAF3ED; --ok-soft:#D8ECDF; --shu-soft:#F7E0DC;
  color-scheme:light;
}
/* Modo oscuro: pendiente, se decide al final (y se elegiría desde Ajustes). Mientras tanto la app va siempre en
   claro, aunque el teléfono o el visor estén en oscuro. Esta paleta queda guardada para entonces y no se usa. */
:root[data-kasa-tema="oscuro"]{
  --paper:#10171C; --card:#162027; --panel:#1A252C; --ink:#E2E8E5; --ink-2:#9DABB3;
  --ai:#93B2E2; --on-ai:#0D1520; --ai-soft:#1E2E44; --shu:#E6705F; --midori:#7FC4A5;
  --guide:#35544B; --line:#27353B; --scrim:rgba(0,0,0,.6);
  --rule:rgba(147,178,226,.17); --margin:rgba(230,112,95,.5); --on-midori:#0D1520; --strip:#26333A; --strip-edge:rgba(0,0,0,.45);
  --edge:#070B0E; --tint:#1C282F; --ok-soft:#1C3A2E; --shu-soft:#3F2320;
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;background:var(--paper)}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:17px;line-height:1.7;-webkit-tap-highlight-color:transparent}
body.sheet-open{overflow:hidden}
#app{max-width:640px;margin:0 auto;padding:18px 20px 72px}
h1,h2,h3{line-height:1.3;margin:0}
h1{font-family:var(--f-jp);font-weight:600;font-size:34px;letter-spacing:-.005em;margin:6px 0 10px}
h2{font-size:21px;font-weight:700;margin:36px 0 12px}
h3{font-size:16px;font-weight:700;color:var(--ink-2);margin:22px 0 4px}
p{margin:0 0 12px;max-width:62ch}
a{color:var(--ai);text-underline-offset:3px}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ai);outline-offset:2px}
.jp,.jpi{font-family:var(--f-jp);font-weight:600}
.jpi{font-size:1.05em}
.rom{color:var(--ink-2)}
body.no-romaji .rom{display:none}
.lede{font-size:18px;color:var(--ink-2)}
.hint{font-size:15.5px;color:var(--ink-2);margin-top:14px}
.note{border-left:3px solid var(--guide);padding:2px 0 2px 14px;color:var(--ink-2);font-size:16.5px}

/* ---- Cuadro genkō (papel de práctica) ---- */
.sq{--s:56px;position:relative;isolation:isolate;display:inline-grid;place-items:center;width:var(--s);height:var(--s);
  border:1.5px solid var(--guide);background:var(--card);font-family:var(--f-jp);font-weight:600;font-size:calc(var(--s) * .6);line-height:1;color:var(--ink)}
.sq::before,.sq::after{content:"";position:absolute;z-index:-1;pointer-events:none}
.sq::before{left:50%;top:0;bottom:0;border-left:1px dashed var(--guide)}
.sq::after{top:50%;left:0;right:0;border-top:1px dashed var(--guide)}
.sq.faint>span{opacity:.2}
.sq.big{--s:140px}

/* ---- Inicio (Kasa) ----
   Pantalla sin desplazamiento: arriba, la barra superior común (paraguas con かさ y el engranaje de ajustes);
   al centro la tarjeta de la unidad actual (abre el temario) y el botón de continuar; abajo, la caja de
   herramientas en un panel inferior. El aire entre la barra y la tarjeta es deliberado. */
#app{--padx:20px}
body.is-home{height:100%}
body.is-home #app{min-height:100%;display:flex;flex-direction:column;padding-bottom:0}
.home{flex:1;display:flex;flex-direction:column}
/* ---- Barra superior: la misma en todas las pantallas (altura B) ----
   Tres columnas: logo a la izquierda, «X de Y» centrado en la pantalla (solo en las prácticas) y el botón a la
   derecha (engranaje en la principal, casita en el resto). El margen negativo la lleva de borde a borde. */
.kbar{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px;margin:calc(-18px - env(safe-area-inset-top,0px)) calc(-1 * var(--padx)) 14px;padding:calc(10px + env(safe-area-inset-top,0px)) var(--padx) 9px;background:var(--panel);border-bottom:var(--bw) solid var(--edge);border-radius:0 0 22px 22px}
.home .kbar{margin-bottom:0}
/* Paraguas y かさ del mismo alto: el trazo de か empieza a la altura del borde del paraguas y el de さ termina
   con el mango (margen negativo medido sobre Shippori Mincho). El bloque mide lo mismo que el paraguas,
   así el relleno de la barra lo deja centrado. Medidas del logo de 52 px escaladas a 44 px. */
.home-logo{justify-self:start;display:flex;align-items:flex-start;gap:7.6px;height:43.5px;cursor:pointer;-webkit-user-select:none;user-select:none}
.home-logo svg{display:block;flex:none;width:44px;height:43.5px}
.home-ka{font-family:"Shippori Mincho",serif;font-weight:700;font-size:22.67px;letter-spacing:1.86px;line-height:1;color:var(--ink);writing-mode:vertical-rl;white-space:nowrap;margin-top:-2.88px}
.kbar-c{font-size:16px;line-height:1.2;color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.kbar-btn{--lift:3px;justify-self:end;position:relative;display:grid;place-items:center;width:40px;height:40px;margin-bottom:var(--lift);background:var(--card);border:var(--bw) solid var(--edge);border-radius:12px;box-shadow:0 var(--lift) 0 var(--edge);color:var(--ink)}
.kbar-btn svg{width:27px;height:27px}
.kbar-btn::after{content:"";position:absolute;inset:-5px}   /* zona de toque de 48 px, más grande que el dibujo */
.home-mid{flex:1;display:flex;flex-direction:column;justify-content:center;gap:22px;padding:16px 0 28px}
.ucard{display:block;padding:16px 18px 14px;background:var(--card);border:var(--bw) solid var(--edge);border-radius:20px;box-shadow:0 5px 0 var(--edge);color:var(--ink);text-decoration:none}
.uc-top{display:grid;grid-template-columns:40px 1fr;gap:4px;align-items:start}
.ucard .u-num{font-size:32px;line-height:1.05}
.uc-lab{font-size:15px;color:var(--ink-2);line-height:1.4}
.uc-title{font-size:20px;font-weight:700;line-height:1.3}
.u-kana{white-space:nowrap}
.ucard .dots{align-items:center;gap:7px;margin-top:10px}
.ucard .dots i{width:11px;height:11px;border-width:1.8px}
.uc-n{font-size:15px;color:var(--ink-2);margin-left:6px}
.uc-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px;padding-top:10px;border-top:1.5px solid var(--line);font-size:15.5px}
.uc-foot .g{color:var(--ink-2)}
.uc-foot .t{display:flex;align-items:center;gap:8px;color:var(--ai);font-weight:700}
.uc-foot .t::after{content:"";width:8px;height:8px;border-right:2.4px solid currentColor;border-top:2.4px solid currentColor;transform:rotate(45deg)}
.home-go{font-size:20px;padding:13px 18px;border-radius:14px}
.home-go .btn-kicker{font-size:15px}
.home-go.is-off{opacity:.45;box-shadow:none;cursor:default}
.home-mid .dev-note{margin:-8px 0 0}
.toolbox{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:0 calc(-1 * var(--padx)) calc(-1 * env(safe-area-inset-bottom,0px));padding:18px var(--padx) calc(24px + env(safe-area-inset-bottom,0px));background:var(--panel);border-top:var(--bw) solid var(--edge);border-radius:24px 24px 0 0}
.tool{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px 10px;background:var(--card);border:var(--bw) solid var(--edge);border-radius:14px;box-shadow:0 var(--lift) 0 var(--edge);color:var(--ink);text-decoration:none;text-align:center;font-size:15px;font-weight:700;line-height:1.25}
.tool svg{display:block;flex:none}

.vol-btn{flex:none;display:grid;place-items:center;width:44px;height:44px;margin-bottom:3px;padding:0;background:var(--card);border:var(--bw) solid var(--edge);border-radius:12px;box-shadow:0 3px 0 var(--edge);color:var(--ai);cursor:pointer;transition:transform .07s ease-out,box-shadow .07s ease-out}
.vol-btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--edge)}
.vol-btn.off{color:var(--ink-2)}
.vol-rng{flex:1;min-width:0;height:34px;margin:0;background:none;-webkit-appearance:none;appearance:none;cursor:pointer}
.vol-rng::-webkit-slider-runnable-track{box-sizing:border-box;height:14px;border:var(--bw) solid var(--edge);border-radius:999px;background:linear-gradient(to right,var(--ai) 0 var(--v,80%),var(--card) var(--v,80%) 100%)}
.vol-rng::-webkit-slider-thumb{-webkit-appearance:none;box-sizing:border-box;width:28px;height:28px;margin-top:-9.5px;border-radius:50%;background:var(--card);border:var(--bw) solid var(--edge);box-shadow:0 3px 0 var(--edge);transition:transform .07s ease-out,box-shadow .07s ease-out}
.vol-rng:active::-webkit-slider-thumb{transform:translateY(3px);box-shadow:0 0 0 var(--edge)}
.vol-rng::-moz-range-track{box-sizing:border-box;height:14px;border:var(--bw) solid var(--edge);border-radius:999px;background:var(--card)}
.vol-rng::-moz-range-progress{height:9px;border-radius:999px;background:var(--ai)}
.vol-rng::-moz-range-thumb{box-sizing:border-box;width:28px;height:28px;border-radius:50%;background:var(--card);border:var(--bw) solid var(--edge);box-shadow:0 3px 0 var(--edge)}
.tool-n{position:absolute;top:-11px;right:-8px;min-width:30px;padding:0 7px;background:var(--ai-soft);border:2px solid var(--edge);border-radius:10px;font-size:13.5px;font-weight:700;line-height:1.5}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
/* ---- Temario (pantalla propia) ---- */
.u-cur{font-size:15px;font-weight:700;color:var(--ai);margin-top:4px}
/* ---- Apertura ---- */
#splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:#F7F3EA;transition:opacity .35s ease-out}
#splash.out{opacity:0;pointer-events:none}
.sp-lk{display:flex;align-items:flex-start;gap:12px}
.sp-wg{display:block;width:163px;height:161px;margin-top:7px}
.sp-tb{display:flex;flex-direction:column;align-items:center}
.sp-ka{font-family:"Shippori Mincho",serif;font-weight:700;font-size:60px;letter-spacing:6px;line-height:1;color:#1F2A44;writing-mode:vertical-rl}
.sp-ro{font-family:"Shippori Mincho",serif;font-weight:600;font-size:22px;letter-spacing:4.5px;line-height:1;color:#1F2A44;margin-top:15px}

/* ---- Botones ---- */
.btn{display:inline-flex;align-items:center;gap:8px;justify-content:flex-start;min-height:48px;padding:11px 16px;border:var(--bw) solid var(--edge);border-radius:12px;background:var(--card);box-shadow:0 var(--lift) 0 var(--edge);color:var(--ink);text-decoration:none;font-weight:500;cursor:pointer;line-height:1.35;text-align:left}
@media (hover:hover){.btn:hover{background:#FFFFFF}}
.btn.primary{background:var(--ai);border-color:var(--edge);color:var(--on-ai);font-weight:700}
@media (hover:hover){.btn.primary:hover{background:var(--ai);filter:brightness(1.07)}}
.btn.primary .jpi{font-weight:600}
.btn.wide{display:flex;width:100%}
.btn.small{--lift:3px;min-height:40px;padding:7px 12px;font-size:16px;border-radius:10px}
.btn[disabled]{opacity:.4;cursor:default;box-shadow:none}
.btn svg{flex:none}
.btn-kicker{display:block;font-size:15px;font-weight:500;opacity:.85}
.btn.wide{justify-content:center;text-align:center}
.btn.has-kicker{flex-direction:column;align-items:flex-start;justify-content:center;gap:0;text-align:left}
.actions{margin:28px 0 8px}
.actions.stack{display:grid;gap:14px}

/* ---- Temario ---- */
.units,.lessons{list-style:none;margin:0;padding:0}
.unit{display:grid;grid-template-columns:44px 1fr;gap:4px;padding:14px 16px;background:var(--card);border:var(--bw) solid var(--edge);border-radius:16px;box-shadow:0 var(--lift) 0 var(--edge);color:var(--ink);text-decoration:none}
.units li+li,.lessons li+li{margin-top:14px}
.u-num{font-family:var(--f-jp);font-weight:600;font-size:28px;line-height:1.1;color:var(--ai)}
.u-body{display:grid;gap:2px}
.u-title{font-size:18px;font-weight:700}
.u-kana{font-family:var(--f-jp);font-weight:600;font-size:16px;color:var(--ink-2);margin-left:6px}
.u-desc{font-size:16px;color:var(--ink-2);line-height:1.55}
.dots{display:flex;gap:6px;margin-top:8px}
.dots i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--ai)}
.dots i.on{background:var(--ai)}
.unit.off{opacity:.62;box-shadow:none;border-style:dashed}
.unit.off .u-num{color:var(--ink-2)}
.u-soon{font-size:15px;color:var(--ink-2);margin-top:4px}
a.unit:hover .u-title{text-decoration:underline;text-underline-offset:3px}

.top{margin-bottom:6px}
/* ---- Barra inferior de navegación (volver abajo a la derecha, cerca del pulgar) ---- */
.navb{position:fixed;left:0;right:0;bottom:0;z-index:15;display:flex;justify-content:flex-end;align-items:center;min-height:62px;padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));background:var(--paper);border-top:1.5px solid var(--line)}
.navb-in{width:100%;max-width:640px;margin:0 auto;display:flex;justify-content:flex-end}
.navb .back{min-height:44px;padding:0 18px 0 16px;border-radius:22px;background:var(--card);border:1.5px solid var(--line);color:var(--ink-2)}
body.has-navb #app{padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))}
/* ---- Indicador de «hay más abajo» ---- */
#more-fade{position:fixed;left:0;right:0;bottom:0;height:56px;z-index:14;pointer-events:none;background:linear-gradient(to bottom,transparent,var(--paper) 85%);opacity:0;transition:opacity .25s}
#more-btn{position:fixed;left:50%;bottom:14px;z-index:16;width:40px;height:40px;margin-left:-20px;padding:0;border-radius:50%;border:1.5px solid var(--line);background:var(--card);box-shadow:0 2px 6px rgba(31,42,68,.14);display:grid;place-items:center;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .25s}
#more-btn::before{content:"";width:9px;height:9px;border-right:2.2px solid var(--ink-2);border-bottom:2.2px solid var(--ink-2);transform:translateY(-2px) rotate(45deg)}
body.has-navb #more-fade{bottom:calc(62px + env(safe-area-inset-bottom,0px))}
body.has-navb #more-btn{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
body.more #more-fade{opacity:1}
body.more #more-btn{opacity:1;pointer-events:auto}
body.more #more-btn.hop{animation:hop .9s ease-in-out 3}
@keyframes hop{0%,100%{transform:translateY(0)}45%{transform:translateY(6px)}}
@media (prefers-reduced-motion:reduce){body.more #more-btn.hop{animation:none}}
body.sheet-open #more-btn,body.sheet-open #more-fade{opacity:0;pointer-events:none}
.back{display:inline-flex;align-items:center;min-height:44px;font-size:16px;color:var(--ink-2);text-decoration:none}
.back::before{content:"";width:8px;height:8px;border-left:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);margin-right:10px}
.page-h{margin-bottom:18px}
.u-label{font-size:15.5px;color:var(--ink-2);margin:0}

.lesson-row{display:grid;grid-template-columns:44px 1fr;align-items:center;gap:6px;padding:12px 16px 12px 12px;background:var(--card);border:var(--bw) solid var(--edge);border-radius:16px;box-shadow:0 var(--lift) 0 var(--edge);color:var(--ink);text-decoration:none}
.l-mark{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;border:1.5px solid var(--guide);font-family:var(--f-jp);font-weight:600;font-size:16.5px;color:var(--ink-2)}
.lesson-row.done .l-mark{border:2.5px solid var(--shu);transform:rotate(-8deg);border-top-color:transparent}
.l-body{display:grid}
.l-title{font-weight:700}
.l-meta{font-size:15.5px;color:var(--ink-2)}
.next-link{margin-top:36px;padding-top:16px;color:var(--ink-2);font-size:16px}

/* ---- Kana ---- */
.kana-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:8px 0}
.kana-grid.small{grid-template-columns:repeat(5,minmax(0,1fr))}
.kcell,.tcell{container-type:inline-size;display:grid;justify-items:center;gap:4px;padding:0;border:0;background:none;cursor:pointer;color:var(--ink)}
.kcell .sq,.tcell .sq{width:100%;height:auto;aspect-ratio:1/1;font-size:32px;font-size:60cqw}
.kcell:hover .sq,.tcell:hover .sq{border-color:var(--ai)}
.kr{font-size:15.5px;color:var(--ink-2);line-height:1.2}
.kana-grid.small .kr{font-size:15px}
.ktable{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px 6px;margin:10px 0 8px}
.thead{display:contents}
.thead span{text-align:center;font-size:15px;color:var(--ink-2)}
.tcell.faint .sq>span{opacity:.2}
.tcell.empty{visibility:hidden}

/* ---- Texto de lección ---- */
.lesson-text section h2{margin-top:34px}
.lesson-text section:first-child h2{margin-top:20px}
.exs,.dialogue,.words{background:var(--card);border:var(--bw) solid var(--edge);border-radius:16px;box-shadow:0 var(--lift) 0 var(--edge);overflow:hidden}
.exs{margin:10px 0 20px}
.exs>.ex:last-child,.dialogue li:last-child .ex,.words li:last-child{border-bottom:0}
.ex{display:grid;grid-template-columns:30px 1fr;gap:8px;width:100%;padding:12px 14px;border:0;border-bottom:1.5px solid var(--line);background:none;text-align:left;cursor:pointer;color:var(--ink)}
.ex:hover{background:var(--panel)}
.ex-play{color:var(--ai);padding-top:4px}
.ex-t{display:grid;gap:1px}
.ex .jp{font-size:22px;line-height:1.45}
.ex .rom{font-size:16px}
.ex .es{font-size:16.5px}
.spk{font-size:15px;color:var(--ink-2)}
.dline.playing .ex{background:var(--ai-soft)}
.dialogue{list-style:none;margin:0;padding:0}
.reveal-bar{display:flex;justify-content:flex-end;gap:10px;margin:14px 0 4px}
.reveal-wrap.hide-text .ex-t>:not(.spk){filter:blur(7px);user-select:none}
.scripts{margin:12px 0 18px;padding:16px;background:var(--card);border:var(--bw) solid var(--edge);border-radius:16px}
.scripts-line{font-size:30px;line-height:1.6;margin:0}
.scripts-line span{padding-bottom:2px}
.s-h{color:var(--ink)} .s-k{color:var(--ai)} .s-kj{color:var(--midori)}
.scripts-line .s-h{border-bottom:3px solid currentColor}
.scripts-line .s-k{border-bottom:3px dashed currentColor}
.scripts-line .s-kj{border-bottom:4px double currentColor}
.scripts .rom,.scripts .es{margin:4px 0 0;font-size:16px}
.legend{margin:14px 0 0;display:grid;gap:10px}
.legend div{display:grid;grid-template-columns:86px 1fr;gap:10px}
.legend dt{font-weight:700;font-size:16px;justify-self:start;align-self:start;line-height:1.4}
.legend dt.s-h{border-bottom:3px solid currentColor}.legend dt.s-k{border-bottom:3px dashed currentColor}.legend dt.s-kj{border-bottom:4px double currentColor}
.legend dd{margin:0;font-size:16px;color:var(--ink-2)}
.kosoado{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.kosoado div{display:grid;padding:12px;border:2px solid var(--edge);border-radius:12px;background:var(--card);font-size:15.5px;color:var(--ink-2)}
.kosoado .jp{font-size:26px;color:var(--ink)}
@media (min-width:560px){.kosoado{grid-template-columns:repeat(4,1fr)}}

/* ---- Vocabulario ---- */
.words{list-style:none;margin:10px 0 4px;padding:0}
.words li{border-bottom:1.5px solid var(--line)}
.word{display:grid;grid-template-columns:30px minmax(0,1.1fr) minmax(0,1fr);gap:8px;align-items:start;width:100%;padding:12px 14px;border:0;background:none;text-align:left;cursor:pointer;color:var(--ink)}
.word:hover{background:var(--panel)}
.w-main{display:grid}
.w-k{font-size:24px;line-height:1.35}
.w-main .rom{font-size:15.5px}
.w-es{display:grid;font-size:16.5px;padding-top:3px}
.w-kj{font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;font-size:16px;color:var(--ink-2)}
.w-note{font-size:15.5px;color:var(--ink-2);margin:-4px 0 12px 40px}
.phrases .word{grid-template-columns:30px 1fr}
.phrases .w-es{grid-column:2}

.rom-wrap .rom{display:none}
.rom-wrap.show-rom .rom{display:block}

/* ---- Práctica ---- */
.quiz{padding-bottom:24px}
.quiz.has-feed{padding-bottom:300px}
.qprompt{text-align:center;padding:10px 0 4px}
.qlabel{font-size:16px;color:var(--ink-2);margin:0 auto 14px}
.qcard{display:inline-grid;justify-items:center;gap:2px;min-width:200px;max-width:100%;padding:14px 28px 16px;background:var(--card);border:var(--bw) solid var(--edge);border-radius:20px;box-shadow:0 5px 0 var(--edge);margin-bottom:5px}
.qkana{margin:4px 0 6px}
.qrom{font-size:44px;font-weight:700;margin:0;letter-spacing:.02em}
.qjp{font-size:40px;line-height:1.4;margin:0}
.qes{font-size:24px;margin:0;max-width:none}
.qaudio{display:flex;flex-direction:column;align-items:center;gap:10px}
.audio-btn{display:inline-flex;align-items:center;gap:10px;padding:16px 28px;border:var(--bw) solid var(--edge);border-radius:999px;background:var(--card);box-shadow:0 var(--lift) 0 var(--edge);color:var(--ai);font-weight:700;font-size:18px;cursor:pointer}
.audio-btn svg{width:30px;height:30px}
.qsub{font-size:18px;color:var(--ink-2);margin:2px 0 0}
.opt-sub{display:block;font-family:var(--f-ui);font-weight:500;font-size:15.5px;color:var(--ink-2);margin-top:3px}
.qopts{display:grid;gap:14px 12px;margin-top:24px}
.qopts.grid2{grid-template-columns:1fr 1fr}
.opt{position:relative;min-height:58px;padding:12px 44px 12px 16px;border:var(--bw) solid var(--edge);border-radius:14px;background:var(--card);box-shadow:0 var(--lift) 0 var(--edge);text-align:left;font-size:17px;cursor:pointer;color:var(--ink)}
.qopts.grid2 .opt{text-align:center;padding:12px 16px}
@media (hover:hover){.opt:hover:not([disabled]){background:#FFFFFF}}
.opt.jp{font-size:22px}
.opt.bigk{font-size:36px;line-height:1.2}
.opt[disabled]{cursor:default}
.opt.ok{background:var(--ok-soft);color:var(--midori)}
.opt.bad{background:var(--shu-soft);color:var(--shu)}
.opt.ok::after,.opt.bad::after{content:"";position:absolute;right:12px;top:50%;width:22px;height:22px;margin-top:-11px}
.opt.ok::after{right:16px;width:9px;height:16px;margin-top:-12px;border-right:3px solid var(--midori);border-bottom:3px solid var(--midori);transform:rotate(42deg)}
.opt.bad::after{background:linear-gradient(45deg,transparent 43%,var(--shu) 43%,var(--shu) 57%,transparent 57%),linear-gradient(-45deg,transparent 43%,var(--shu) 43%,var(--shu) 57%,transparent 57%)}
.qfeed{position:fixed;left:-3px;right:-3px;bottom:0;z-index:20;background:var(--card);border:var(--bw) solid var(--edge);border-bottom:0;border-radius:24px 24px 0 0;padding:16px 20px calc(16px + env(safe-area-inset-bottom,0px));max-height:70vh;overflow:auto}
.feed-in{--markcol:40px;--markgap:12px;max-width:600px;margin:0 auto;display:grid;grid-template-columns:var(--markcol) minmax(0,1fr);gap:6px var(--markgap);align-items:start}
.feed-body{min-width:0}
.feed-in .btn{grid-column:1 / -1;margin-top:8px;align-items:center;justify-content:center;text-align:center}
.mark{width:34px;height:34px;margin-top:2px}
.is-ok .mark,.is-bad .mark{position:relative;border-radius:50%}
.is-ok .mark{background:var(--midori)}
.is-ok .mark::after{content:"";position:absolute;left:12px;top:6px;width:9px;height:16px;border-right:3.5px solid #FFFFFF;border-bottom:3.5px solid #FFFFFF;transform:rotate(42deg)}
.is-bad .mark{background:var(--shu)}
.is-bad .mark::before,.is-bad .mark::after{content:"";position:absolute;left:9px;top:15.25px;width:16px;height:3.5px;border-radius:2px;background:#FFFFFF;transform:rotate(45deg)}
.is-bad .mark::after{transform:rotate(-45deg)}
.feed-chosen{margin:3px 0 2px;color:var(--shu)}
.feed-t{font-weight:700;margin:2px 0 5px;padding-right:calc(var(--markcol) + var(--markgap));display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 14px}
.feed-t>span{min-width:0}
.feed-t .jp{font-size:20px}
.feed-reveal{margin:0 0 4px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.feed-reveal .jp{font-size:20px;word-break:keep-all}   /* una oración corta solo entre palabras */
.feed-mean{margin-left:auto;text-align:right;color:var(--midori);font-size:20px;font-weight:700;line-height:1.35;overflow-wrap:anywhere}
.feed-ex{font-size:16px;color:var(--ink-2);margin:0 0 4px}
.feed-hook{display:flex;align-items:center;gap:12px;margin:8px 0 10px;padding:10px 12px;background:var(--tint);border-radius:12px}
.feed-hook .ill{width:68px;flex:none;border-radius:10px}
.feed-hook p{margin:0;font-size:15.5px;line-height:1.45;color:var(--ink-2)}
.feed-hook p b{color:var(--ink);font-weight:700}
.hook-k{flex:none;font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;font-size:40px;line-height:1;color:var(--ink)}
.order{margin-top:18px}
.placed{display:flex;flex-wrap:wrap;gap:10px 8px;min-height:70px;padding:10px;border:2px dashed var(--guide);border-radius:14px;margin-bottom:14px;align-items:center}
.placed.ok{border-style:solid;border-color:var(--midori);background:var(--ok-soft)}
.placed.bad{border-style:solid;border-color:var(--shu);background:var(--shu-soft)}
.placeholder{font-size:15.5px;color:var(--ink-2)}
.bank{display:flex;flex-wrap:wrap;gap:12px 8px;margin-bottom:18px}
.tile{--lift:3px;padding:8px 14px;min-height:48px;border:var(--bw) solid var(--edge);border-radius:12px;background:var(--card);box-shadow:0 var(--lift) 0 var(--edge);font-size:22px;cursor:pointer;color:var(--ink)}
.tile.es{font-size:19px;font-weight:500}
.tile.ghost{opacity:.22;cursor:default;box-shadow:none}

/* ---- Presentación de palabras (lecciones en ciclo) ---- */
.present{display:grid;justify-items:center;text-align:center;padding:0 0 10px;margin-top:-8px}
.present-top{position:absolute;inset:0 0 auto 0;height:0}
.present-count{position:absolute;left:16px;top:10px;font-size:14px;line-height:1.2;color:var(--ink-2)}
.present-card .badge-new{position:absolute;right:14px;top:-18px}
.badge-new{background:var(--midori);color:var(--on-midori);font-weight:700;font-size:15px;padding:3px 14px;border:var(--bw) solid var(--edge);border-radius:999px;box-shadow:0 3px 0 var(--edge)}
.present-card{position:relative;margin-top:20px;width:100%;display:grid;justify-items:center;padding:24px 18px 18px;background:var(--card);border:var(--bw) solid var(--edge);border-radius:20px;box-shadow:0 5px 0 var(--edge)}
.present-word{font-size:56px;line-height:1.15;margin:0;white-space:nowrap}
.present-word.long{font-size:min(56px,12.5vw)}   /* 6 kana o más: un solo renglón, un poco más chica */
.present-rom{font-size:18px;line-height:1.3;color:var(--ink-2);margin:2px 0 0}
.present-es{font-size:26px;line-height:1.3;font-weight:700;margin:6px 0 12px;max-width:none}
.present-actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-bottom:16px}
.present>.btn{margin-top:18px}
.enr{width:100%;text-align:left;padding:12px 14px;background:var(--tint);border-radius:12px}
.enr p{margin:0;font-size:16px;line-height:1.45;max-width:none}
.enr .enr-label{font-size:15px;line-height:1.4;font-weight:700;color:var(--midori);margin-bottom:2px}
.enr-kanji{display:flex;align-items:center;gap:16px;margin:2px 0 10px!important}
.enr-k{white-space:nowrap;font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;font-size:52px;line-height:1}
.enr-parts{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 8px;font-size:16px;color:var(--ink-2)}
.enr-parts b{font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;font-size:26px;font-weight:400;color:var(--ink)}
.enr-plus{color:var(--ink-2)}
.enr-dibujo{border:0;background:none;display:grid;justify-items:center;padding:0}

/* ---- Resultado ---- */
.results{padding-top:8px}
.hanamaru{display:block;width:150px;height:150px;margin:0 auto 6px}
.hanamaru path{fill:none;stroke:var(--shu);stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.score{margin:0;text-align:center;font-size:18px;color:var(--ink-2);max-width:none}
.score .big{font-family:var(--f-jp);font-weight:600;font-size:64px;color:var(--ink);margin-right:6px;line-height:1.1}
.results>.lede{text-align:center;margin:10px auto 0}
.wrong{margin:0;padding:0;list-style:none;border-top:1px solid var(--line)}
.wrong li{padding:10px 0;border-bottom:1px solid var(--line);font-size:16.5px}

/* ---- Ficha ---- */
.sheet-back{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:600px;max-height:92%;overflow:auto;background:var(--paper);border:var(--bw) solid var(--edge);border-bottom:0;border-radius:24px 24px 0 0;padding:14px 20px calc(28px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.sheet-back{align-items:center}.sheet{border-radius:20px;border-bottom:var(--bw) solid var(--edge)}}
.sheet-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sheet-r{font-family:var(--f-jp);font-weight:600;font-size:22px}
.sheet-r b{font-family:var(--f-ui);font-size:18px;color:var(--ink-2);margin-left:6px}
.trace-area{display:grid;justify-items:center}
.trace-wrap{position:relative;width:min(72vw,280px);aspect-ratio:1/1;container-type:inline-size;background:var(--card);border:var(--bw) solid var(--edge);border-radius:16px;box-shadow:0 5px 0 var(--edge);overflow:hidden}
.trace-wrap .trace-sq{border:0}
.trace-sq{position:absolute;inset:0;width:100%;height:100%;font-size:62cqw}
.trace-sq>span{opacity:.24}
.trace-sq.hide-model>span{visibility:hidden}
.trace-wrap canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.trace-ctl{display:flex;flex-wrap:wrap;gap:12px 8px;justify-content:center;margin-top:18px}
.trace-area .hint{text-align:center;max-width:44ch}

/* ---- Ajustes ---- */
.settings{margin-top:8px;padding:2px 16px 4px;background:var(--card);border:var(--bw) solid var(--edge);border-radius:20px;box-shadow:0 5px 0 var(--edge)}
.set{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 0;border-top:1.5px solid var(--line)}
.settings .set:first-child{border-top:0}
.dev-set b{color:var(--shu)}
/* Versión (app instalable): línea verde cuando hay una nueva y punto en el engranaje de la principal */
.ver-new{display:flex;align-items:center;gap:8px;color:var(--midori);font-weight:700;font-size:15.5px;line-height:1.45}
.ver-dot{flex:none;width:12px;height:12px;border-radius:50%;background:var(--midori);border:2px solid var(--edge)}
.kbar-btn .gear-dot{position:absolute;top:-7px;right:-7px;width:16px;height:16px;border-radius:50%;background:var(--midori);border:2.5px solid var(--edge)}
/* Instalación guiada (solo en el navegador): tarjeta arriba de la unidad actual y hoja con los pasos */
.inst{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:12px 14px;background:var(--card);border:var(--bw) solid var(--edge);border-radius:18px;box-shadow:0 4px 0 var(--edge)}
.inst-ic{display:block;flex:none;width:44px;height:44px;border-radius:50%;border:2px solid var(--edge);background:#F7F3EA}
.inst b{display:block;font-size:16.5px;line-height:1.3}
.inst small{display:block;font-size:14.5px;color:var(--ink-2);line-height:1.35;margin-top:2px}
.inst.ok{grid-template-columns:auto minmax(0,1fr);background:var(--ok-soft)}
.inst-tick{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--midori);border:2px solid var(--edge)}
.inst-head{display:flex;align-items:center;gap:12px;margin:6px 0 2px}
.inst-head .inst-ic{width:48px;height:48px}
.conf .inst-head h2{margin:0}
.conf .inst-texto{margin:12px 0 0;color:var(--ink);font-size:16.5px;line-height:1.5}
.pasos{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:14px}
.pasos li{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;align-items:start;font-size:16.5px;line-height:1.45}
.pasos .n{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--ai-soft);border:2px solid var(--edge);font-weight:700;font-size:16px}
.tecla{display:inline-grid;place-items:center;vertical-align:-7px;width:30px;height:30px;margin:0 2px;border-radius:8px;background:var(--card);border:2px solid var(--edge)}
.inst-nota{margin-top:16px;padding:10px 12px;border-radius:12px;background:var(--tint);border:1.5px solid var(--line);font-size:15px;color:var(--ink-2);line-height:1.45}
/* Con la tarjeta, en pantallas bajas o angostas se compactan solo los espacios (nunca las letras) para que la
   principal siga entrando sin desplazarse */
@media (max-height:720px){.home-mid:has(.inst){gap:14px;padding:6px 0 14px}}
@media (max-width:380px){.inst{gap:10px;padding:10px 12px}.inst .inst-ic{width:38px;height:38px}}
.set-t{display:grid}
.set-t small{font-size:15.5px;color:var(--ink-2);line-height:1.45}
/* Volumen de los efectos: el parlante silencia y vuelve al nivel anterior; al soltar suena un acierto de muestra */
.set-vol{flex-direction:column;align-items:stretch;gap:10px}
.vol{display:flex;align-items:center;gap:12px}
.vol-n{flex:none;min-width:3.2em;text-align:right;font-size:15.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.switch{appearance:none;-webkit-appearance:none;flex:none;width:54px;height:32px;border-radius:16px;background:var(--paper);border:var(--bw) solid var(--edge);position:relative;cursor:pointer;margin:0;transition:background .2s}
.switch::before{content:"";position:absolute;top:2px;left:2px;width:23px;height:23px;border-radius:50%;background:#FFFFFF;border:2px solid var(--edge);transition:transform .2s}
.switch:checked{background:var(--ai)}
.switch:checked::before{transform:translateX(20px)}
.seg{display:inline-flex;border:var(--bw) solid var(--edge);border-radius:12px;overflow:hidden;flex:none;background:var(--card);box-shadow:0 3px 0 var(--edge)}
.seg button{border:0;background:none;padding:8px 12px;cursor:pointer;min-height:40px;font-size:16px}
.seg button[aria-pressed="true"]{background:var(--ai);color:var(--on-ai);font-weight:700}

#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-16px);z-index:60;max-width:min(90vw,480px);padding:12px 16px;border-radius:12px;background:var(--ink);color:var(--paper);font-size:16px;line-height:1.45;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ---- Mis palabras ---- */
.btn.center{justify-content:center;text-align:center}
.w-stats{font-size:16.5px}
.think-set{margin-top:6px;border-bottom:1px solid var(--line)}
.h-count{font-size:16px;font-weight:500;color:var(--ink-2);margin-left:4px}
.nb{--side:34px;margin:8px 0 10px;background:var(--card);border:var(--bw) solid var(--edge);border-radius:14px;box-shadow:0 var(--lift) 0 var(--edge);overflow:hidden}
.nb.own{--side:84px}
.nb-head,.nb-row{display:grid;grid-template-columns:minmax(0,1fr) var(--side);border-bottom:1px solid var(--rule)}
.nb-row:last-child{border-bottom:0}
.nb-head{border-bottom:1.5px solid var(--rule)}
.nb-hmain,.nb-main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.nb-hmain span{padding:6px 10px 5px 12px;font-size:15px;color:var(--ink-2)}
.nb-hmain .h-es{border-left:1.5px solid var(--margin);padding-left:14px}
.nb-main{padding:0;border:0;background:none;text-align:left;cursor:pointer;color:var(--ink);font:inherit;align-items:stretch}
.nb-main:hover{background:var(--panel)}
.nb-jp{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 8px;padding:8px 10px 8px 12px}
.nb-jp .jp{font-size:21px;line-height:1.45}
.nb-kj{font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;font-size:15.5px;color:var(--ink-2)}
.nb-es{padding:11px 8px 9px 14px;border-left:1.5px solid var(--margin);font-size:16.5px;line-height:1.45}
.nb-side{display:flex;align-items:center;justify-content:flex-end;gap:10px;padding-right:10px}
.nb-edit{font-size:15.5px;padding:6px 0}
.st{display:inline-block;flex:none;vertical-align:middle}
.st-firm{width:15px;height:15px;border:2px solid var(--shu);border-radius:50%}
.st-learn{width:7px;height:7px;border-radius:50%;background:var(--ink-2);opacity:.6}
.st-new{width:7px;height:7px}
.legend-st .st{margin:0 3px 0 6px}
.legend-st .st:first-child{margin-left:0}
.nb-tools{margin:20px 0 0;padding:4px 0 14px;display:grid;gap:10px;border-bottom:1px solid var(--line)}
.tools-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.nb-tools .hint{margin:0}
.nb-jp,.nb-es{position:relative;overflow:hidden}
.nb-jp::after,.nb-es::after{content:"";position:absolute;inset:0;background:var(--strip);pointer-events:none;transition:transform .3s cubic-bezier(.4,0,.2,1)}
.nb-es::after{transform:translateX(102%);box-shadow:-3px 0 6px var(--strip-edge)}
.nb-jp::after{transform:translateX(-102%);box-shadow:3px 0 6px var(--strip-edge)}
.nb.cover-es .nb-row:not(.open) .nb-es::after,.nb.cover-jp .nb-row:not(.open) .nb-jp::after{transform:none}
.nb.cover-es .nb-main:hover .nb-es::after,.nb.cover-jp .nb-main:hover .nb-jp::after{filter:brightness(.97)}
.qplay{margin-top:10px}
.think{margin-top:22px;text-align:center}
.think .hint{margin:0 auto 10px}
.results-extra{text-align:center;font-size:16px;color:var(--ink-2);margin:6px auto 0}
.field{display:grid;gap:6px;margin:16px 0}
.field>span{font-weight:700;font-size:16px}
.field input{font:inherit;font-size:18px;min-height:50px;padding:10px 14px;border:var(--bw) solid var(--edge);border-radius:12px;background:var(--card);color:var(--ink)}
.field input:focus{border-color:var(--ai);outline:none;box-shadow:0 0 0 3px var(--ai-soft)}
.preview{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:74px;padding:10px 14px;background:var(--card);border:2px dashed var(--guide);border-radius:12px}
#f-kana{font-size:32px;line-height:1.3;word-break:break-all}
#f-kana:empty::before{content:"かな";opacity:.2}
.field-err{color:var(--shu);font-size:15.5px;margin:8px 0 0}
.form .set{border-bottom:1px solid var(--line);margin-top:10px}


/* ---- Emparejar pares ---- */
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.pcol{display:grid;gap:14px;align-content:start}
.pair{--lift:4px;min-height:56px;padding:10px 12px;border:var(--bw) solid var(--edge);border-radius:14px;background:var(--card);box-shadow:0 var(--lift) 0 var(--edge);font-size:17px;line-height:1.3;color:var(--ink);cursor:pointer;transition:transform .07s ease-out,box-shadow .07s ease-out,background .15s,opacity .35s}
.pair.jp{font-size:22px}
.pair.sel{background:var(--ai-soft);transform:translateY(var(--lift));box-shadow:0 0 0 var(--edge)}
.pair.done{background:var(--ok-soft);color:var(--midori);transform:translateY(var(--lift));box-shadow:0 0 0 var(--edge);opacity:.4;cursor:default}
.pair.spare{border-style:dashed;box-shadow:none;transform:translateY(var(--lift));color:var(--ink-2);opacity:.55;background:transparent;text-decoration:line-through;text-decoration-thickness:1.5px;cursor:default}
.pair.bad{background:var(--shu-soft);color:var(--shu);animation:pairshake .32s}
@keyframes pairshake{0%,100%{translate:0}25%{translate:-5px}75%{translate:5px}}
/* ---- Dibujos ---- */
.ill{display:block;width:100%;height:auto;border:var(--bw) solid var(--edge);border-radius:16px}
.enr-dibujo .ill{width:170px}
.qill .ill{width:150px;margin:4px 0}
.ill .veil{transition:opacity .45s ease-out}
.qill.lifted .ill .veil{opacity:0}
/* ---- Lecciones bloqueadas (se destraban al aprobar la anterior con 80 %) ---- */
.lesson-row.locked{background:var(--tint);border-style:dashed;box-shadow:none;color:var(--ink-2);cursor:default}
.lesson-row.locked .l-mark{border-color:transparent;color:var(--ink-2)}
.lesson-row.locked .l-mark svg{display:block}
.locked-box{margin:8px 0 0;padding:16px;background:var(--tint);border:var(--bw) dashed var(--edge);border-radius:16px}
.locked-box p{margin:0 0 14px;color:var(--ink-2)}
.pass-hint{font-size:15.5px;color:var(--ink-2);margin:12px 0 0;text-align:center;max-width:none}
.dev-note{font-size:15px;color:var(--shu);margin:14px 0 0}
/* ---- Tocar: el elemento baja su canto ---- */
.kbar-btn,.tool,.ucard,.btn,.opt,.tile,.audio-btn,.unit,.lesson-row{transition:transform .07s ease-out,box-shadow .07s ease-out}
.kbar-btn:active,.tool:active,a.ucard:active,.pair:active:not([disabled]):not(.sel),.btn:active:not([disabled]):not(.is-off),.opt:active:not([disabled]),.tile:active:not(.ghost),.audio-btn:active,a.unit:not(.off):active,a.lesson-row:active{transform:translateY(var(--lift));box-shadow:0 0 0 var(--edge)}

/* ---- Transiciones entre pantallas (ver la guía de estilo) ----
   El navegador saca una foto de la pantalla que se va (old) y anima hacia la nueva (new). La barra superior y,
   si se eligió «quieta», la de volver tienen foto propia y quedan en su lugar; solo se funde lo que cambia.
   data-vt en <html> dice la dirección: fwd / back (lateral), up / down (capas), fade (cambio sin dirección). */
:root{--vt-dur:200ms;--vt-ease:cubic-bezier(.4,0,.2,1);--vt-h:100vh}
.kbar{view-transition-name:kbar}
.navb{view-transition-name:navb}
:root.vt-sinnavb .navb{view-transition-name:none}
/* la barra superior nunca se mueve: queda en su lugar aunque la pantalla que sale estuviera desplazada */
::view-transition-group(kbar){animation:none}
/* debajo de las fotos, papel: si el teléfono tarda un cuadro en tener lista una foto, se ve papel y no el fondo
   oscuro del visor (el «destello negro» de la primera vez) */
::view-transition{background:var(--paper)}
/* transición de práctica al abrir (ver precalentar): la apertura queda tal cual, encima de todo */
::view-transition-old(apertura){animation:none;opacity:0}
::view-transition-new(apertura){animation:none}
::view-transition-group(*){animation-duration:var(--vt-dur);animation-timing-function:var(--vt-ease)}
::view-transition-old(*),::view-transition-new(*){animation-duration:var(--vt-dur);animation-timing-function:var(--vt-ease)}
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
@keyframes vt-sal-izq{to{transform:translateX(-100%)}}
@keyframes vt-sal-der{to{transform:translateX(100%)}}
@keyframes vt-ent-der{from{transform:translateX(100%)}}
@keyframes vt-ent-izq{from{transform:translateX(-100%)}}
@keyframes vt-sube{from{transform:translateY(var(--vt-h))}}
@keyframes vt-baja{to{transform:translateY(var(--vt-h))}}
@keyframes vt-apaga{to{filter:brightness(.9)}}
@keyframes vt-enciende{from{filter:brightness(.9)}}
@keyframes vt-funde-sal{to{opacity:0}}
@keyframes vt-funde-ent{from{opacity:0}}
:root[data-vt="fwd"]::view-transition-old(root),:root[data-vt="fwd"]::view-transition-old(navb):only-child{animation:vt-sal-izq var(--vt-dur) var(--vt-ease) both}
:root[data-vt="fwd"]::view-transition-new(root),:root[data-vt="fwd"]::view-transition-new(navb):only-child{animation:vt-ent-der var(--vt-dur) var(--vt-ease) both}
:root[data-vt="back"]::view-transition-old(root),:root[data-vt="back"]::view-transition-old(navb):only-child{animation:vt-sal-der var(--vt-dur) var(--vt-ease) both}
:root[data-vt="back"]::view-transition-new(root),:root[data-vt="back"]::view-transition-new(navb):only-child{animation:vt-ent-izq var(--vt-dur) var(--vt-ease) both}
/* capas: la que sube (o baja) lleva el canto de las hojas; la de abajo se apaga apenas */
:root[data-vt="up"]::view-transition-old(root){animation:vt-apaga var(--vt-dur) var(--vt-ease) both}
:root[data-vt="up"]::view-transition-new(root){animation:vt-sube var(--vt-dur) var(--vt-ease) both;border-radius:24px 24px 0 0;box-shadow:0 calc(-1 * var(--bw)) 0 var(--edge)}
:root[data-vt="up"]::view-transition-new(navb):only-child{animation:vt-sube var(--vt-dur) var(--vt-ease) both}
:root[data-vt="up"]::view-transition-old(navb):only-child{animation:vt-funde-sal var(--vt-dur) var(--vt-ease) both}
:root[data-vt="down"]::view-transition-old(root){animation:vt-baja var(--vt-dur) var(--vt-ease) both;z-index:1;border-radius:24px 24px 0 0;box-shadow:0 calc(-1 * var(--bw)) 0 var(--edge)}
:root[data-vt="down"]::view-transition-new(root){animation:vt-enciende var(--vt-dur) var(--vt-ease) both}
:root[data-vt="down"]::view-transition-old(navb):only-child{animation:vt-baja var(--vt-dur) var(--vt-ease) both}
:root[data-vt="down"]::view-transition-new(navb):only-child{animation:vt-funde-ent var(--vt-dur) var(--vt-ease) both}
:root[data-vt="fade"]::view-transition-old(root),:root[data-vt="fade"]::view-transition-old(navb):only-child{animation:vt-funde-sal var(--vt-dur) var(--vt-ease) both}
:root[data-vt="fade"]::view-transition-new(root),:root[data-vt="fade"]::view-transition-new(navb):only-child{animation:vt-funde-ent var(--vt-dur) var(--vt-ease) both}
/* hojas: suben al abrir y bajan al cerrar (el velo se enciende y se apaga con ellas) */
@keyframes vt-velo-ent{from{background-color:transparent}}
@keyframes vt-velo-sal{to{background-color:transparent}}
@keyframes vt-hoja-ent{from{transform:translateY(100%)}}
@keyframes vt-hoja-sal{to{transform:translateY(100%)}}
.sheet-back{animation:vt-velo-ent var(--vt-dur) var(--vt-ease)}
.sheet-back>.sheet,.qfeed:not([hidden]){animation:vt-hoja-ent var(--vt-dur) var(--vt-ease)}
.sheet-back.closing{animation:vt-velo-sal var(--vt-dur) var(--vt-ease) forwards;pointer-events:none}
.sheet-back.closing>.sheet{animation:vt-hoja-sal var(--vt-dur) var(--vt-ease) forwards}
/* flecha de volver hacia abajo en las pantallas que se cierran bajando */
body.capa .navb .back::before{transform:translateY(-3px) rotate(-45deg)}
@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}
@media (max-width:380px){#app{--padx:16px;padding-left:16px;padding-right:16px}.toolbox{gap:9px}.tool{font-size:14px}.kana-grid{gap:7px}}

/* ---- Lecciones de mapa: marcas «dónde se retoma» y romaji siempre a la vista ---- */
.mk-line{font-size:15.5px;line-height:1.5;color:var(--ai);margin:-2px 0 14px;max-width:62ch}
body.no-romaji .keep-rom .rom{display:block}
/* ---- Hitos: «¡Ya podés leer!» (diseño aprobado sobre bocetos, 24/9/2026) ---- */
.unlock-note{margin:22px 0 0;padding:10px 14px;border:var(--bw) dashed var(--midori);border-radius:12px;background:var(--ok-soft);color:var(--midori);font-weight:700;font-size:16px;text-align:center;max-width:none}
.hito .present-card{padding-bottom:18px}
.hito .present-card.pre{padding-bottom:22px}
.hito-phrase{font-size:min(54px,14vw);line-height:1.2;margin:4px 0 0}
.hito-phrase.long{font-size:min(42px,10.6vw);line-height:1.25}
.hito-phrase .ln{display:block}
.hito-phrase .key{color:var(--midori);background:linear-gradient(transparent 52%, var(--ok-soft) 52%, var(--ok-soft) 84%, transparent 84%);border-radius:4px}
.hito-key{margin:6px 0 0;font-size:15.5px;font-weight:700;color:var(--midori)}
.hito-key .jpi{font-size:18px}
.hito .present-rom + .hito-key{margin-top:8px}
.hito-try{margin:18px 0 6px;font-size:17px;color:var(--ink-2)}
.hito .present-card .present-es{margin-top:10px}
.hito-read{width:100%;text-align:left;margin:12px 0 0;padding:2px 0 2px 14px;border-left:3px solid var(--ai);font-size:16px;line-height:1.45;color:var(--ink-2)}
.hito-read b{color:var(--ink)}
.hito-read .mk{display:block;font-size:14.5px;color:var(--ai);margin-top:3px}
.hito .hito-go{margin-top:26px}
.hito .present-card:not(.pre) + .hito-go{margin-top:22px}
/* cierre del hito */
.cierre{padding-top:6px}
.fr-h{font-family:var(--f-jp);font-weight:600;font-size:30px;line-height:1.25;margin:10px 0 4px}
.fr-count{font-size:18px;color:var(--ink-2);margin:0 0 18px}
.fr-count b{font-family:var(--f-jp);font-size:34px;color:var(--ink);margin-right:4px}
.fbar{display:flex;gap:12px;margin:0 0 6px}
.fgrp{display:grid;gap:5px;min-width:0}
.fsegs{display:flex;gap:4px}
.fsegs i{flex:1;height:18px;border:2px solid var(--edge);border-radius:6px;background:var(--card)}
.fsegs i.on{background:var(--midori)}
.fgrp .fl{font-family:var(--f-jp);font-weight:600;font-size:19px;text-align:center;color:var(--ink-2)}
.fgrp.done .fl{color:var(--midori)}
.cierre .reveal-bar{margin-top:18px}
.cierre .locked-box{margin-top:22px}
.cierre .locked-box p{margin:0}
.cierre .locked-box p b{color:var(--ink)}
/* frases en Mis palabras: las pendientes, como casilleros cerrados */
.fr-hint{margin-top:-4px}
.fr-lock{display:flex;align-items:center;gap:12px;padding:12px 14px;color:var(--ink-2);font-size:15.5px;line-height:1.4;background:var(--tint)}
.fr-lock-i{display:grid;place-items:center;width:30px;flex:none}
.fr-lock-i svg{display:block}
/* el japonés dentro de un texto no se corta a mitad de palabra */
.lesson-text .jpi,.feed-t .jpi,.feed-ex .jpi,.qlabel .jpi,.mk-line .jpi,.w-note .jpi,.enr .jpi,.hito-read .jpi{white-space:nowrap}
/* repasos: la lección de donde viene cada error */
.w-src{color:var(--ink-2)}
/* ---- Confirmación al salir de una práctica empezada ---- */
.conf h2{margin:6px 0 8px;font-size:21px}
.conf p{color:var(--ink-2);margin:0 0 4px}
.conf .actions{margin:20px 0 4px}

  'つ':{r:'tsu',p:'«tsu»: una t y una s pegadas, como en «tsunami». No existe en español, así que vale la pena practicarlo en voz alta.',m:'Una ola que rompe: tsu, de tsunami.',ex:['くつ','kutsu','zapatos']},

const DAKU_ROWS = [
  {base:['か','き','く','け','こ'], kana:['が','ぎ','ぐ','げ','ご'], r:['ga','gi','gu','ge','go'], note:'La «g» siempre suave, como en «gato», nunca como en «gente»: ぎ es «gui» (guitarra) y げ es «gue» (guerra).'},
  {base:['さ','し','す','せ','そ'], kana:['ざ','じ','ず','ぜ','ぞ'], r:['za','ji','zu','ze','zo'], note:'«z» sonora, como el zumbido de una abeja. じ es «ji» como en el inglés «jeep».'},
  {base:['た','ち','つ','て','と'], kana:['だ','ぢ','づ','で','ど'], r:['da','ji','zu','de','do'], note:'だ, で y ど: «da», «de», «do». ぢ y づ suenan igual que じ y ず y casi no se usan.'},

     {l:'1-1',q:'¿Cuántos pulsos tiene えいご (inglés)?',o:['3','2','4','5'],a:0,jp:'えいご',ex:'Un pulso por kana: え, い y ご. En español, «ei» se diría en una sola sílaba.'},
     {l:'1-1',q:'¿Cuál de estas escrituras no es japonesa?',o:['Romaji','Hiragana','Katakana','Kanji'],a:0,ex:'Es una transcripción con nuestras letras, pensada para extranjeros.'},
     {l:'1-3',q:'En japonés, ¿dónde va el verbo?',o:['Al final de la oración','Al principio','Después del sujeto, como en español','En cualquier lugar: el orden es libre'],a:0,ex:'El orden es flexible, pero el verbo queda al final.'},
     {l:'1-3',q:'Para convertir una afirmación en pregunta, al final se agrega…',o:['か','き','こ','け'],a:0,jp:'か',ex:'か hace de signo de pregunta, sin cambiar el orden. Lo vas a practicar en la unidad 2.'},
     {l:'1-3',q:'かさ (paraguas) puede querer decir…',o:['«Paraguas», «los paraguas» o «un paraguas»: decide el contexto','Solo «un paraguas»','Solo «el paraguas»','Solo «los paraguas»'],a:0,jp:'かさ',ex:'No hay artículos ni plural obligatorio.'}
    ]}
  ]},
 {id:2, title:'Decir qué es cada cosa', kana:'た〜ほ ん',
  desc:'Filas た, な y は con sus variantes y la ん, cómo decir «X es Y», cómo preguntar y tus primeros saludos.',
  lessons:[
   {id:'2-ta', type:'kana', title:'た y だ', min:10, n:13,
    intro:'La fila de la t tiene dos excepciones: ち se lee «chi» y つ se lee «tsu», un sonido que no existe en español.',
    set:['た','ち','つ','て','と'],
    daku:['だ','で','ど'],
    dakuIntro:'Con ゛, la t se vuelve d: た pasa a だ, て pasa a で y と pasa a ど. También existen ぢ y づ, que suenan igual que じ y ず y casi no se usan.'},
   {id:'2-v1', type:'vocab', cycle:true, title:'Palabras 5', min:7, words:W(VOCAB_2,'て','つくえ','たかい','がくせい','おおきい','たこ'),
    intro:'Seis palabras con la fila た y todo lo anterior.'},
   {id:'2-v2', type:'vocab', cycle:true, title:'Palabras 6', min:7, words:W(VOCAB_2,'くち','とけい','ちいさい','でぐち','そう','くつ'),
    intro:'Seis palabras más. そう («así») va a ser clave para responder preguntas en la gramática de esta unidad.'},
   {id:'2-na', type:'kana', title:'な y ん', min:10, n:12,
    intro:'La fila de la n es completamente regular. Su kana más importante es の, una de las partículas más frecuentes del japonés, que vas a usar en la unidad 3. Y se suma ん, el único kana que es solo una consonante; aparece en muchísimas palabras.',
    set:['な','に','ぬ','ね','の','ん']},
   {id:'2-v3', type:'vocab', cycle:true, title:'Palabras 7', min:7, words:W(VOCAB_2,'ねこ','さかな','なつ','あなた','なに','おかね'),
    intro:'Seis palabras con la fila な, entre ellas dos que vas a necesitar para preguntar: あなた y なに.'},
   {id:'2-ha', type:'kana', title:'は, ば y ぱ', min:12, n:16,
    intro:'La fila de la h tiene una h aspirada, más suave que la «j» española, y ふ se lee «fu». Además, は y へ tienen doble vida como partículas: se leen «wa» y «e».',
    set:['は','ひ','ふ','へ','ほ'],
    daku:['ば','び','ぶ','べ','ぼ','ぱ','ぴ','ぷ','ぺ','ぽ'],
    dakuIntro:'Esta fila tiene dos variantes. Con ゛, la h se vuelve b: は pasa a ば. Con el circulito ゜ (handakuten), exclusivo de esta fila, se vuelve p: は pasa a ぱ. Son 15 sonidos, pero solo 5 formas nuevas.',
    uso:{q:'Llegás a una cena a las nueve de la noche. ¿Cómo saludás?',o:['こんばんは','こんにちは'],a:0,jp:'こんばんは',ex:'こんばんは es el saludo de la noche; こんにちは, el del día.'}},
   {id:'2-v4', type:'vocab', cycle:true, title:'Palabras 8', min:7, words:W(VOCAB_2,'いぬ','はな','ひと','ふね','ふく','ほし'),
    intro:'Seis palabras con la fila は. Con estas completás el vocabulario de la unidad.'},
   {id:'2-g', type:'grammar', title:'X は Y です', min:15,
    intro:'La primera estructura completa: decir qué es algo, preguntarlo y responder.',
    sections:[
     {h:'X は Y です: «X es Y»', b:[
       {p:'Es la estructura más básica del japonés. は marca el tema de la oración («en cuanto a X…») y です la cierra con el sentido de «es», en registro amable.'},
       {ex:[{k:'たなかさんは がくせいです。',r:'Tanaka-san wa gakusei desu',es:'Tanaka es estudiante.'},{k:'あなたは がくせいです。',r:'anata wa gakusei desu',es:'Vos sos estudiante.'}]},
       {note:'Como partícula, は se pronuncia «wa». Es una herencia de la ortografía antigua: se sigue escribiendo は aunque el sonido cambió.'}]},
     {h:'Lo que se entiende, se omite', b:[
       {p:'Si ya se sabe de quién se habla, el tema desaparece. Para decir que sos estudiante alcanza con:'},
       {ex:[{k:'がくせいです。',r:'gakusei desu',es:'Soy estudiante. (O «es estudiante», según el contexto.)'},{k:'ねこです。',r:'neko desu',es:'Es un gato.'}]},
       {p:'Nombrar el tema en cada oración suena insistente, como decir «yo» a cada rato en español.'}]},
     {h:'Preguntas: か al final', b:[
       {p:'Para preguntar se agrega か al final, sin cambiar el orden. Tradicionalmente no se usa signo de pregunta: alcanza con el punto 。 y la entonación sube.'},
       {ex:[{k:'がくせいですか。',r:'gakusei desu ka',es:'¿Sos estudiante? / ¿Es estudiante?'},{k:'いぬですか。',r:'inu desu ka',es:'¿Es un perro?'},{k:'なんですか。',r:'nan desu ka',es:'¿Qué es?'}]},
       {note:'なに («qué») se convierte en なん delante de です.'}]},
     {h:'Responder: はい y いいえ', b:[
       {ex:[{k:'はい、そうです。',r:'hai, sō desu',es:'Sí, así es.'},{k:'いいえ、いぬです。',r:'iie, inu desu',es:'No, es un perro.'},{k:'いいえ、ねこです。',r:'iie, neko desu',es:'No, es un gato.'}]},
       {p:'Para decir «no es» hace falta otra forma de です, que llega en la unidad 3. Mientras tanto, se niega corrigiendo: いいえ, y lo que sí es.'}]},
     {h:'さん y あなた', b:[
       {p:'さん se agrega al apellido (o al nombre) de otra persona para tratarla con respeto; vale para hombres y mujeres. Nunca se usa con el propio nombre.'},
       {p:'あなた («vos, usted») existe, pero en la conversación real se evita porque puede sonar distante o demasiado directo. Lo natural es hablarle a alguien por su nombre:'},
       {ex:[{k:'たなかさんは がくせいですか。',r:'Tanaka-san wa gakusei desu ka',es:'¿Usted es estudiante, Tanaka?'}]}]}
    ],
    quiz:[
     {q:'Completá: たなかさん＿ がくせいです。 (Tanaka es estudiante.)',o:['は','か','です','さん'],a:0,ex:'は marca el tema: «en cuanto a Tanaka…». Se lee «wa».',jp:'たなかさんは がくせいです。'},
     {q:'¿Cómo se lee は en あなたは?',o:['wa','ha','a','ba'],a:0,ex:'Como partícula de tema, は se lee «wa».',jp:'あなたは'},
     {q:'¿Cómo preguntás «¿Es un perro?»?',o:['いぬですか。','いぬです。','かいぬです。','いぬはか。'],a:0,jp:'いぬですか。'},
     {t:'order',q:'Armá: «Tanaka es estudiante.»',tiles:['たなかさん','は','がくせい','です'],jp:'たなかさんは がくせいです。'},
     {t:'order',q:'Armá: «¿Sos estudiante?» (con あなた)',tiles:['あなた','は','がくせい','です','か'],jp:'あなたは がくせいですか。'},
     {q:'Te preguntan ねこですか。, pero es un perro. ¿Qué respondés?',o:['いいえ、いぬです。','はい、いぬです。','はい、ねこです。','いぬですか。'],a:0,ex:'いいえ niega, y después aclarás qué es.',jp:'いいえ、いぬです。'},
     {q:'¿Cuál es la forma más natural de decir «Soy estudiante»?',o:['がくせいです。','がくせいか。','あなたは がくせいです。','がくせいは です。'],a:0,ex:'Si hablás de vos, el tema se sobreentiende. あなたは がくせいです quiere decir «vos sos estudiante».',jp:'がくせいです。'},
     {q:'¿Cuándo NO se usa さん?',o:['Al decir el propio nombre','Con el apellido de un compañero','Con el nombre de un vecino','Con alguien que acabás de conocer'],a:0,ex:'さん muestra respeto hacia otra persona; con tu propio nombre suena raro.'},
     {q:'¿Cómo se pregunta «¿Qué es?»?',o:['なんですか。','なにですか。','ですなに。','なんか。'],a:0,ex:'なに se convierte en なん delante de です.',jp:'なんですか。'},
     {t:'order',q:'Armá: «Sí, así es.»',tiles:['はい、','そう','です'],jp:'はい、そうです。'}
    ]},
   {id:'2-e', type:'listen', title:'Escucha', min:12, items:LISTEN_2,
    intro:'Oraciones cortas. Primero escuchá sin leer. Buscá palabras que reconozcas y fijate si la oración termina en か: si termina así, es una pregunta. Recién después mirá el texto.',
    note:'Dos detalles que ya viste en «Cómo funciona el japonés»: lo que describe va antes, como en おおきい いぬ (perro grande), y la u de です casi no se escucha.',
    quiz:[
     {q:'¿Qué escuchaste?',o:['¿Es un gato?','Es un gato.','¿Es un perro?','No es un gato.'],a:0,jp:'ねこですか。',audio:true},
     {q:'¿Qué escuchaste?',o:['No, es un gato.','Sí, es un gato.','¿Es un gato?','No, es un perro.'],a:0,jp:'いいえ、ねこです。',audio:true},
     {q:'¿Qué escuchaste?',o:['El perro es grande.','Es un perro grande.','¿Es grande?','Es un gato grande.'],a:0,jp:'いぬは おおきいです。',audio:true,ex:'いぬは おおきいです: «en cuanto al perro, es grande».'}
    ]},
   {id:'2-r', type:'review', title:'Repaso de la unidad 2', min:10,
    rv:{kana:5, marked:2, prev:2, words:8, fixed:3, listen:1, extra:1},
    intro:'Veinte preguntas de toda la unidad: los kana de た a ほ y ん, con sus marcas, y algunos de la unidad 1; palabras de las cuatro lecciones, X は Y です, escucha y tus primeros saludos. Al final, cada error indica de qué lección viene.',
    extra:[
     {l:'2-ha',q:'¿Cómo se lee el último kana de こんにちは?',o:['wa','ha','ba','a'],a:0,jp:'こんにちは',ex:'Es la partícula は, que en los saludos se lee «wa».'},
     {l:'2-ha',q:'¿Cómo se lee el último kana de こんばんは?',o:['wa','ha','ba','a'],a:0,jp:'こんばんは',ex:'Es la partícula は, que en los saludos se lee «wa».'}
    ]}
  ]},
 {id:3, title:'Cosas y personas', kana:'ま〜を',
  desc:'El resto del hiragana, más palabras, las frases de todos los días, posesión con の, これ, それ y あれ, la negación y un primer diálogo.',
  lessons:[
   {id:'3-ma', type:'kana', title:'ま', min:8, n:10,
    intro:'La fila de la m es regular. Ojo con め y ぬ, que se parecen: め no tiene rulo al final. Y も es como し con dos rayas atravesadas.',
    set:['ま','み','む','め','も'],
    uso:{q:'En un restaurante, querés llamar al mozo. ¿Qué decís?',o:['すみません','いただきます','はじめまして','こんにちは'],a:0,jp:'すみません',ex:'すみません también sirve para llamar la atención de alguien.'}},
   {id:'3-v1', type:'vocab', cycle:true, title:'Palabras 9', min:7, words:W(VOCAB_3,'なまえ','ともだち','みず','め','さむい','だいがくせい'),
    intro:'Seis palabras con la fila ま y todo lo anterior.'},
   {id:'3-ya', type:'kana', title:'や, わ y を', min:10, n:10,
    intro:'Los kana sueltos de la tabla. La fila や tiene solo tres: ya, yu y yo; ojo con la pronunciación porteña, や es «ia» y no «sha». わ se lee «wa». を se lee «o» y solo aparece como partícula.',
    set:['や','ゆ','よ','わ','を'],
    uso:{q:'Son las once de la noche y tu familia se va a dormir. ¿Qué decís?',o:['おやすみなさい','こんばんは','おはよう ございます','すみません'],a:0,jp:'おやすみなさい',ex:'こんばんは saluda al llegar; おやすみなさい despide al irse a dormir.'}},
   {id:'3-v2', type:'vocab', cycle:true, title:'Palabras 10', min:7, words:W(VOCAB_3,'わたし','やま','でんわ','かばん','みみ','うみ'),
    intro:'Seis palabras con や, わ y todo lo anterior. Por fin aparece わたし, «yo».'},
   {id:'3-v3', type:'vocab', cycle:true, title:'Palabras 11', min:7, words:W(VOCAB_3,'にほん','にほんご','ほん','あめ','ゆき','せんせい'),
    intro:'Seis palabras. Fijate en にほん y にほんご: la ご final significa «idioma». Y あめ, «lluvia», es la del ejemplo de los tonos en «Cómo funciona el japonés I».'},
   {id:'3-ra', type:'kana', title:'ら', min:8, n:10,
    intro:'Con esta lección completás el hiragana básico. La r japonesa es la «r» suave del español, la de «pero»: acá tenés ventaja sobre quienes hablan inglés.',
    set:['ら','り','る','れ','ろ'],
    uso:{q:'En el trabajo, te presentan a alguien. Ya dijiste はじめまして y tu nombre. ¿Con qué cerrás?',o:['よろしく おねがいします','ありがとう ございます','さようなら','すみません'],a:0,jp:'よろしく おねがいします',ex:'よろしく おねがいします cierra la presentación: «cuento con vos».'}},
   {id:'3-v4', type:'vocab', cycle:true, title:'Palabras 12', min:7, words:W(VOCAB_3,'くるま','りんご','よる','だれ','さくら','とり'),
    intro:'Seis palabras con la fila ら. Con estas completás el vocabulario de la unidad.'},
   {id:'3-f', type:'phrases', title:'Frases de todos los días', min:10, nAuto:10,
    items:W(PHRASES,'おはよう ございます','こんにちは','こんばんは','おやすみなさい','さようなら','ありがとう ございます','すみません','はじめまして','よろしく おねがいします','いただきます'),
    intro:'Las diez frases que fuiste destrabando, juntas. Ya sabés leerlas todas: ahora se trata de elegir la que corresponde a cada momento del día y a cada situación. Tocá cada una para escucharla.',
    quiz:[
     {q:'Llegás a la oficina a las ocho de la mañana. ¿Cómo saludás?',o:['おはよう ございます','こんにちは','こんばんは','おやすみなさい'],a:0},
     {q:'Un compañero de trabajo te regala un libro por tu cumpleaños. ¿Qué decís?',o:['ありがとう ございます','いただきます','よろしく おねがいします','はじめまして'],a:0,ex:'いただきます es solo para antes de comer.'},
     {q:'Chocás sin querer a alguien en el tren. ¿Qué decís?',o:['すみません','ありがとう ございます','さようなら','こんにちは'],a:0},
     {q:'Te sirven la comida y estás por empezar. ¿Qué decís?',o:['いただきます','よろしく おねがいします','おやすみなさい','はじめまして'],a:0},
     {q:'Terminó tu último día en una escuela de idiomas y te despedís de la profesora. ¿Qué decís?',o:['さようなら','おやすみなさい','こんばんは','すみません'],a:0},
     {q:'Conocés a un compañero nuevo. ¿Con qué frase abrís la presentación?',o:['はじめまして','よろしく おねがいします','さようなら','いただきます'],a:0,ex:'はじめまして abre; よろしく おねがいします cierra.'},
     {q:'¿Cómo se lee el último kana de こんばんは?',o:['wa','ha','ba','a'],a:0,jp:'こんばんは',ex:'Es la partícula は, que en los saludos se lee «wa».'}
    ]},
   {id:'3-g', type:'grammar', title:'の, これ, それ, あれ y la negación', min:15,
    words:W(VOCAB_3,'これ','それ','あれ'),
    intro:'Cuatro herramientas que multiplican lo que podés decir con X は Y です. Al completar la práctica, これ, それ y あれ se suman a Mis palabras.',
    sections:[
     {h:'の: «de», al revés', b:[
       {p:'A の B significa «B de A»: lo que posee o describe va primero.'},
       {ex:[{k:'わたしの ほん',r:'watashi no hon',es:'mi libro (el libro de mí)'},{k:'たなかさんの くるま',r:'Tanaka-san no kuruma',es:'el auto de Tanaka'},{k:'にほんごの せんせい',r:'nihongo no sensei',es:'profesor de japonés'}]},
       {p:'Como muestra el último ejemplo, の no solo indica posesión: une cualquier sustantivo que describe a otro.'}]},
     {h:'これ, それ, あれ', b:[
       {p:'El japonés distingue tres distancias, según quién tiene cerca la cosa:'},
       {html:HTML_KOSOADO},
       {ex:[{k:'これは なんですか。',r:'kore wa nan desu ka',es:'¿Qué es esto?'},{k:'それは わたしの かばんです。',r:'sore wa watashi no kaban desu',es:'Eso es mi bolso.'},{k:'あれは ふじさんです。',r:'are wa Fujisan desu',es:'Aquello es el monte Fuji.'}]},
       {note:'En ふじさん, さん no es el honorífico: significa «montaña», como やま, con otra lectura.'}]},
     {h:'La negación', b:[
       {p:'Para decir «no es», です se reemplaza por では ありません:'},
       {ex:[{k:'がくせいでは ありません。',r:'gakusei dewa arimasen',es:'No soy estudiante.'},{k:'これは ほんでは ありません。',r:'kore wa hon dewa arimasen',es:'Esto no es un libro.'}]},
       {note:'En では, la は se lee «wa», como en X は Y です. Es la forma amable, un poco formal. En la conversación diaria es más común una forma más corta, que vas a aprender en la unidad 4.'}]},
     {h:'も: también', b:[
       {p:'も reemplaza a は y agrega «también». En una oración negativa equivale a «tampoco».'},
       {ex:[{k:'わたしも がくせいです。',r:'watashi mo gakusei desu',es:'Yo también soy estudiante.'},{k:'わたしも がくせいでは ありません。',r:'watashi mo gakusei dewa arimasen',es:'Yo tampoco soy estudiante.'}]}]},
     {h:'Preguntar quién y el nombre', b:[
       {ex:[{k:'だれですか。',r:'dare desu ka',es:'¿Quién es?'},{k:'おなまえは？',r:'o-namae wa?',es:'¿Su nombre? (La お agrega cortesía.)'}]}]}
    ],
    quiz:[
     {q:'¿Cómo se dice «el libro de Tanaka»?',o:['たなかさんの ほん','ほんの たなかさん','たなかさんは ほん','ほん たなかさんの'],a:0,ex:'A の B = «B de A»: el poseedor va primero.',jp:'たなかさんの ほん'},
     {q:'Completá: わたし＿ くるまです。 (Es mi auto.)',o:['の','は','も','か'],a:0,jp:'わたしの くるまです。'},
     {q:'Señalás una montaña lejana, lejos de vos y de tu interlocutor:',o:['あれは やまです。','これは やまです。','それは やまです。','どれは やまです。'],a:0,jp:'あれは やまです。'},
     {q:'Tu interlocutor tiene algo en la mano y querés saber qué es:',o:['それは なんですか。','これは なんですか。','あれは なんですか。','それは だれですか。'],a:0,ex:'Está cerca de quien escucha: それ.',jp:'それは なんですか。'},
     {t:'order',q:'Armá: «Yo también soy estudiante.»',tiles:['わたし','も','がくせい','です'],jp:'わたしも がくせいです。'},
     {q:'¿Cómo se dice «No soy profesor»?',o:['せんせいでは ありません。','せんせいです。','せんせいですか。','せんせいも です。'],a:0,jp:'せんせいでは ありません。'},
     {t:'order',q:'Armá: «Eso es mi libro.»',tiles:['それ','は','わたし','の','ほん','です'],jp:'それは わたしの ほんです。'},
     {q:'En では ありません, ¿cómo se lee は?',o:['wa','ha','ba','a'],a:0,ex:'Es la partícula は: se lee «wa», como en X は Y です.',jp:'では ありません'},
     {q:'¿Cómo se pregunta «¿Quién es?»?',o:['だれですか。','なんですか。','どれですか。','それですか。'],a:0,jp:'だれですか。'},
     {q:'En ふじさん (el monte Fuji), ¿qué es さん?',o:['«Montaña», con otra lectura: no es el honorífico','El honorífico, por respeto al monte','Un diminutivo','Parte del nombre, sin significado'],a:0,ex:'やま, «montaña», en palabras compuestas suele leerse さん.'}
    ]},
   {id:'3-d', type:'dialogue', title:'Yamada y Kimura se presentan', min:15, lines:DIALOGUE_3,
    intro:'Yamada y Kimura se conocen. Escuchá el diálogo completo sin leer, al menos dos veces. Después respondé las preguntas, y recién al final mirá el texto.',
    note:'なんの せんせい = «profesor de qué» (なに + の). Fijate también en cómo cada uno dice el nombre del otro con さん, pero el propio sin ella.',
    quiz:[
     {q:'¿Qué es Kimura?',o:['Estudiante universitaria','Profesora de inglés','Profesora de japonés','No lo dice'],a:0},
     {q:'¿Yamada es estudiante?',o:['No: es profesor','Sí: universitario','Sí: de inglés','No lo dice'],a:0},
     {q:'¿Qué enseña Yamada?',o:['Inglés','Japonés','Nada: es estudiante','No lo dice'],a:0},
