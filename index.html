const TYPE_LABEL = {concept:'Conceptos', kana:'Escritura', vocab:'Vocabulario', phrases:'Frases', grammar:'Gramática', listen:'Escucha', dialogue:'Diálogo', review:'Repaso'};


/* ===================== GENERADOR DE PREGUNTAS ===================== */

const ALL_LESSONS = [];
const LESSON = {};
UNITS.filter(u => !u.soon).forEach(u => u.lessons.forEach(l => { l.unit = u.id; ALL_LESSONS.push(l); LESSON[l.id] = l; }));

const EXCLUDE_QUIZ = new Set(['ぢ','づ']);
const JP_RE = /[\u3040-\u30ff\u3400-\u9fff]/;

function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function uniq(a){ return [...new Set(a)]; }
function pick(a, n){ return shuffle(a).slice(0, n); }
function kr(k){ return KANA[k] ? KANA[k].r : '?'; }

// Relaciones base/sonora (か ↔ が, は ↔ ば/ぱ)
const VOICED = {};
DAKU_ROWS.forEach(row => row.kana.forEach((k, i) => { const b = row.base[i]; (VOICED[b] = VOICED[b] || []).push(k); }));
function related(k){
  const out = [];
  if (KANA[k] && KANA[k].base){ out.push(KANA[k].base); (VOICED[KANA[k].base] || []).forEach(v => { if (v !== k) out.push(v); }); }
  (VOICED[k] || []).forEach(v => out.push(v));
  return out;
}

function lessonIndex(id){ return ALL_LESSONS.findIndex(l => l.id === id); }
function lessonsUpTo(id){ return ALL_LESSONS.slice(0, lessonIndex(id) + 1); }

function kanaPoolUpTo(id){
  const pool = [];
  lessonsUpTo(id).forEach(l => { if (l.type === 'kana'){ pool.push(...l.set, ...(l.daku || [])); } });
  return uniq(pool).filter(k => !EXCLUDE_QUIZ.has(k));
}
function vocabPoolUpTo(id){
  const pool = [];
  lessonsUpTo(id).forEach(l => { if (l.words) pool.push(...l.words); });
  return pool;
}
function phrasePoolUpTo(id){
  const pool = [];
  lessonsUpTo(id).forEach(l => { if (l.type === 'phrases') pool.push(...l.items); });
  return pool;
}

// Fila a la que pertenece cada kana (vocales, k, s, t, n, h, m, y, r, w, ん, y las filas con marca)
const ROW = {};
GOJUON.forEach((row, i) => row.forEach(k => { if (k) ROW[k] = 'g' + i; }));
DAKU_ROWS.forEach((r, i) => r.kana.forEach(k => { ROW[k] = 'd' + i; }));
['わ','を'].forEach(k => { ROW[k] = 'gw'; });   // わ y を van juntos: solos quedarían expuestos
ROW['ん'] = ROW['な'];                            // ん se enseña con la fila な y se confunde con ella

// Distractores de kana. Prioriza los que se confunden a la vista, pero sobre todo evita
// que la respuesta se deduzca por descarte: las cuatro opciones salen de una sola fila, o
// dos de la fila de la respuesta y dos de otra. Nunca queda una opción «distinta al resto».
function kanaDistractors(k, pool, count){
  const R = kr(k), row = ROW[k];
  const close = uniq([...(CONF[k] || '').split(''), ...related(k)]).filter(c => pool.includes(c) && c !== k);
  const order = arr => shuffle(arr).sort((a, b) => (close.includes(a) ? 0 : 1) - (close.includes(b) ? 0 : 1));
  const seen = new Set([R]);                       // una sola lectura por opción, en todos los grupos
  const take = (list, n) => {
    const out = [];
    for (const c of list){
      if (out.length >= n) break;
      const r = kr(c);
      if (seen.has(r)) continue;
      seen.add(r); out.push(c);
    }
    return out;
  };
  const rest = pool.filter(c => c !== k);
  const same = order(rest.filter(c => ROW[c] === row));
  const byRow = {};
  order(rest.filter(c => ROW[c] !== row)).forEach(c => { (byRow[ROW[c]] = byRow[ROW[c]] || []).push(c); });
  const lecturas = list => uniq(list.map(kr)).filter(r => r !== R).length;
  const rows = Object.keys(byRow).filter(r => lecturas(byRow[r]) >= count - 1)
    .sort((a, b) => (byRow[b].some(c => close.includes(c)) ? 1 : 0) - (byRow[a].some(c => close.includes(c)) ? 1 : 0));
  const canSingle = lecturas(same) >= count;
  const canSplit = lecturas(same) >= 1 && rows.length > 0;
  let out = [];
  if (canSplit && (!canSingle || Math.random() < 0.5)){
    const other = rows[Math.random() < 0.7 ? 0 : Math.floor(Math.random() * rows.length)];
    out = take(same, 1).concat(take(byRow[other], count - 1));
  } else if (canSingle){
    out = take(same, count);
  }
  if (out.length < count) out = out.concat(take(order(rest), count - out.length));   // repertorio corto
  return out;
}

function mcFrom(correct, distractors, render){
  const all = shuffle([correct, ...distractors]);
  return { opts: all.map(render), a: all.indexOf(correct) };
}

function kanaQuestion(k, pool, type){
  const info = KANA[k];
  const d = kanaDistractors(k, pool, 3);
  const q = { kk: k, say: k };
  if (type === 'k2r'){
    Object.assign(q, { label:'¿Cómo se lee?', show:{kana:k} }, mcFrom(k, d, c => ({t:kr(c)})));
  } else if (type === 'r2k'){
    Object.assign(q, { label:'¿Cuál es este sonido?', show:{rom:info.r} }, mcFrom(k, d, c => ({t:c, jp:true, big:true})));
  } else {
    Object.assign(q, { label:'Escuchá y elegí el kana', show:{audio:k} }, mcFrom(k, d, c => ({t:c, jp:true, big:true})));
  }
  q.ans = type === 'k2r' ? info.r : k;    // lo que había que elegir, tal cual
  q.sum = (type === 'k2r' ? k : type === 'r2k' ? '«' + info.r + '»' : 'Audio') + ' → ' + k + ' (' + info.r + ')';
  q.mn = info.m;
  return q;
}

function kanaQuestions(target, extra, pool, n){
  target = target.filter(k => !EXCLUDE_QUIZ.has(k));
  extra = (extra || []).filter(k => !EXCLUDE_QUIZ.has(k));
  const list = shuffle(target);
  const extraCount = Math.min(extra.length, Math.round(n * 0.4));
  list.push(...pick(extra, extraCount));
  while (list.length < n) list.push(...shuffle(target));
  const chosen = shuffle(list.slice(0, n));
  let last = '';
  return chosen.map((k, i) => {
    let types = ['k2r','r2k','a2k'];
    if (k === 'を') types = ['k2r'];
    let t = types[(i + Math.floor(Math.random() * 3)) % types.length];
    if (t === last && types.length > 1) t = types[(types.indexOf(t) + 1) % types.length];
    last = t;
    return kanaQuestion(k, pool, t);
  });
}

function wordDistractors(w, pool, count, field){
  const seen = new Set([w[field]]);
  const out = [];
  for (const c of shuffle(pool)){
    if (out.length >= count) break;
    if (c.k === w.k || seen.has(c[field])) continue;
    seen.add(c[field]); out.push(c);
  }
  return out;
}

function vocabQuestion(w, pool, type){
  const q = { say: w.k, reveal: w };
  if (type === 'w2m'){
    const d = wordDistractors(w, pool, 3, 'es');
    Object.assign(q, { label:'¿Qué significa?', show:{jp:w.k} }, mcFrom(w, d, c => ({t:c.es})));
    q.sum = w.k + ' → ' + w.es;
  } else if (type === 'm2w'){
    const d = wordDistractors(w, pool, 3, 'k');
    Object.assign(q, { label:'¿Cómo se dice?', show:{es:w.es} }, mcFrom(w, d, c => ({t:c.k, jp:true})));
    q.sum = '«' + w.es + '» → ' + w.k;
  } else if (type === 'a2m'){
    const d = wordDistractors(w, pool, 3, 'es');
    Object.assign(q, { label:'Escuchá: ¿qué significa?', show:{audio:w.k} }, mcFrom(w, d, c => ({t:c.es})));
    q.sum = 'Audio: ' + w.k + ' → ' + w.es;
  } else if (type === 'p2w'){
    const tambien = ESCENA_TAMBIEN[w.ill] || [];
    // cualidades y momentos nunca son opción en un dibujo, ni lo que la escena también muestra
    const d = wordDistractors(w, pool.filter(c => !c.atr && !tambien.includes(c.k)), 3, 'k');
    const marcada = !!(w.zona && ZONAS[w.ill] && ZONAS[w.ill][w.zona]);
    Object.assign(q, { label: marcada ? '¿Qué palabra muestra la parte marcada?' : '¿Qué palabra muestra el dibujo?', show:{ill:w.ill, zona:w.zona} }, mcFrom(w, d, c => ({t:c.k, jp:true})));
    q.sum = 'Dibujo → ' + w.k + ' (' + w.es + ')';
  } else {
    const d = wordDistractors(w, pool, 3, 'k');
    Object.assign(q, { label:'Escuchá y elegí lo que se dijo', show:{audio:w.k} }, mcFrom(w, d, c => ({t:c.k, jp:true})));
    q.sum = 'Audio → ' + w.k + ' (' + w.es + ')';
  }
  q.ans = (type === 'w2m' || type === 'a2m') ? w.es : w.k;   // lo que había que elegir, tal cual (p2w, m2w y a2w: la palabra)
  return q;
}

function vocabQuestions(words, pool, n, types){
  types = types || ['w2m','m2w','a2m','a2w'];
  const list = [];
  while (list.length < n) list.push(...shuffle(words));
  return list.slice(0, n).map((w, i) => vocabQuestion(w, pool.length >= 4 ? pool : words, types[i % types.length]));
}

// Frases e hitos: cada frase se destraba al aprobar la lección de kana que completa sus signos (p.h)
function phrasesOf(id){ return PHRASES.filter(p => p.h === id); }
const HITOS = ALL_LESSONS.filter(l => phrasesOf(l.id).length);
// Las llaves: los kana de la frase que enseña la lección que la destraba, en el orden en que aparecen
function phraseKeys(p){
  const L = LESSON[p.h], own = new Set([...L.set, ...(L.daku || [])]);
  return uniq([...p.k].filter(c => own.has(c)));
}

function fixedQ(f){
  if (f.t === 'order'){
    const idx = f.tiles.map((_, i) => i);
    let order = shuffle(idx), guard = 0;
    while (order.every((v, i) => v === i) && guard++ < 10) order = shuffle(idx);
    // lecciones de mapa: palabras en español para ordenar como en japonés; la corrección muestra la oración real, con romaji y audio
    if (f.es){
      const lit = f.tiles.join(' ');
      return { type:'order', es:true, label:f.q, show:{es:f.es}, tiles: order.map(i => f.tiles[i]), answer: f.tiles.join(''), answerShown: lit, reveal:{k:f.jp, r:f.r}, say: f.jp, ex: f.ex, sum: '«' + f.es + '» en orden japonés → ' + lit };
    }
    return { type:'order', label:f.q, tiles: order.map(i => f.tiles[i]), answer: f.tiles.join(''), answerShown: f.jp || f.tiles.join(' '), say: f.jp || f.tiles.join(''), ex: f.ex, sum: f.q.replace(/^Armá: /, '') + ' → ' + (f.jp || f.tiles.join(' ')) };
  }
  // una opción puede ser [kana, romaji] o [kana, romaji, literal]: en las lecciones de mapa, todo el japonés lleva romaji,
  // y cuando la pregunta es sobre el orden y no sobre el vocabulario, también la traducción palabra por palabra
  const isJp = t => JP_RE.test(t) && !/[a-záéíóú]{3,}/i.test(t);
  const sub = o => o[1] + (o[2] ? ' (literal: ' + o[2] + ')' : '');                         // debajo del kana, en la opción
  const full = o => Array.isArray(o) ? o[0] + ' (' + o[1] + (o[2] ? ', literal: ' + o[2] : '') + ')' : o;   // en una línea: corrección y resumen
  const correct = full(f.o[f.a]);
  const mixed = shuffle(f.o.map((t, i) => ({t, i})));
  const q = {
    label: f.q,
    show: f.audio ? {audio: f.jp} : null,
    opts: mixed.map(o => Array.isArray(o.t) ? {t:o.t[0], sub:sub(o.t), full:full(o.t), jp:true} : {t:o.t, jp: isJp(o.t)}),
    a: mixed.findIndex(o => o.i === f.a),
    ex: f.ex,
    say: f.jp || (!Array.isArray(f.o[f.a]) && isJp(correct) ? correct : undefined),
    ans: correct
  };
  if (f.audio) q.reveal = { k: f.jp };
  q.sum = (f.audio ? 'Audio: ' + f.jp : f.q) + ' → ' + correct;
  return q;
}

// Frases: todas se leen con kana ya enseñados, así que van sin romaji, como las palabras
function phraseQuestions(items, n, pool){
  pool = pool && pool.length >= 4 ? pool : items;
  const types = shuffle(['a2m','m2w','w2m']);
  const list = [];
  while (list.length < n) list.push(...shuffle(items));
  return list.slice(0, n).map((p, i) => vocabQuestion(p, pool, types[i % types.length]));
}

function listenQuestions(items, n){
  return pick(items, n).map(it => {
    const q = vocabQuestion(it, items, 'a2m');
    q.label = '¿Qué escuchaste?';
    return q;
  });
}

function buildQuiz(L){
  switch (L.type){
    case 'concept':
    case 'grammar':
      return shuffle(L.quiz.map(fixedQ));
    case 'kana':
      return kanaQuestions(L.set, L.daku, kanaPoolUpTo(L.id), L.n || 15);
    case 'vocab':
      if (L.cycle) return cycleSteps(L);
      return vocabQuestions(L.words, vocabPoolUpTo(L.id), Math.max(10, L.words.length * 2));
    case 'phrases':
      return mezclar([...phraseQuestions(L.items, L.nAuto || 8, phrasePoolUpTo(L.id)), ...L.quiz.map(fixedQ)]);
    case 'listen':
      return shuffle([...listenQuestions(L.items, 9), ...L.quiz.map(fixedQ)]);
    case 'dialogue':
      return L.quiz.map(fixedQ);
    case 'review':
      return reviewQuestions(L);
  }
  return [];
}

// Lo que cada escena muestra sin zona propia (o escrito, como el cartel おおいけ de la estación):
// esas palabras nunca salen como opción en las preguntas de esa escena, porque también serían defendibles.
const ESCENA_TAMBIEN = {
  kao: ['さくら', 'ふく'], eki: ['いけ'], vaca: ['やま'], rostro: ['かお', 'ふく'], jardin: ['いけ'], puerto: ['うみ']
};
let zonaSeq = 0;
function illHTML(ill, zona){
  const svg = ILL[ill] || '';
  const forma = zona && ZONAS[ill] && ZONAS[ill][zona];
  if (!svg || !forma) return svg;
  const id = 'zv' + (++zonaSeq);
  const tapa = forma.replace('/>', ' fill="#000"/>');
  const borde = forma.replace('/>', ' fill="none" stroke="#1f2a44" stroke-width="3.5" stroke-dasharray="9 8" stroke-linecap="round" stroke-linejoin="round"/>');
  const capa = '<defs><clipPath id="' + id + 'c"><rect width="300" height="300" rx="24"/></clipPath>' +
    '<mask id="' + id + 'm" maskUnits="userSpaceOnUse" x="0" y="0" width="300" height="300"><rect width="300" height="300" fill="#fff"/>' + tapa + '</mask></defs>' +
    '<g class="veil" clip-path="url(#' + id + 'c)"><rect width="300" height="300" fill="#eef5f0" fill-opacity=".72" mask="url(#' + id + 'm)"/>' + borde + '</g>';
  const k = svg.lastIndexOf('</svg>');
  return svg.slice(0, k) + capa + svg.slice(k);
}

// Separa una palabra en kana sueltos; los pequeños (ゃ, ゅ, ょ…) van pegados al anterior
function kanaUnits(k){
  const out = [];
  for (const ch of k.replace(/\s/g, '')){
    if (/[ゃゅょぁぃぅぇぉャュョァィゥェォ]/.test(ch) && out.length) out[out.length - 1] += ch;
    else out.push(ch);
  }
  return out;
}

// Armar la palabra: los kana de la palabra más 2 o 3 sobrantes, siempre de kana ya estudiados
const HOMOFONOS = {'お':'を', 'を':'お', 'じ':'ぢ', 'ぢ':'じ', 'ず':'づ', 'づ':'ず'};
function spellQuestion(w, kanaPool, byAudio){
  const units = kanaUnits(w.k);
  // las sobrantes no pueden sonar igual que un kana de la palabra (お/を, じ/ぢ, ず/づ): por audio serían otra respuesta válida
  const extra = pick(kanaPool.filter(k => !units.includes(k) && !units.includes(HOMOFONOS[k])), units.length >= 4 ? 2 : 3);
  let tiles = shuffle([...units, ...extra]), guard = 0;
  while (tiles.slice(0, units.length).join('') === w.k && guard++ < 10) tiles = shuffle(tiles);
  const q = { type:'order', spell:true, tiles, need: units.length, answer: w.k, answerShown: w.k, say: w.k, reveal: w };
  if (byAudio){ q.label = 'Escuchá y armá la palabra'; q.show = {audio: w.k}; q.sum = 'Audio → armar ' + w.k; }
  else { q.label = 'Armá la palabra'; q.show = {es: w.es}; q.sum = 'Armar «' + w.es + '» → ' + w.k; }
  return q;
}

// Emparejar pares: cada par cuenta como una respuesta. Un par se pierde si su palabra japonesa
// entró en un intento equivocado (un error, un par). Hasta 5 pares, y a la derecha sobra un
// significado (de otra palabra ya vista), para que el último par no se resuelva por descarte.
function pairsQuestion(words, pool){
  const ws = shuffle(words).slice(0, Math.min(words.length, 5));
  const usados = new Set(ws.map(w => w.es));
  const libres = (pool || []).filter(c => !ws.some(w => w.k === c.k) && !usados.has(c.es));
  const extra = libres.length ? pick(libres, 1)[0] : null;
  const der = ws.map((_, i) => i);
  if (extra) der.push(ws.length);   // el índice ws.length es el significado que sobra
  return { type:'pairs', label: extra ? 'Uní cada palabra con su significado. Sobra uno.' : 'Uní cada palabra con su significado', words: ws, extra,
    lo: shuffle(ws.map((_, i) => i)), ro: shuffle(der), sum: 'Emparejar ' + ws.length + ' pares' };
}
// Mezcla sin que la misma palabra aparezca dos veces seguidas
function mezclar(items){
  const key = q => (q.reveal && q.reveal.k) || q.answer || q.ans;
  let out = shuffle(items), guard = 0;
  while (out.some((q, i) => i && key(q) === key(out[i - 1])) && guard++ < 60) out = shuffle(items);
  return out;
}

// Lección de palabras en ciclo: un solo flujo, todo puntuado.
// Tandas de dos: se presentan y se reconocen enseguida; desde la segunda tanda vuelven las anteriores
// con audio y producción. Al cerrar la última tanda, un emparejar de 5; después, un cierre con dibujos,
// armar la palabra y opción múltiple, con un segundo emparejar de 5 en el medio. Cada palabra aparece
// al menos tres veces.
function cycleSteps(L){
  const words = L.words, pool = vocabPoolUpTo(L.id), kanaPool = kanaPoolUpTo(L.id);
  const cuenta = new Map(words.map(w => [w.k, 0]));
  const usar = (w, q) => { cuenta.set(w.k, cuenta.get(w.k) + 1); return q; };
  const menosVistas = ws => shuffle(ws).sort((a, b) => cuenta.get(a.k) - cuenta.get(b.k));
  const grupos = [];
  for (let i = 0; i < words.length; i += 2) grupos.push(words.slice(i, i + 2));
  const steps = [], vistas = [];
  // en las tandas, las opciones salen solo de lo ya visto: lecciones anteriores y palabras ya presentadas
  const previas = pool.filter(c => !words.includes(c));
  grupos.forEach((grupo, g) => {
    grupo.forEach((w, k) => steps.push({type:'present', word: w, n: vistas.length + k + 1, of: words.length}));
    const viejas = vistas.slice();
    vistas.push(...grupo);
    const visto = previas.concat(vistas);
    const qs = grupo.map(w => usar(w, vocabQuestion(w, visto, 'w2m')));   // recién presentada: reconocerla escrita
    if (g > 0 && g < grupos.length - 1)                                   // tandas del medio: vuelven dos anteriores
      menosVistas(viejas).slice(0, 2).forEach((w, i) => qs.push(usar(w, vocabQuestion(w, visto, i ? 'm2w' : 'a2m'))));
    steps.push(...mezclar(qs));
  });
  // primer emparejar: las de la última tanda y las anteriores menos vistas, hasta 5
  const ultima = grupos[grupos.length - 1];
  const parA = pairsQuestion([...ultima, ...menosVistas(words.filter(w => !ultima.includes(w)))].slice(0, 5), pool);
  parA.words.forEach(w => usar(w));
  steps.push(parA);
  // segundo emparejar, para el medio del cierre: entran seguro las que quedaron afuera del primero
  const afuera = words.filter(w => !parA.words.includes(w));
  const parB = pairsQuestion([...afuera, ...menosVistas(words.filter(w => !afuera.includes(w)))].slice(0, 5), pool);
  parB.words.forEach(w => usar(w));
  // cierre: 2 con dibujo, 3 de armar la palabra (la última por audio) y opción múltiple hasta
  // que cada palabra aparezca al menos 3 veces; como mínimo, tantas preguntas como palabras
  const cierre = [];
  pick(words.filter(w => w.ill && ILL[w.ill]), 2).forEach(w => cierre.push(usar(w, vocabQuestion(w, pool, 'p2w'))));   // al azar: que todos los dibujos vayan saliendo
  menosVistas(words.filter(w => kanaUnits(w.k).length > 1)).slice(0, 3).forEach((w, i, arr) => cierre.push(usar(w, spellQuestion(w, kanaPool, i === arr.length - 1))));
  const tipos = ['a2w', 'm2w', 'a2m'];
  let t = 0, guard = 0;
  while ((words.some(w => cuenta.get(w.k) < 3) || cierre.length < words.length) && guard++ < 40){
    const w = menosVistas(words)[0];
    cierre.push(usar(w, vocabQuestion(w, pool, tipos[t++ % tipos.length])));
  }
  const fin = mezclar(cierre);
  fin.splice(Math.floor(fin.length / 2), 0, parB);
  steps.push(...fin);
  return steps;
}

// Repasos de unidad (una sola lógica para los tres; ver el manifiesto). Veinte preguntas, todas puntuadas:
// - kana de la unidad: al menos uno de cada fila, y los de marca con cada fila de marcas representada;
//   desde la unidad 2, algunos de unidades anteriores;
// - palabras repartidas entre las lecciones de palabras, con los tipos del ciclo (dibujo, armar, opción múltiple);
// - nunca preguntas de las lecciones de mapa: sus ideas vuelven como preguntas puente (unidad 1);
// - gramática, escucha, diálogo (solo sus preguntas de audio) y frases, según la unidad.
// Cada pregunta lleva la lección de donde viene (src), para que el resultado diga qué repasar.
function coverPick(groups, n){
  groups = groups.filter(g => g.length);
  const out = [];
  shuffle(groups).forEach(g => { if (out.length < n) out.push(pick(g, 1)[0]); });
  const rest = shuffle(groups.flat().filter(k => !out.includes(k)));
  while (out.length < n && rest.length) out.push(rest.shift());
  return out;
}
function reviewQuestions(L){
  const unit = UNITS.find(u => u.id === L.unit);
  const ls = unit.lessons.filter(l => l !== L && !l.map);
  const rv = L.rv || {};
  const title = l => l.short || l.title;
  const tag = (q, l) => { q.src = title(l); return q; };
  const qs = [];
  // kana
  const kpool = kanaPoolUpTo(L.id);
  const kl = ls.filter(l => l.type === 'kana');
  const origen = {};
  ALL_LESSONS.forEach(l => { if (l.type === 'kana') [...l.set, ...(l.daku || [])].forEach(k => { origen[k] = l; }); });
  const filas = kl.map(l => l.set.filter(k => !EXCLUDE_QUIZ.has(k)));
  const marcas = {};
  kl.forEach(l => (l.daku || []).filter(k => !EXCLUDE_QUIZ.has(k)).forEach(k => { (marcas[ROW[k]] = marcas[ROW[k]] || []).push(k); }));
  const nMarca = Object.keys(marcas).length ? (rv.marked || 0) : 0;
  let kana = coverPick(filas, (rv.kana || 0) - nMarca).concat(coverPick(Object.values(marcas), nMarca));
  if (rv.prev){
    const antes = ALL_LESSONS.slice(0, lessonIndex(unit.lessons[0].id)).filter(l => l.type === 'kana');
    kana = kana.concat(pick(uniq(antes.flatMap(l => [...l.set, ...(l.daku || [])])).filter(k => !EXCLUDE_QUIZ.has(k)), rv.prev));
  }
  const tipos = ['k2r','r2k','a2k'];
  let t = Math.floor(Math.random() * 3);
  shuffle(kana).forEach(k => qs.push(tag(kanaQuestion(k, kpool, k === 'を' ? 'k2r' : tipos[t++ % 3]), origen[k])));
  // palabras: repartidas entre las lecciones de palabras de la unidad
  if (rv.words){
    const vl = ls.filter(l => l.type === 'vocab');
    const cuota = new Map(vl.map(l => [l, Math.floor(rv.words / vl.length)]));
    shuffle(vl).slice(0, rv.words % vl.length).forEach(l => cuota.set(l, cuota.get(l) + 1));
    let elegidas = [];
    vl.forEach(l => pick(l.words, cuota.get(l)).forEach(w => elegidas.push({w, l})));
    elegidas = shuffle(elegidas);
    const vpool = vocabPoolUpTo(L.id), kp = kanaPoolUpTo(L.id);
    const nDib = rv.words >= 8 ? 2 : 1, nArm = rv.words >= 8 ? 2 : 1;
    const conDib = elegidas.filter(e => e.w.ill && ILL[e.w.ill]).slice(0, nDib);
    const resto = elegidas.filter(e => !conDib.includes(e));
    const armar = resto.filter(e => kanaUnits(e.w.k).length > 1).slice(0, nArm);
    const mc = resto.filter(e => !armar.includes(e));
    conDib.forEach(e => qs.push(tag(vocabQuestion(e.w, vpool, 'p2w'), e.l)));
    armar.forEach((e, i) => qs.push(tag(spellQuestion(e.w, kp, i === armar.length - 1 && armar.length > 1), e.l)));
    const mt = shuffle(['w2m','m2w','a2m','a2w']);
    mc.forEach((e, i) => qs.push(tag(vocabQuestion(e.w, vpool, mt[i % mt.length]), e.l)));
  }
  // preguntas puente: ideas de las lecciones de mapa, con kana ya enseñados
  if (rv.puente && L.puente){
    uniq(L.puente.map(p => p.l)).forEach(id => pick(L.puente.filter(p => p.l === id), rv.puente).forEach(p => qs.push(tag(fixedQ(p), LESSON[id]))));
  }
  // gramática y diálogo (del diálogo, solo las preguntas de audio: se entienden sin la conversación)
  if (rv.fixed){
    const fx = [];
    ls.forEach(l => {
      if (l.type === 'grammar') l.quiz.forEach(f => fx.push({f, l}));
      if (l.type === 'dialogue') l.quiz.filter(f => f.audio).forEach(f => fx.push({f, l}));
    });
    pick(fx, rv.fixed).forEach(e => qs.push(tag(fixedQ(e.f), e.l)));
  }
  // escucha
  if (rv.listen){
    const ll = ls.find(l => l.type === 'listen');
    if (ll) listenQuestions(ll.items, rv.listen).forEach(q => qs.push(tag(q, ll)));
  }
  // frases: de «Frases de todos los días», una automática y una de situación
  if (rv.frases){
    const fl = ls.find(l => l.type === 'phrases');
    if (fl){
      const nAuto = Math.ceil(rv.frases / 2);
      phraseQuestions(fl.items, nAuto, fl.items).forEach(q => qs.push(tag(q, fl)));
      pick(fl.quiz, rv.frases - nAuto).forEach(f => qs.push(tag(fixedQ(f), fl)));
    }
  }
  // preguntas propias del repaso (unidad 2: la lectura de は en los saludos)
  if (rv.extra && L.extra) pick(L.extra, rv.extra).forEach(f => qs.push(tag(fixedQ(f), LESSON[f.l])));
  return mezclar(qs);
}

// Repaso ponderado de kana: los que más fallás salen más seguido
function kanaReview(learned, stats, n){
  const pool = learned.filter(k => !EXCLUDE_QUIZ.has(k));
  if (!pool.length) return [];
  const weight = k => { const s = stats[k]; if (!s) return 2; const [seen, err] = s; return 1 + 6 * (err + 0.3) / (seen + 1); };
  const chosen = [];
  const counts = {};
  const max = Math.min(n, pool.length * 2);
  let guard = 0;
  while (chosen.length < max && guard++ < 1000){
    const total = pool.reduce((t, k) => t + (counts[k] >= 2 ? 0 : weight(k)), 0);
    if (total <= 0) break;
    let r = Math.random() * total;
    for (const k of pool){
      if (counts[k] >= 2) continue;
      r -= weight(k);
      if (r <= 0){ chosen.push(k); counts[k] = (counts[k] || 0) + 1; break; }
    }
  }
  const types = ['k2r','r2k','a2k'];
  return shuffle(chosen).map((k, i) => kanaQuestion(k, pool, k === 'を' ? 'k2r' : types[i % 3]));
}

// Conversión de romaji a kana (Hepburn, con variantes comunes)
const ROMA = (function(){
  const m = {a:'あ',i:'い',u:'う',e:'え',o:'お'};
  const rows = {k:'かきくけこ',g:'がぎぐげご',s:'さしすせそ',z:'ざじずぜぞ',t:'たちつてと',d:'だぢづでど',n:'なにぬねの',h:'はひふへほ',b:'ばびぶべぼ',p:'ぱぴぷぺぽ',m:'まみむめも',r:'らりるれろ',l:'らりるれろ'};
  for (const c in rows) 'aiueo'.split('').forEach((v, i) => { m[c + v] = rows[c][i]; });
  Object.assign(m, {ya:'や',yu:'ゆ',yo:'よ',wa:'わ',wo:'を',shi:'し',chi:'ち',tsu:'つ',fu:'ふ',ji:'じ',dzu:'づ',
    sha:'しゃ',shu:'しゅ',sho:'しょ',she:'しぇ',cha:'ちゃ',chu:'ちゅ',cho:'ちょ',che:'ちぇ',ja:'じゃ',ju:'じゅ',jo:'じょ',je:'じぇ',
    fa:'ふぁ',fi:'ふぃ',fe:'ふぇ',fo:'ふぉ',va:'ゔぁ',vi:'ゔぃ',vu:'ゔ',ve:'ゔぇ',vo:'ゔぉ',wi:'うぃ',we:'うぇ',thi:'てぃ',dhi:'でぃ',
    xa:'ぁ',xi:'ぃ',xu:'ぅ',xe:'ぇ',xo:'ぉ',xya:'ゃ',xyu:'ゅ',xyo:'ょ',xtsu:'っ',xtu:'っ',ltsu:'っ',ltu:'っ'});
  const yo = {k:'き',g:'ぎ',n:'に',h:'ひ',b:'び',p:'ぴ',m:'み',r:'り',s:'し',z:'じ',j:'じ',t:'ち',c:'ち'};
  for (const c in yo){ m[c + 'ya'] = yo[c] + 'ゃ'; m[c + 'yu'] = yo[c] + 'ゅ'; m[c + 'yo'] = yo[c] + 'ょ'; }
  return m;
})();
const KATA_OVR = {ti:'てぃ',di:'でぃ',tu:'とぅ',du:'どぅ'};
const MAC_H = {'ā':'aa','ī':'ii','ū':'uu','ē':'ei','ō':'ou','â':'aa','î':'ii','û':'uu','ê':'ei','ô':'ou'};
const MAC_K = {'ā':'a-','ī':'i-','ū':'u-','ē':'e-','ō':'o-','â':'a-','î':'i-','û':'u-','ê':'e-','ô':'o-'};

function romajiToKana(input, kata){
  let s = String(input || '').normalize('NFC').toLowerCase().replace(/[āīūēōâîûêô]/g, c => (kata ? MAC_K : MAC_H)[c]);
  const V = 'aiueo';
  let out = '', i = 0;
  while (i < s.length){
    const c = s[i], n1 = s[i + 1];
    if (c === '-' || c === 'ー'){ out += 'ー'; i++; continue; }
    if (c === "'" || c === '’'){ i++; continue; }
    if (c === 'n'){
      if (n1 === undefined){ out += 'ん'; i++; continue; }
      if (n1 === "'" || n1 === '’'){ out += 'ん'; i += 2; continue; }
      if (n1 === 'n'){
        const n2 = s[i + 2];
        if (n2 === undefined || !(V.includes(n2) || n2 === 'y')){ out += 'ん'; i += 2; continue; }
        out += 'ん'; i++; continue;
      }
      if (!(V.includes(n1) || n1 === 'y')){ out += 'ん'; i++; continue; }
    }
    if (c === n1 && /[bcdfghjkmpqrstvwxyz]/.test(c)){ out += 'っ'; i++; continue; }
    if (c === 't' && n1 === 'c' && s[i + 2] === 'h'){ out += 'っ'; i++; continue; }
    let hit = false;
    for (let L = 4; L >= 1; L--){
      const sub = s.substr(i, L);
      const v = (kata && KATA_OVR[sub]) || ROMA[sub];
      if (v){ out += v; i += L; hit = true; break; }
    }
    if (!hit){ out += c; i++; }
  }
  if (kata) out = out.replace(/[\u3041-\u3096]/g, ch => String.fromCharCode(ch.charCodeAt(0) + 0x60));
  return out;
}

// Rondas de tarjetas: las palabras que más fallás salen más seguido
function wordWeight(st){
  if (!st) return 3;
  const acc = (st.e + 0.5) / (st.s + 1);
  return st.st >= 3 ? 0.35 + acc : 1 + 4 * acc;
}
function wordCard(w, pool, dir){
  const q = { wk: w.key, say: w.k, reveal: {k: w.k, es: w.es}, ex: w.kj ? 'Con kanji se escribe ' + w.kj + '.' : undefined };
  if (dir === 'j2e'){
    const d = wordDistractors(w, pool, 3, 'es');
    Object.assign(q, { label:'¿Qué significa?', show:{jp: w.k, play: w.k} }, mcFrom(w, d, c => ({t: c.es})));
    q.sum = w.k + ' → ' + w.es; q.ans = w.es;
  } else {
    const d = wordDistractors(w, pool, 3, 'k');
    Object.assign(q, { label:'¿Cómo se dice?', show:{es: w.es} }, mcFrom(w, d, c => ({t: c.k, jp: true})));
    q.sum = '«' + w.es + '» → ' + w.k; q.ans = w.k;
  }
  return q;
}
function wordRound(pool, stats, n){
  if (pool.length < 4) return [];
  n = Math.min(n, pool.length);
  const chosen = [], rest = pool.slice();
  while (chosen.length < n && rest.length){
    const tot = rest.reduce((t, w) => t + wordWeight(stats[w.key]), 0);
    let r = Math.random() * tot, idx = 0;
    for (; idx < rest.length; idx++){ r -= wordWeight(stats[rest[idx].key]); if (r <= 0) break; }
    idx = Math.min(idx, rest.length - 1);
    chosen.push(rest[idx]); rest.splice(idx, 1);
  }
  const start = Math.random() < 0.5 ? 0 : 1;
  return chosen.map((w, i) => wordCard(w, pool, (i + start) % 2 ? 'j2e' : 'e2j'));
}

const STORE_KEY = 'jp-curso-v1';
// resetAt: momento del último «Borrar». Lo aprobado antes de esa marca no vuelve al sincronizar, venga de donde venga.
function freshState(){ return {v:1, lessons:{}, kana:{}, hitos:{}, words:{own:[], stats:{}, log:{}, updated:0}, settings:{romaji:true, slow:false, think:false, sfxVol:80, sfxPrev:80}, updated:0, resetAt:0}; }
function normalize(){
  if (!S.words || typeof S.words !== 'object') S.words = {};
  S.words.own = Array.isArray(S.words.own) ? S.words.own : [];
  S.words.stats = S.words.stats && typeof S.words.stats === 'object' ? S.words.stats : {};
  S.words.log = S.words.log && typeof S.words.log === 'object' ? S.words.log : {};
  S.words.updated = S.words.updated || 0;
  S.settings = Object.assign({romaji:true, slow:false, think:false, sfxVol:80, sfxPrev:80}, S.settings || {});
  if ('sfx' in S.settings){ if (S.settings.sfx === false) S.settings.sfxVol = 0; delete S.settings.sfx; }
  S.resetAt = S.resetAt || 0;
  if (S.lessons && typeof S.lessons === 'object') Object.keys(S.lessons).forEach(id => { if (!LESSON[id]) delete S.lessons[id]; });
  // hitos ya vistos. Progreso anterior a los hitos: las frases de lecciones aprobadas se destraban solas, sin la secuencia
  if (!S.hitos || typeof S.hitos !== 'object') S.hitos = {};
  if (!S.hv){
    Object.keys(S.lessons || {}).forEach(id => { if (S.lessons[id].done && phrasesOf(id).length) S.hitos[id] = true; });
    S.hv = 1;
  }
}

normalize();

function saveLocal(){ try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch(e){} }
function save(){ S.updated = Date.now(); saveLocal(); queueRemote(); }
function queueRemote(){ if (!remoteRef) return; clearTimeout(remoteTimer); remoteTimer = setTimeout(flushRemote, 1500); }
async function flushRemote(){
  if (!remoteRef) return;
  if (writing){ pendingWrite = true; return; }
  writing = true;
  try {
    // antes de escribir se suma lo guardado desde otro dispositivo o ventana (incluido un «Borrar» hecho allá);
    // si no, una copia vieja abierta en otro lado pisaría el borrado con su progreso anterior
    const snap = await remoteRef.get();
    if (snap.exists){ mergeRemote(snap.data()); saveLocal(); }
    await remoteRef.set(JSON.parse(JSON.stringify(S)));
  }
  catch(e){
    const code = e && e.code;
    if (code === 'unavailable' || code === 'resource_exhausted'){ setTimeout(queueRemote, 3000 + Math.random() * 3000); }
    else { remoteRef = null; syncMode = 'local'; updateSyncLabel(); }
  }
  writing = false;
  if (pendingWrite){ pendingWrite = false; flushRemote(); }
}
function mergeRemote(r){
  if (!r || typeof r !== 'object') return;
  r = JSON.parse(JSON.stringify(r));
  // «Borrar»: si la cuenta tiene un borrado más nuevo que el de acá, lo aprobado acá antes de ese momento se descarta
  const rR = r.resetAt || 0;
  if (rR > (S.resetAt || 0)){
    Object.keys(S.lessons).forEach(id => { if (!((S.lessons[id].at || 0) > rR)) delete S.lessons[id]; });
    Object.keys(S.hitos).forEach(id => { if (!S.lessons[id]) delete S.hitos[id]; });
    S.kana = {};
    S.resetAt = rR;
  }
  const corte = S.resetAt || 0;   // y de la cuenta solo entra lo aprobado después del último borrado
  const L = r.lessons || {};
  const vale = b => !!b && (!corte || (b.at || 0) > corte);
  for (const id in L){
    const b = L[id];
    if (!vale(b)) continue;
    const a = S.lessons[id] || {};
    S.lessons[id] = {done: !!(a.done || b.done), best: Math.max(a.best || 0, b.best || 0), at: Math.max(a.at || 0, b.at || 0)};
  }
  if (r.hitos && typeof r.hitos === 'object') Object.keys(r.hitos).forEach(id => { if (r.hitos[id] && vale(L[id])) S.hitos[id] = true; });
  if (!r.hv) Object.keys(L).forEach(id => { if (vale(L[id]) && L[id].done && phrasesOf(id).length) S.hitos[id] = true; });   // progreso de antes de los hitos
  if (rR === corte){   // las estadísticas de kana no tienen fecha: solo se suman si las dos copias vienen del mismo borrado
    const K = r.kana || {};
    for (const k in K){ const a = S.kana[k], b = K[k]; if (Array.isArray(b) && (!a || b[0] > a[0])) S.kana[k] = b; }
  }
  if (r.settings && (r.updated || 0) > (S.updated || 0)) S.settings = Object.assign({}, S.settings, r.settings);
  if (r.words && (r.words.updated || 0) > (S.words.updated || 0)) S.words = r.words;
  S.updated = Math.max(S.updated || 0, r.updated || 0);
  normalize();
}
async function initSync(){
  if (!window.claude || typeof window.claude.use !== 'function') return;
  try {
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db || !user) return;
    const uid = await user.id();
    if (!uid) return;
    const ref = db.doc('data/users/' + uid + '/progress');
    const snap = await ref.get();
    if (snap.exists){ mergeRemote(snap.data()); saveLocal(); applySettings(); if (!Q) route(); }
    remoteRef = ref; syncMode = 'cuenta'; updateSyncLabel();
    queueRemote();
  } catch(e){ /* sin sincronización: queda en el dispositivo */ }
}

/* ---------- Audio (síntesis de voz del sistema) ---------- */
const TTS = {ok: typeof window.speechSynthesis !== 'undefined' && typeof window.SpeechSynthesisUtterance !== 'undefined', voice:null, count:0, token:0};
function pickVoice(){
  if (!TTS.ok) return;
  const vs = window.speechSynthesis.getVoices() || [];
  TTS.count = vs.length;
  TTS.voice = vs.find(v => /^ja[-_]JP/i.test(v.lang)) || vs.find(v => /^ja/i.test(v.lang)) || null;
  updateVoiceLabel();
}
if (TTS.ok){
  pickVoice();
  try { window.speechSynthesis.addEventListener('voiceschanged', pickVoice); } catch(e){ window.speechSynthesis.onvoiceschanged = pickVoice; }
}
function speak(text, opts){
  opts = opts || {};
  cancelSay();
  if (!TTS.ok){ toast('Este visor no reproduce audio. Abrí el curso en Chrome o Safari para escucharlo.'); return; }
  try {
    const s = window.speechSynthesis;
    if (!opts.keep){ TTS.token++; if (s.speaking || s.pending) s.cancel(); }
    const u = new SpeechSynthesisUtterance(String(text).replace(/\s+/g, ''));
    u.lang = 'ja-JP';
    if (TTS.voice) u.voice = TTS.voice;
    u.rate = (S.settings.slow ? 0.62 : 0.9) * (opts.rate || 1);
    u.pitch = opts.pitch || 1;
    if (opts.onend) u.onend = opts.onend;
    u.onerror = e => { if (e && e.error && !/interrupted|canceled/.test(e.error)) audioFail(); };
    s.speak(u);
  } catch(e){ audioFail(); }
}
let audioWarned = false;
function audioFail(){ if (audioWarned) return; audioWarned = true; toast('No se pudo reproducir el audio. En Ajustes (el engranaje del inicio) está cómo instalar una voz japonesa.'); }
function speakSequence(lines){
  if (!TTS.ok){ speak(''); return; }
  TTS.token++; if (window.speechSynthesis.speaking || window.speechSynthesis.pending) window.speechSynthesis.cancel();
  const my = TTS.token;
  let i = 0;
  const next = () => {
    if (my !== TTS.token || i >= lines.length){ markPlaying(-1); return; }
    const ln = lines[i]; markPlaying(i); i++;
    speak(ln.k, {keep:true, pitch: ln.v === 'f' ? 1.3 : 0.8, onend: () => setTimeout(next, 450)});
  };
  next();
}
function markPlaying(i){ document.querySelectorAll('.dline').forEach((el, j) => el.classList.toggle('playing', j === i)); }
// Al responder: primero el efecto y la palabra cuando el efecto ya se apagó (ver «Sonidos» en la guía de estilo).
// La espera se cuenta desde que el efecto empieza a sonar de verdad: si el motor estaba en pausa, espera a que arranque.
const VOZ_TRAS = {acierto: 550, error: 400};
let sayTimer = null, sayTok = 0;
function cancelSay(){ sayTok++; if (sayTimer){ clearTimeout(sayTimer); sayTimer = null; } }
function answerSound(ok, text){
  cancelSay();
  const tok = sayTok, k = ok ? 'acierto' : 'error';
  const voz = text ? () => { if (tok !== sayTok) return; sayTimer = setTimeout(() => { sayTimer = null; if (tok === sayTok) speak(text); }, SFX.on() ? VOZ_TRAS[k] : 0); } : null;
  SFX[k](voz);
}

/* ---------- Efectos de sonido (síntesis propia, ver «Sonidos» en la guía de estilo) ---------- */
const SFX = (function(){
  const midi = n => 440 * Math.pow(2, (n - 69) / 12);
  const YO = [74, 76, 79, 81, 83, 86];              // 陽音階 sobre re: re5 mi5 sol5 la5 si5 re6
  const R = Math.random, vary = c => Math.pow(2, ((R() * 2 - 1) * c) / 1200);
  const smooth = x => { x = Math.max(0, Math.min(1, x)); return x * x * (3 - 2 * x); };

  const trazos = {};

  let master = null;

    if (ctx) return ctx;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    try {
      ctx = new AC();
      master = ctx.createGain(); master.gain.value = gain();
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -9; comp.knee.value = 6; comp.ratio.value = 4; comp.attack.value = 0.002; comp.release.value = 0.12;
      out = ctx.createGain(); out.connect(comp); comp.connect(master);
      // limitador final: con el deslizador al máximo, ningún efecto satura
      const lim = ctx.createDynamicsCompressor();
      lim.threshold.value = -1; lim.knee.value = 0; lim.ratio.value = 20; lim.attack.value = 0.001; lim.release.value = 0.08;
      master.connect(lim); lim.connect(ctx.destination);
      // caja del koto
      const b1 = biquad('highpass', 170, 0.7), b2 = biquad('peaking', 1100, 1, 3), b3 = biquad('peaking', 3000, 1.2, 2);
      b1.connect(b2); b2.connect(b3); b3.connect(out); body = b1;
      setTimeout(() => { ['hanamaru', 'maru'].forEach(k => { try { trazoData(k); } catch(e){} }); }, 50);
    } catch(e){ ctx = null; }
    return ctx;
  }
  // Ejecuta un sonido: crea o reanuda el motor; tras 60 s sin sonidos lo suspende para no gastar batería.
  // «luego» corre cuando el sonido quedó programado (o enseguida, si no puede sonar): de ahí se cuenta la espera de la voz.
  function run(fn, luego){
    const fin = () => { if (luego) luego(); };
    if (!on()) { fin(); return; }
    const c = init(); if (!c) { fin(); return; }
    const go = () => { try { fn(c.currentTime + 0.02); } catch(e){ console.error('SFX', e); } fin(); dormir(); };
    if (c.state === 'running') go(); else c.resume().then(go, fin);

  function dormir(){ clearTimeout(idleT); idleT = setTimeout(() => { if (ctx && ctx.state === 'running') ctx.suspend(); }, 60000); }

    return noise;

  function mode(t, f, amp, t60, bend){

    o.frequency.setValueAtTime(f, t);

    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(amp, t + 0.0015);
    g.gain.exponentialRampToValueAtTime(Math.max(amp * 0.001, 1e-5), t + 0.0015 + t60);
    o.connect(g); g.connect(out); o.start(t); o.stop(t + t60 + 0.05);
  }
  function click(t, dur, amp, type, f, q){
    const s = ctx.createBufferSource(); s.buffer = noiseBuf();
    const b = biquad(type, f, q), g = ctx.createGain();
    g.gain.value = 0;
    g.gain.setValueAtTime(amp, t); g.gain.exponentialRampToValueAtTime(amp * 0.001, t + dur);

    const sr = ctx.sampleRate, n = Math.floor(sr * Math.min(t60 * 1.1 + 0.05, 3.2));
    const buf = ctx.createBuffer(1, n, sr), y = buf.getChannelData(0);
    const P = sr / f, N = Math.floor(P - 0.6), Dl = P - 0.5 - N, C = (1 - Dl) / (1 + Dl);
    const rho = Math.min(0.99995, Math.pow(10, -3 / (t60 * f)) / Math.cos(Math.PI * f / sr));
    const ex = new Float32Array(N + 1), pk = Math.max(1, Math.round(0.14 * N));
    let lp = 0, mean = 0;
    for (let i = 0; i <= N; i++){ lp += bright * ((R() * 2 - 1) - lp); ex[i] = lp; }
    for (let i = N; i >= pk; i--) ex[i] -= ex[i - pk];
    for (let i = 0; i <= N; i++) mean += ex[i];
    mean /= N + 1;
    let ai = 0, ao = 0, x1 = 0, h1 = 0, pkv = 0;
    for (let i = 0; i < n; i++){
      const v = rho * 0.5 * ((i >= N ? y[i - N] : 0) + (i > N ? y[i - N - 1] : 0));

  }
  // Madera: el golpe grave se reconoce por los armónicos altos, porque el parlante del teléfono casi no reproduce
  // lo que está por debajo de 450 Hz. Nivelada para sonar unos 3 dB por debajo del acierto en el teléfono.

    const v = vary(20), g = 2.2 * k;
    mode(t, 520 * v, 0.55 * g, 0.2, 0.94); mode(t, 1180 * v, 0.4 * g, 0.09); mode(t, 1950 * v, 0.22 * g, 0.05); mode(t, 3100 * v, 0.08 * g, 0.025);

    const X = s => 3 * (1 - s) * (1 - s) * s * 0.5 + 3 * (1 - s) * s * s * 0.3 + s * s * s;
    const Y = s => 3 * (1 - s) * (1 - s) * s * 0.1 + 3 * (1 - s) * s * s + s * s * s;

    for (let i = 0; i < 40; i++){ const m = (lo + hi) / 2; if (X(m) < xT) lo = m; else hi = m; }
    return Y((lo + hi) / 2);
  }
  const CIERRE = (function(){ for (let x = 0; x <= 1; x += 0.005) if (bezier(x) >= 0.985) return x * 1.6; return 1.5; })();

    if (trazos[kind]) return trazos[kind];
    const sr = 24000, dur = 1.6, n = Math.floor((dur + 0.05) * sr), d = new Float32Array(n);

     Ciclo de unos 5 s: «miiin» que se aclara, dos a cuatro «min» cortos y un «miiiiii» largo que baja de volumen

  function Reson(sr){ this.sr = sr; this.x1 = this.x2 = this.y1 = this.y2 = 0; this.n = 0; }
  Reson.prototype.step = function(x, fc, bw){
    if ((this.n++ & 15) === 0){ const w = 2 * Math.PI * Math.min(fc, this.sr * 0.45) / this.sr, al = Math.sin(w) * bw / (2 * fc), a0 = 1 + al; this.b0 = al / a0; this.a1 = -2 * Math.cos(w) / a0; this.a2 = (1 - al) / a0; }
    const y = this.b0 * (x - this.x2) - this.a1 * this.y1 - this.a2 * this.y2;
    this.x2 = this.x1; this.x1 = x; this.y2 = this.y1; this.y1 = y; return y;
  };
  function bq(d, sr, type, f, q){
    const w = 2 * Math.PI * f / sr, cs = Math.cos(w), al = Math.sin(w) / (2 * q), a0 = 1 + al, a1 = -2 * cs, a2 = 1 - al;
    const b0 = type === 'lp' ? (1 - cs) / 2 : (1 + cs) / 2, b1 = type === 'lp' ? 1 - cs : -(1 + cs), b2 = b0;
    let x1 = 0, x2 = 0, y1 = 0, y2 = 0;
    for (let i = 0; i < d.length; i++){ const x = d[i], y = (b0 * x + b1 * x1 + b2 * x2 - a1 * y1 - a2 * y2) / a0; x2 = x1; x1 = x; y2 = y1; y1 = y; d[i] = y; }
  }
  function genMinmin(sr, seed, cycles){
    const rnd = rng(seed), segs = [];
    let t = 0.02;
    for (let c = 0; c < cycles; c++){
      let d = 0.8 + rnd() * 0.12; segs.push({k:'intro', t0:t, d}); t += d + 0.17 + rnd() * 0.05;
      const n = 2 + Math.floor(rnd() * 3);
      for (let i = 0; i < n; i++){ d = 0.32 + rnd() * 0.05; segs.push({k:'min', t0:t, d}); t += d + 0.15 + rnd() * 0.05; }
      t += 0.03; d = 2.3 + rnd() * 0.5; segs.push({k:'long', t0:t, d}); t += d;
    }
    const n = Math.floor((t + 0.1) * sr), out = new Float32Array(n), shift = 1 + (rnd() - 0.5) * 0.06;
    const R1 = new Reson(sr), R2 = new Reson(sr), R3 = new Reson(sr);
    let si = 0, ph = 0, dblAt = -1, dblAmp = 0, p = null;
    for (let i = 0; i < n; i++){
      const time = i / sr;
      if ((i & 31) === 0){
        while (si < segs.length - 1 && time >= segs[si + 1].t0) si++;
        const g = segs[si]; p = null;
        if (time >= g.t0 && time < g.t0 + g.d){
          const u = (time - g.t0) / g.d;
          if (g.k === 'intro') p = {A: smooth(u / 0.1) * (0.85 + 0.15 * u) * (1 - smooth((u - 0.94) / 0.06)), fc: 4100 + 700 * smooth(u / 0.8), r: 165 + 18 * u, dbl: 0.65, br: 0.25 + 0.35 * u};
          else if (g.k === 'min') p = {A: smooth(u / 0.08) * (1 - smooth((u - 0.88) / 0.12)), fc: 3400 + 1500 * smooth(u), r: 180, dbl: 0.65, br: 0.15 + 0.55 * u};
          else p = {A: smooth(u / 0.04) * (1 - 0.65 * u) * (1 - smooth((u - 0.985) / 0.015)), fc: 4350 - 200 * u, r: 88 + 92 * Math.pow(1 - u, 2.5), dbl: 0.25, br: 0.3};
          p.fc *= shift;
        }
      }
      let x = 0;
      if (p && p.A > 0.001){
        ph += p.r * (1 + 0.04 * (rnd() * 2 - 1)) / sr;
        if (ph >= 1){ ph -= 1; x = p.A * (0.85 + 0.3 * rnd()); dblAt = i + Math.round(0.45 * sr / p.r); dblAmp = p.A * p.dbl * (0.8 + 0.4 * rnd()); }
      }
      if (i === dblAt) x += dblAmp;
      const fc = p ? p.fc : 4400, br = p ? p.br : 0.3;
      out[i] = R1.step(x, fc, 700) + br * 0.6 * R2.step(x, fc * 1.38, 900) + 0.25 * R3.step(x, fc * 0.78, 600);
    }
    // el canto real no tiene energía fuera de 3,2-6,5 kHz: pasabanda de 6.º orden por lado
    [0.518, 0.707, 1.932].forEach(q => bq(out, sr, 'hp', 3200, q));
    [0.518, 0.707, 1.932].forEach(q => bq(out, sr, 'lp', Math.min(6500, sr * 0.45), q));
    return out;
  }
  // Escena: una cigarra cerca hace un ciclo entero desde su «miiin»; dos más lejos ya venían cantando.
  // Todo termina con el «miiiiii» largo de la cercana, que se apaga solo.
  function escena(sr, seed){
    const r = rng(seed), cerca = genMinmin(sr, seed, 1);
    const len = cerca.length + Math.floor(0.2 * sr), L = new Float32Array(len), Rr = new Float32Array(len);
    const voces = [[cerca, 0, 1, -0.1, 0], [genMinmin(sr, seed + 17, 2), 1.8 + r() * 1.5, 0.3, 0.6, 0.35], [genMinmin(sr, seed + 31, 2), 3 + r() * 1.5, 0.2, -0.6, 0.5]];
    const fin = Math.floor(0.7 * sr), ent = Math.floor(0.4 * sr);
    voces.forEach(([d, off, g, pan, lejos], k) => {
      const o = Math.floor(off * sr), pl = Math.cos((pan + 1) * Math.PI / 4), pr = Math.sin((pan + 1) * Math.PI / 4);
      let lp = 0;
      for (let i = 0; i < len; i++){
        const j = i + o; if (j >= d.length) break;
        let v = d[j];
        if (lejos){ lp += (1 - lejos) * (v - lp); v = lp; }
        let e = g;
        if (k && i < ent) e *= i / ent;                          // las lejanas entran suave: ya estaban cantando
        const f = k ? fin : Math.floor(0.5 * sr);                 // al final todas se apagan; la cercana, en su último medio segundo
        if (i > cerca.length - f) e *= Math.max(0, (cerca.length - i) / f);
        L[i] += v * e * pl; Rr[i] += v * e * pr;
      }
    });
    let pk = 0; for (let i = 0; i < len; i++) pk = Math.max(pk, Math.abs(L[i]), Math.abs(Rr[i]));
    const k = pk ? 0.9 / pk : 1; for (let i = 0; i < len; i++){ L[i] *= k; Rr[i] *= k; }
    return [L, Rr];
  }
  let verano = null, veranoHasta = 0, veranoT = null;
  function prepararVerano(){ if (!verano && ctx) verano = escena(24000, Math.floor(R() * 1e6)); return verano; }
  function tocarVerano(t){
    const [L, Rr] = prepararVerano(), b = ctx.createBuffer(2, L.length, 24000);
    b.getChannelData(0).set(L); b.getChannelData(1).set(Rr);
    const s = ctx.createBufferSource(); s.buffer = b;
    const g = ctx.createGain(); g.gain.value = VERANO_NIVEL;
    s.connect(g); g.connect(out); s.start(t);
    veranoHasta = performance.now() + (t - ctx.currentTime + b.duration) * 1000;
    verano = null;                                               // la próxima vez, otra escena
    clearTimeout(veranoT); veranoT = setTimeout(() => { try { prepararVerano(); } catch(e){} }, b.duration * 1000 + 800);
  }
  const VERANO_NIVEL = 0.32;
  return {
    on,
    unlock(){ if (on() && init() && ctx.state !== 'running') ctx.resume().catch(() => {}); },
    // Verano de Evangelion al tocar el paraguas de la barra: tocar mientras suena no lo reinicia (la llave de prueba sigue igual)
    cigarras(){ if (performance.now() < veranoHasta) return; run(t => tocarVerano(t)); },
    // al abrir: suena solo si el navegador deja sonar sin un toque previo (con la app instalada) o si se toca la apertura
    apertura(){
      if (!on() || !init()) return;
      const limite = performance.now() + 1500;
      setTimeout(() => { try { prepararVerano(); } catch(e){} }, 60);
      if (ctx.state === 'running') setTimeout(() => SFX.cigarras(), 80);
      else ctx.resume().then(() => { if (performance.now() < limite) SFX.cigarras(); }, () => {});
    },
    // al mostrar cada pantalla de la práctica: si el motor estaba en pausa, se despierta antes de que haga falta
    despertar(){ if (on() && ctx && ctx.state === 'suspended'){ ctx.resume().catch(() => {}); dormir(); } },
    volumen(){ if (ctx && master) master.gain.setTargetAtTime(gain(), ctx.currentTime, 0.015); },
    // acierto: koto, dos cuerdas que suben (la, re)
    acierto(luego){ run(t => { const v = vary(10); pluck(t, midi(81) * v, 0.66, 0.7, 0.6); pluck(t + 0.075, midi(86) * v, 0.72, 0.9, 0.6); }, luego); },
    // error: madera grave y apagada
    error(luego){ run(t => madera(t, 1), luego); },
    // emparejar: el par i (desde 0) sube por la escala yo, en campanita; el par equivocado, madera suave
    par(i){ run(t => campanita(t, midi(YO[Math.max(0, Math.min(5, i))] + 12), 0.26, 0.8)); },
    parError(){ run(t => madera(t, 0.5)); },
    // armar: pieza de shōgi sobre el tablero; al sacarla, más suave y apenas más grave
    ficha(sacar){ run(t => { const v = vary(40) * (sacar ? 0.92 : 1), k = sacar ? 0.6 : 1; mode(t, 1380 * v, 0.3 * k, 0.045); mode(t, 2380 * v, 0.18 * k, 0.03); mode(t, 3900 * v, 0.09 * k, 0.018); mode(t, 640 * v, 0.22 * k, 0.07); click(t, 0.004, 0.25 * k, 'bandpass', 2500, 0.9); }); },
    // resultado con maru o hanamaru: el trazo acompaña el dibujo y, al cerrar, una frase de koto en escala yo
    aprobada(kind, conTrazo){ run(t => { if (conTrazo) trazo(t, kind); const c = t + (conTrazo ? CIERRE : 0.45); [0, 1, 2, 3].forEach(k => pluck(c - 0.42 + k * 0.1, midi(YO[k]), 0.42, 0.8, 0.55)); pluck(c, midi(YO[5]), 0.6, 1.5, 0.6); }); },
    // resultado sin marca: una sola cuerda grave y suave
    noAprobada(){ run(t => pluck(t, midi(67), 0.45, 0.9, 0.15)); },
    // hito de frases: fūrin de hierro (南部風鈴), tres golpes del badajo con un leve vaivén
    hito(){ run(t => { const f = 1480 * vary(10); [[0, 1], [0.8, 0.45], [1.9, 0.28]].forEach(([dt, s]) => { [[1, 1, 3.6], [1.0036, 0.8, 3.6], [2.71, 0.35, 1.8], [2.716, 0.3, 1.8], [5.12, 0.12, 0.8]].forEach(([r, a, d]) => mode(t + dt, f * r, 0.13 * s * a, d)); click(t + dt, 0.004, 0.08 * s, 'highpass', 4000, 0.7); }); }); }
  };
})();

// La unidad actual es la de la próxima lección sin aprobar; si ya no queda ninguna, la última disponible.
function currentUnit(){
  const next = ALL_LESSONS.find(l => !isDone(l.id));
  const avail = UNITS.filter(u => !u.soon);
  return next ? UNITS.find(u => u.id === next.unit) : avail[avail.length - 1];
}
function renderHome(){
  const total = ALL_LESSONS.length;
  const done = ALL_LESSONS.filter(l => isDone(l.id)).length;
  const next = ALL_LESSONS.find(l => !isDone(l.id));
  const u = currentUnit();
  const nd = u.lessons.filter(l => isDone(l.id)).length;
  const dots = u.lessons.map(l => '<i class="' + (isDone(l.id) ? 'on' : '') + '"></i>').join('');

    ? '<a class="btn primary wide has-kicker home-go" href="#/l/' + next.id + '"><span class="btn-kicker">' + (done ? 'Continuar' : 'Empezar') + '</span>' + '<span>' + jpify(esc(next.title)) + '</span>' + '</a>'

/* ---------- App instalable: service worker, versión y actualización ----------
   Solo en la app publicada (github.io) o al probarla en la computadora (localhost). En el artefacto de claude.ai
   (vista previa) no se registra: ahí la fila de versión va sin botón. */
function versionRowHTML(){
  const t = '<b>Versión ' + KASA_VERSION.v + '</b>', f = 'Del ' + KASA_VERSION.fecha + '.';
  if (!APPV.ok) return '<div class="set" id="verRow"><span class="set-t">' + t + '<small>' + f + '</small></span></div>';
  if (APPV.nueva) return '<div class="set" id="verRow"><span class="set-t">' + t + '<small>' + f + '</small><span class="ver-new"><i class="ver-dot" aria-hidden="true"></i>Hay una versión nueva</span></span><button class="btn small primary" data-act="verup">Actualizar</button></div>';
  return '<div class="set" id="verRow"><span class="set-t">' + t + '<small>' + f + ' Es la más reciente.</small></span><button class="btn small" data-act="verbuscar"' + (APPV.buscando ? ' disabled' : '') + '>' + (APPV.buscando ? 'Buscando…' : 'Buscar') + '</button></div>';
}
// Actualiza la fila de Ajustes y el punto del engranaje sin volver a dibujar la pantalla
function pintarVersion(){
  const row = document.getElementById('verRow');
  if (row) row.outerHTML = versionRowHTML();
  const gear = document.querySelector('.kbar-btn[href="#/ajustes"]');
  if (gear){
    const dot = gear.querySelector('.gear-dot');
    if (APPV.nueva && !dot) gear.insertAdjacentHTML('beforeend', '<i class="gear-dot" aria-hidden="true"></i>');
    if (!APPV.nueva && dot) dot.remove();
    gear.setAttribute('aria-label', APPV.nueva ? 'Ajustes: hay una versión nueva' : 'Ajustes');
  }
}
function marcarNueva(){ APPV.nueva = true; APPV.buscando = false; pintarVersion(); }
function vigilarInstalacion(w){
  if (!w) return;
  w.addEventListener('statechange', () => {
    if (w.state === 'installed' && navigator.serviceWorker.controller) marcarNueva();
    if (w.state === 'redundant' && APPV.buscando){ APPV.buscando = false; pintarVersion(); toast('No se pudo bajar la versión nueva. Probá de nuevo más tarde.'); }
  });
}
function iniciarApp(){
  if (!('serviceWorker' in navigator) || !/(^|\.)github\.io$|^localhost$|^127\.0\.0\.1$/.test(location.hostname)) return;
  navigator.serviceWorker.register('sw.js').then(reg => {
    APPV.ok = true; APPV.reg = reg; APPV.ultima = Date.now();
    if (reg.waiting && navigator.serviceWorker.controller) APPV.nueva = true;
    vigilarInstalacion(reg.installing);
    reg.addEventListener('updatefound', () => vigilarInstalacion(reg.installing));
    pintarVersion();
  }).catch(() => {});
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (APPV.recargar) location.reload(); });
  // Al volver a la app después de un rato (queda abierta en segundo plano), se fija si hay algo nuevo
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && APPV.reg && Date.now() - APPV.ultima > 30 * 60 * 1000){
      APPV.ultima = Date.now(); APPV.reg.update().catch(() => {});
    }
  });
  // Que Android no borre el progreso cuando le falta espacio
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
}
function buscarVersion(){
  if (!APPV.reg || APPV.buscando) return;
  if (navigator.onLine === false){ toast('Sin conexión: no se pudo buscar.'); return; }
  APPV.buscando = true; pintarVersion();
  APPV.reg.update().then(() => {
    APPV.ultima = Date.now();
    const reg = APPV.reg;
    if (reg.waiting && navigator.serviceWorker.controller){ marcarNueva(); return; }
    if (reg.installing) return;   // la está bajando: vigilarInstalacion avisa cuando termina
    APPV.buscando = false; pintarVersion(); toast('Ya tenés la versión más reciente.');
  }).catch(() => { APPV.buscando = false; pintarVersion(); toast('Sin conexión: no se pudo buscar.'); });
}
function actualizarApp(){
  const w = APPV.reg && APPV.reg.waiting;
  if (!w){ location.reload(); return; }
  APPV.recargar = true;
  try { sessionStorage.setItem('kasa-actualizada', '1'); } catch(e){}
  w.postMessage('actualizar');
  setTimeout(() => location.reload(), 3000);   // por si el teléfono no avisa el cambio
}
function avisoActualizada(){
  let hecho = false;
  try { hecho = sessionStorage.getItem('kasa-actualizada') === '1'; sessionStorage.removeItem('kasa-actualizada'); } catch(e){}
  if (hecho) toast('Listo: ya tenés la versión ' + KASA_VERSION.v + '.');
}

/* ---------- Instalación guiada (solo cuando Kasa se abre en el navegador) ----------
   Tarjeta arriba de la unidad actual. «Instalar» abre el cuadro de instalación de Chrome si el navegador ya lo
   permite (Chrome lo habilita después de un toque y unos 30 s en la página); si todavía no, o en otro navegador,
   una hoja con los pasos del menú ⋮ (o de Safari, en iPhone). Instalada, la tarjeta pasa a «Listo». Con la app
   abierta desde su ícono no aparece nunca. Se guarda el aviso de Chrome para que no muestre su propio cartel. */
const INST = {aviso: null, lista: false};
const ICON_TICK = '<svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M5 11.5l4 4 8-9" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const ICON_KEBAB = '<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="3.5" r="1.9" fill="#1F2A44"/><circle cx="9" cy="9" r="1.9" fill="#1F2A44"/><circle cx="9" cy="14.5" r="1.9" fill="#1F2A44"/></svg>';
const ICON_SHARE = '<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#2B4C7E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 8H5v9.5h10V8h-1.5"/><path d="M10 12.5V2.5M6.8 5.5 10 2.3l3.2 3.2"/></svg>';
function enNavegador(){
  try {
    if (['standalone', 'fullscreen', 'minimal-ui'].some(m => window.matchMedia('(display-mode: ' + m + ')').matches)) return false;
  } catch(e){}
  return !window.navigator.standalone;   // iPhone: abierta desde el ícono
}
function esIOS(){ return /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); }
// Samsung Internet arma el paquete de la app con una versión vieja de Android y Android 14 en adelante lo bloquea
// (problema de Samsung, sin arreglo desde la página): desde ahí se ofrece seguir en Chrome, que lo arma bien.
function esSamsung(){ return /SamsungBrowser/i.test(navigator.userAgent); }
function chromeIntent(){ return 'intent://' + location.host + location.pathname + location.search + '#Intent;scheme=https;package=com.android.chrome;end'; }
function instalarHTML(){
  if (!enNavegador()) return '';
  if (INST.lista) return '<div class="inst ok" id="inst" role="status"><span class="inst-tick">' + ICON_TICK + '</span><span><b>Listo: Kasa ya está entre tus apps</b><small>Abrila desde tu pantalla de inicio. Así funciona sin conexión.</small></span></div>';
  return '<div class="inst" id="inst"><img class="inst-ic" src="iconos/icono-192.png" alt=""><span><b>Instalá Kasa en tu teléfono</b><small>Queda entre tus apps y funciona sin conexión.</small></span><button class="btn small primary" data-act="instalar">Instalar</button></div>';
}
function pintarInstalar(){ const el = document.getElementById('inst'); if (el) el.outerHTML = instalarHTML(); }
function marcarInstalada(){ INST.lista = true; INST.aviso = null; if (document.querySelector('.inst-back')) closeSheet(true); pintarInstalar(); }
function hojaInstalar(cuerpo, acciones){
  closeSheet();
  const el = document.createElement('div');
  el.className = 'sheet-back inst-back';
  el.innerHTML = '<div class="sheet conf" role="dialog" aria-modal="true" aria-labelledby="instT"><div class="inst-head"><img class="inst-ic" src="iconos/icono-192.png" alt=""><h2 id="instT">Instalar Kasa</h2></div>' + cuerpo +
    '<div class="actions stack">' + acciones + '</div></div>';

function abrirPasos(){
  const K = '<span class="tecla" role="img" aria-label="el menú de tres puntos">' + ICON_KEBAB + '</span>';
  const cuerpo = esIOS()
    ? '<ol class="pasos"><li><span class="n">1</span><span>Tocá <span class="tecla" role="img" aria-label="el botón Compartir">' + ICON_SHARE + '</span> <b>Compartir</b>, en la barra de Safari.</span></li>' +

      '<li><span class="n">2</span><span>Elegí <b>«Instalar app»</b>. Si dice «Agregar a la pantalla principal», tocá esa y después <b>«Instalar»</b>.</span></li></ol>' +
      '<div class="inst-nota">Si abriste el enlace desde otra app, como Gmail, primero tocá ' + K + ' y <b>«Abrir en Chrome»</b>.</div>';

function abrirSamsung(){

    '<button class="btn primary wide center" data-act="abrirchrome">Abrir en Chrome</button><button class="btn wide center" data-act="close">Ahora no</button>');
}
function abrirChrome(){ closeSheet(true); location.href = chromeIntent(); }
function instalar(){
  if (esSamsung()){ abrirSamsung(); return; }
  const a = INST.aviso;
  if (!a){ abrirPasos(); return; }
  INST.aviso = null;   // el cuadro de Chrome se puede abrir una sola vez por aviso
  try {
    a.prompt();
    Promise.resolve(a.userChoice).then(r => { if (r && r.outcome === 'accepted') marcarInstalada(); }).catch(() => {});
  } catch(e){ abrirPasos(); }
}
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); INST.aviso = e; });
window.addEventListener('appinstalled', marcarInstalada);
// Si ya está instalada y se abre el enlace en una pestaña, la tarjeta lo dice
if (enNavegador() && typeof navigator.getInstalledRelatedApps === 'function'){
  navigator.getInstalledRelatedApps().then(l => { if (l && l.length) marcarInstalada(); }).catch(() => {});
}

/* ---------- Lecciones ---------- */
function exLine(e){
  return '<button class="ex" data-act="say" data-jp="' + esc(e.k) + '">' + '<span class="ex-play" aria-hidden="true">' + ICON_PLAY + '</span><span class="ex-t"><span class="jp">' + esc(e.k) + '</span><span class="rom">' + esc(e.r) + '</span><span class="es">' + jpify(esc(e.es)) + '</span></span></button>';
}
const fmt = s => jpify(esc(s)).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\*(.+?)\*/g, '<i>$1</i>');
// Marca «dónde se retoma»: anuncia sin adelantar (principio 9)
const markLine = t => '<p class="mk-line">→ ' + fmt(t) + '</p>';
function renderBlocks(bs){
  return bs.map(b => {
    if (b.p) return '<p>' + fmt(b.p) + '</p>';
    if (b.note) return '<p class="note">' + fmt(b.note) + '</p>';
    if (b.mk) return markLine(b.mk);
    if (b.html) return b.html;
    if (b.ex) return '<div class="exs">' + b.ex.map(exLine).join('') + '</div>';
    return '';
  }).join('');
}
function practiceBar(L, label, secondary){
  const n = L.type === 'review' ? 20 : null;
  const hint = isDone(L.id) ? '' : '<p class="pass-hint">Se aprueba con ' + PASS + ' % de respuestas correctas; al aprobar se destraba la lección siguiente.</p>';
  return '<div class="actions"><a class="btn ' + (secondary ? '' : 'primary ') + 'wide" href="#/p/' + L.id + '">' + esc(label || 'Practicar') + (n ? ' (' + n + ' preguntas)' : '') + '</a>' + hint + '</div>';
}
function lessonHeader(L){
  const u = UNITS.find(x => x.id === L.unit);
  return topNav('#/u/' + u.id, 'Unidad ' + u.id) +
    '<header class="page-h"><p class="u-label">' + TYPE_LABEL[L.type] + '</p><h1>' + jpify(esc(L.title)) + '</h1>' + (L.intro ? '<p class="lede">' + jpify(esc(L.intro)) + '</p>' : '') + '</header>';
}

function renderLocked(L){
  const i = ALL_LESSONS.indexOf(L), prev = ALL_LESSONS[i - 1], target = lockTarget(L.id);
  const txt = target === prev
    ? 'Se destraba al aprobar «' + prev.title + '» con ' + PASS + ' % o más.'
    : 'Se destraba al aprobar las lecciones anteriores con ' + PASS + ' % o más. La que sigue en tu camino es «' + target.title + '».';
  return lessonHeader(L) + '<div class="locked-box"><p>' + jpify(esc(txt)) + '</p><a class="btn primary wide has-kicker" href="#/l/' + target.id + '"><span class="btn-kicker">Ir a</span>' + '<span>' + jpify(esc(target.title)) + '</span>' + '</a></div>';
}
function renderLesson(id){
  const L = LESSON[id];
  if (!L) return renderHome();
  if (!isUnlocked(id)) return renderLocked(L);
  let body = '';
  if (L.type === 'kana'){
    body += '<div class="kana-grid">' + L.set.map(k => kanaCell(k)).join('') + '</div>';
    body += '<p class="hint">Tocá cada kana para escucharlo, ver cómo recordarlo y practicar el trazo con el dedo.</p>';
    if (L.daku){
      body += '<h2>Con marcas: ゛ y ゜</h2><p>' + jpify(esc(L.dakuIntro)) + '</p>';
      body += '<div class="kana-grid small">' + L.daku.map(k => kanaCell(k)).join('') + '</div>';
    }
    // lecciones que destraban frases: el aviso muestra la cantidad, no las frases
    const fr = phrasesOf(L.id);
    if (fr.length && !isDone(L.id)) body += '<p class="unlock-note">Al aprobar, destrabás ' + fr.length + ' frases.</p>';
    if (fr.length && isDone(L.id) && !hitoSeen(L.id)) body += '<div class="actions">' + hitoBtn(L.id, fr.length) + '</div>' + practiceBar(L, null, true);
    else body += practiceBar(L);
    if (fr.length && isDone(L.id) && hitoSeen(L.id)) body += '<h2>Las frases que destrabaste</h2>' + phraseListHTML(fr, L.unit);
  } else if (L.type === 'vocab' && L.cycle){
    // lección en ciclo: la lista queda como repaso, una vez hecha la lección
    body += practiceBar(L, 'Empezar');
    if (isDone(L.id)) body += '<h2>Repaso: las palabras de la lección</h2>' + wordListHTML(L);
  } else if (L.type === 'vocab' || L.type === 'phrases'){
    body += wordListHTML(L);
    body += practiceBar(L);
  } else if (L.type === 'concept' || L.type === 'grammar'){
    // lecciones de mapa: el romaji queda siempre a la vista, aunque esté apagado en Ajustes
    const art = '<article class="lesson-text' + (L.map ? ' keep-rom' : '') + '">' + L.sections.map(s => '<section><h2>' + jpify(esc(s.h)) + '</h2>' + renderBlocks(s.b) + '</section>').join('') + '</article>';
    body += L.unit >= 3 && !L.map ? romBar(false) + '<div class="rom-wrap">' + art + '</div>' : art;
    body += practiceBar(L, L.type === 'concept' ? 'Comprobar lo que entendiste' : 'Practicar');
  } else if (L.type === 'listen'){

// Mide el grosor de los trazos del modelo: dibuja el kana en un lienzo invisible y,
// para cada píxel de tinta, calcula su distancia al borde (transformada de distancia).
// En el centro de un trazo esa distancia es la mitad del ancho, sin importar la inclinación.
function measureStroke(k, size, el){
  try {
    const cs = getComputedStyle(el);
    const c = document.createElement('canvas');
    const N = Math.max(40, Math.round(size));
    c.width = c.height = N;
    const x = c.getContext && c.getContext('2d');
    if (!x) return 0;
    x.font = cs.fontWeight + ' ' + cs.fontSize + ' ' + cs.fontFamily;
    x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillStyle = '#000';
    x.fillText(k, N / 2, N / 2);
    const data = x.getImageData(0, 0, N, N).data;
    const INF = 1e6, d = new Float32Array(N * N);
    let ink = 0;
    for (let i = 0; i < N * N; i++){ const on = data[i * 4 + 3] > 140; d[i] = on ? INF : 0; if (on) ink++; }
    if (ink < N * 2) return 0;
    const D = 1, Q = Math.SQRT2;
    const relax = (i, j, w) => { const v = d[j] + w; if (v < d[i]) d[i] = v; };
    for (let y = 0; y < N; y++) for (let xx = 0; xx < N; xx++){
      const i = y * N + xx; if (!d[i]) continue;
      if (xx > 0) relax(i, i - 1, D);
      if (y > 0){ relax(i, i - N, D); if (xx > 0) relax(i, i - N - 1, Q); if (xx < N - 1) relax(i, i - N + 1, Q); }
    }
    const dist = [];
    for (let y = N - 1; y >= 0; y--) for (let xx = N - 1; xx >= 0; xx--){
      const i = y * N + xx; if (!d[i]) continue;
      if (xx < N - 1) relax(i, i + 1, D);
      if (y < N - 1){ relax(i, i + N, D); if (xx < N - 1) relax(i, i + N + 1, Q); if (xx > 0) relax(i, i + N - 1, Q); }
      dist.push(d[i]);
    }
    dist.sort((a, b) => a - b);
    const half = dist[Math.floor(dist.length * 0.9)];   // el percentil alto corresponde al centro del trazo
    if (!half || half >= INF) return 0;
    return Math.min(size * 0.07, Math.max(size * 0.02, half * 2));
  } catch(e){ return 0; }
}

function setupTrace(root, k){
  const wrap = root.querySelector('.trace-wrap');
  const c = wrap.querySelector('canvas');
  const model = wrap.querySelector('.trace-sq');
  const rect = wrap.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  c.width = Math.round(rect.width * dpr); c.height = Math.round(rect.height * dpr);
  const ctx = c.getContext && c.getContext('2d');
  if (!ctx) return;
  ctx.scale(dpr, dpr);
  const color = getComputedStyle(document.documentElement).getPropertyValue('--ai').trim() || '#2B4C7E';
  ctx.strokeStyle = color; ctx.fillStyle = color;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const setWidth = () => { ctx.lineWidth = 0.9 * (measureStroke(k, rect.width, model) || rect.width * 0.038); };
  setWidth();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (c.isConnected) setWidth(); }).catch(() => {});

  let drawing = false, pts = [], raws = [], emitted = 0;
  const MIN = 3, BASE = 9, TURN = 1.2;
  const pt = e => { const r = c.getBoundingClientRect(); return {x: e.clientX - r.left, y: e.clientY - r.top}; };
  const mid = (a, b) => ({x: (a.x + b.x) / 2, y: (a.y + b.y) / 2});
  const seg = (from, ctrl, to) => { ctx.beginPath(); ctx.moveTo(from.x, from.y); if (ctrl) ctx.quadraticCurveTo(ctrl.x, ctrl.y, to.x, to.y); else ctx.lineTo(to.x, to.y); ctx.stroke(); };
  const d2 = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  // dirección del trazo antes y después de un punto, medida sobre BASE px para que el temblor no la desvíe
  const dirBack = i => { let j = i, acc = 0; while (j > 0 && acc < BASE){ acc += d2(raws[j], raws[j - 1]); j--; } return Math.atan2(raws[i].y - raws[j].y, raws[i].x - raws[j].x); };
  const dirFwd = i => { let j = i, acc = 0; while (j < raws.length - 1 && acc < BASE){ acc += d2(raws[j], raws[j + 1]); j++; } return Math.atan2(raws[j].y - raws[i].y, raws[j].x - raws[i].x); };
  const turnAt = i => { if (i < 1 || i > raws.length - 2) return 0; let t = dirFwd(i) - dirBack(i); while (t > Math.PI) t -= 2 * Math.PI; while (t < -Math.PI) t += 2 * Math.PI; return Math.abs(t); };
  const blend = (list, ws) => { let x = 0, y = 0, s = 0; list.forEach((p, k) => { x += p.x * ws[k]; y += p.y * ws[k]; s += ws[k]; }); return {x: x / s, y: y / s}; };
  // filtro centrado: promedia cada punto con sus vecinos de los dos lados, así no queda retrasado.
  // En un vértice no se filtra, y cerca de un vértice se filtra menos: el codo queda en punta.
  const filtered = i => {
    const t = turnAt(i);
    if (t > TURN) return raws[i];
    const p = raws[i], b1 = raws[i - 1] || p, f1 = raws[i + 1] || p;
    if (t > TURN * 0.55 || i < 2 || i > raws.length - 3) return blend([b1, p, f1], [1, 2, 1]);
    return blend([raws[i - 2], b1, p, f1, raws[i + 2]], [1, 4, 6, 4, 1]);
  };
  const emitUpTo = limit => {
    for (let i = emitted + 1; i <= limit; i++){
      pts.push(filtered(i)); emitted = i;
      const n = pts.length;
      if (n === 2) seg(pts[0], null, mid(pts[0], pts[1]));
      else if (n > 2) seg(mid(pts[n - 3], pts[n - 2]), pts[n - 2], mid(pts[n - 2], pts[n - 1]));
    }
  };

  c.addEventListener('pointerdown', e => {
    drawing = true; try { c.setPointerCapture(e.pointerId); } catch(_){}
    const p = pt(e); pts = [p]; raws = [p]; emitted = 0;
    ctx.beginPath(); ctx.arc(p.x, p.y, ctx.lineWidth / 2, 0, Math.PI * 2); ctx.fill();
    e.preventDefault();
  });
  c.addEventListener('pointermove', e => {
    if (!drawing) return;
    const raw = pt(e), last = raws[raws.length - 1];
    const dx = raw.x - last.x, dy = raw.y - last.y;
    if (dx * dx + dy * dy < MIN * MIN) return;   // muestrea cada 3 px: descarta el micro temblor
    raws.push(raw);
    emitUpTo(raws.length - 3);                   // dibuja con dos muestras de demora (unos 6 px)
    e.preventDefault();
  });
  const stop = () => {
    if (drawing){
      emitUpTo(raws.length - 1);
      const n = pts.length;
      if (n >= 2) seg(mid(pts[n - 2], pts[n - 1]), null, pts[n - 1]);
    }
    drawing = false;
  };
  c.addEventListener('pointerup', stop); c.addEventListener('pointercancel', stop); c.addEventListener('pointerleave', stop);
  root._clear = () => { pts = []; raws = []; emitted = 0; ctx.clearRect(0, 0, rect.width, rect.height); };
}

let Q = null;
function startQuiz(id){
  let items, back, title;
  if (id === 'repaso'){
    items = kanaReview([...learnedKana()], S.kana, 20);
    back = '#/'; title = 'Repaso de kana';
  } else if (id === 'palabras'){
    items = wordRound(wordPool(), S.words.stats, 10);
    back = '#/palabras'; title = 'Mis palabras';
  } else if (id.indexOf('hito-') === 0){
    // «¡Ya podés leer!»: una tarjeta por frase, la pregunta de uso (no suma) y el cierre
    const lid = id.slice(5), L = LESSON[lid], fr = phrasesOf(lid);
    if (!L || !fr.length || !isDone(lid)) return false;
    items = fr.map((p, i) => ({type:'hito', ph:p, n:i + 1, of:fr.length, open:false}));
    if (L.uso) items.push(Object.assign(fixedQ(L.uso), {free:true}));
    back = '#/l/' + lid; title = 'Ya podés leer';
    S.hitos[lid] = true; save();
  } else {
    const L = LESSON[id];
    if (!L) return false;
    items = buildQuiz(L); back = '#/l/' + id; title = L.title;
  }
  const scored = items.reduce((n, q) => n + (q.free || q.type === 'present' || q.type === 'hito' ? 0 : q.type === 'pairs' ? q.words.length : 1), 0);
  Q = {id, items, i:0, score:0, wrong:[], back, title, answered:false, placed:[], total:scored, repeats:0};
  if (id.indexOf('hito-') === 0) Q.hito = id.slice(5);
  return true;
}
function renderQuizScreen(){
  if (!Q.items.length && Q.id === 'palabras'){
    return topNav('#/palabras', 'Mis palabras') + '<header class="page-h"><h1>Todavía faltan palabras</h1><p class="lede">Para practicar con tarjetas hacen falta al menos 4 palabras. Aprobá alguna lección de palabras o agregá las tuyas.</p></header><div class="actions stack"><a class="btn primary wide center" href="#/palabras/nueva">Agregar palabra</a><a class="btn wide center" href="#/l/1-v1">Ir a «Palabras 1»</a></div>';
  }

// Hito, en dos momentos. Primero la frase sola, con la llave en verde: ni audio, ni romaji, ni significado.
// Al tocar «Ver cómo se lee», la tarjeta crece en el lugar y suena el audio. Romaji: en la unidad 2
// aparece al revelar; desde la 3 sigue detrás de su botón (la comprobación de la lectura es el audio).
function hitoHTML(q){
  const p = q.ph, L = LESSON[p.h], keys = phraseKeys(p);
  const lines = p.k.split(' ');
  const long = Math.max(...lines.map(x => x.length)) >= 6;
  const phrase = '<p class="jp hito-phrase' + (long ? ' long' : '') + '">' + lines.map(x => '<span class="ln">' + [...x].map(c => keys.includes(c) ? '<span class="key">' + esc(c) + '</span>' : esc(c)).join('') + '</span>').join('') + '</p>';
  const keyTxt = (keys.length === 1 ? keys[0] : keys.slice(0, -1).join(', ') + ' y ' + keys[keys.length - 1]) + (keys.length === 1 ? ', la llave de esta lección' : ', las llaves de esta lección');
  const keyLine = '<p class="hito-key">' + jpify(esc(keyTxt)) + '</p>';
  const top = '<div class="present-top"><span class="present-count">' + q.n + ' de ' + q.of + '</span><span class="badge-new">¡Ya podés leer!</span></div>';
  let card, btn;
  if (!q.open){
    card = '<div class="present-card pre">' + top + phrase + keyLine + '<p class="hito-try">Probá leerla en voz alta.</p></div>';
    btn = '<button class="btn primary wide center hito-go" data-act="hitoread">Ver cómo se lee</button>';
  } else {
    const u3 = L.unit >= 3;
    const read = p.leer ? '<p class="hito-read"><b>Al leer:</b> ' + jpify(esc(p.leer)) + (p.mk ? '<span class="mk">→ ' + jpify(esc(p.mk)) + '</span>' : '') + '</p>' : '';
    card = '<div class="present-card">' + top + phrase +
      '<p class="present-rom" id="presRom"' + (u3 ? ' hidden' : '') + '>' + esc(p.r) + '</p>' + keyLine +
      '<p class="present-es">' + jpify(esc(p.es)) + '</p>' +

function pairTap(b){

  if (prev !== null) btn(side, prev).classList.remove('sel');

  const l = Q.sel.l, r = Q.sel.r;

    [bl, br].forEach(x => { x.classList.add('done'); x.disabled = true; });
    Q.matched++;
    SFX.par(Q.matched - 1);   // cada par correcto sube una nota de la escala
    if (Q.matched === q.words.length) pairsDone(q);
  } else {
    Q.pairErr++;
    SFX.parError();

function pairsDone(q){
  Q.answered = true;

  if (sobra){ sobra.disabled = true; sobra.classList.add('spare'); }
  const perdidas = [...Q.pairFail].map(i => q.words[i]);
  const bien = q.words.length - perdidas.length;
  if (!q.retry){
    Q.score += bien;
    const pool = LESSON[Q.id] ? vocabPoolUpTo(Q.id) : q.words;
    perdidas.forEach(w => {
      Q.wrong.push({sum: 'Emparejar: ' + w.k + ' → ' + w.es});
      const r = vocabQuestion(w, pool, 'w2m');
      Q.items.push(Object.assign(r, {retry:true, tries:1}));   // vuelve antes de terminar, sin puntaje
      Q.repeats++;

  const sub = perdidas.length
    ? (perdidas.length === 1 ? 'Vuelve a aparecer antes de terminar: ' : 'Vuelven a aparecer antes de terminar: ') + perdidas.map(w => '<span class="jp">' + esc(w.k) + '</span>').join(', ') + '.'

function requeue(q){
  if ((q.tries || 0) >= 2) return false;           // tope: no vuelve más de dos veces
  const copy = Object.assign({}, q, {retry:true, tries:(q.tries || 0) + 1});
  if (copy.opts){
    const order = shuffle(q.opts.map((o, i) => i));
    copy.opts = order.map(i => q.opts[i]);
    copy.a = order.indexOf(q.a);
  }
  if (copy.type === 'order') copy.tiles = shuffle(q.tiles);
  Q.items.push(copy);
  Q.repeats++;
  return true;
}
function record(q, ok, given){
  if (q.free) return;                                 // pregunta de uso del hito: no suma, no vuelve
  if (q.retry){ if (!ok) requeue(q); return; }      // las repeticiones no puntúan ni cuentan para las estadísticas
  if (ok) Q.score++; else { Q.wrong.push(q); requeue(q); }
  if (q.kk){ const s = S.kana[q.kk] || [0, 0]; S.kana[q.kk] = [s[0] + 1, s[1] + (ok ? 0 : 1)]; save(); }
  if (q.wk){
    const st = S.words.stats[q.wk] || {s:0, e:0, st:0};
    S.words.stats[q.wk] = {s: st.s + 1, e: st.e + (ok ? 0 : 1), st: ok ? st.st + 1 : 0, t: Date.now()};
    const d = dayKey(), lg = S.words.log[d] || [0, 0];
    S.words.log[d] = [lg[0] + (ok ? 1 : 0), lg[1] + 1];
    const cutoff = dayKey(Date.now() - 60 * 864e5);
    Object.keys(S.words.log).forEach(k => { if (k < cutoff) delete S.words.log[k]; });
    touchWords(); save();
  }
}

// en chico (dibujo o kanji; el texto del dato solo si no hay asociación)
function hookHTML(w, q){
  if (!w || !w.k || !w.es || !(w.aso || w.x)) return '';
  const x = w.x || {};
  // un dato cultural no ayuda a recordar la palabra: al fallar solo se muestran asociación, dibujo o kanji
  if (!w.aso && x.t === 'cultura') return '';
  let fig = '', txt = '';
  if (x.t === 'dibujo' && ILL[x.ill] && !(q.show && q.show.ill)){
    const zs = ZONAS[x.ill], varias = zs && Object.keys(zs).length > 1;
    fig = varias && x.zona ? illHTML(x.ill, x.zona) : ILL[x.ill];
  } else if (x.t === 'kanji') fig = '<span class="hook-k">' + esc(x.kanji) + '</span>';
  if (w.aso) txt = w.aso;
  else if (x.t === 'kanji') txt = x.parts.map(pp => pp[0] + ' ' + pp[1]).join(' + ') + '. ' + x.text;
  else if (x.text && x.t !== 'cultura') txt = x.text;
  if (!fig && !txt) return '';
  if (!txt) txt = 'el dibujo con que se presentó.';
  return '<div class="feed-hook">' + fig + '<p><b>Para recordarla:</b> ' + jpify(esc(txt)) + '</p></div>';
}
